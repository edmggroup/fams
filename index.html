/* ============================================================
   GENERIC MODULE ENGINE — one list/search/table renderer and one
   form-drawer renderer, driven entirely by a MODULES[key] config.
   Every built-in module (and any you add later) gets a working
   list + add/edit/notes/delete screen for free from this.
   ============================================================ */
function fieldByKey(mod, key){ return mod.fields.find(f=>f.key===key); }

function moduleDisplayColumns(mod){
  const cols = [];
  const titleF = fieldByKey(mod, mod.titleField);
  if(titleF) cols.push(titleF);
  if(mod.dateField){
    const df = fieldByKey(mod, mod.dateField);
    if(df && cols.indexOf(df)===-1) cols.push(df);
  }
  // A subtable field (e.g. "Members") is never itself a plain column — it's
  // a whole mini-table — but its row count is genuinely useful in the list
  // view, so a slot for it is reserved UP FRONT (before the general fields
  // loop below fills the cap with other fields and leaves no room for it).
  const hasSubtable = mod.fields.some(f=>f.type === 'subtable');
  const cap = hasSubtable ? 5 : 7;
  mod.fields.forEach(f=>{
    if(cols.length >= cap) return;
    if(cols.indexOf(f) !== -1) return;
    if(f.type === 'textarea' || f.type === 'subtable' || f.type === 'multiselect') return;
    // When the list is grouped by this field, its value is shown once at
    // the top of each group instead of repeated on every row — so it's
    // left out of the per-row columns (unless it doubles as the title/date
    // column already pinned above, which stays put either way).
    if(mod.groupByField && f.key === mod.groupByField) return;
    cols.push(f);
  });
  mod.fields.forEach(f=>{
    if(f.type === 'subtable' && cols.indexOf(f) === -1) cols.push(f);
  });
  return cols;
}

function statusBadgeClass(v){
  const s = String(v).toLowerCase();
  if(['completed','done','approved','resolved','active','held','on track','ok'].indexOf(s) !== -1) return 'badge-ok';
  if(['cancelled','rejected','delayed'].indexOf(s) !== -1) return 'badge-danger';
  if(['pending','open','applied','scheduled','planned','assigned','in progress'].indexOf(s) !== -1) return 'badge-warn';
  return 'badge-neutral';
}
function fieldDisplayValue(mod, field, rec){
  const v = rec[field.key];
  if(field.type === 'reference') return escapeHtml(refLabel(field.ref, v));
  if(field.type === 'moduleRef') return v ? escapeHtml((MODULES[v] && MODULES[v].label) || v) : '<span style="color:var(--text-faint)">—</span>';
  if(field.type === 'categoryRef'){
    const c = NAV_CATEGORIES.find(c=>c.key===v);
    return c ? escapeHtml(c.icon + ' ' + c.label) : '<span style="color:var(--text-faint)">—</span>';
  }
  if(field.type === 'recordRef'){
    const depModKey = rec[field.dependsOn];
    return (depModKey && v) ? escapeHtml(refLabel(depModKey, v)) : '<span style="color:var(--text-faint)">—</span>';
  }
  if(field.type === 'date') return v ? escapeHtml(fmtDate(v)) : '<span style="color:var(--text-faint)">—</span>';
  if(field.type === 'datetime') return v ? escapeHtml(fmtDateTime(v)) : '<span style="color:var(--text-faint)">—</span>';
  if(field.type === 'time') return v ? escapeHtml(fmtTime12(v)) : '<span style="color:var(--text-faint)">—</span>';
  if(field.type === 'multiselect'){
    const list = Array.isArray(v) ? v : [];
    return list.length ? list.map(o=>'<span class="badge badge-neutral" style="margin:0 4px 4px 0;">' + escapeHtml(o) + '</span>').join('') : '<span style="color:var(--text-faint)">—</span>';
  }
  if(field.type === 'url'){
    if(!v) return '<span style="color:var(--text-faint)">—</span>';
    const href = /^https?:\/\//i.test(v) ? v : 'https://' + v;
    return '<a href="' + escapeHtml(href) + '" target="_blank" rel="noopener">' + escapeHtml(v) + '</a>';
  }
  if(field.type === 'subtable'){
    const rows = Array.isArray(v) ? v : [];
    if(field.fixedRows){
      // Fixed-row mode (e.g. Sem-1..Sem-6): every slot always exists in
      // storage even before its mark is entered, so "rows.length" alone
      // would always just say the total — the useful number here is how
      // many slots actually have something filled in yet. The preview shows
      // each filled row's actual values (e.g. "Sem-1: 85/Pass"), not just
      // which row labels have something — a row label alone doesn't tell
      // you the mark itself without opening the record.
      const resolved = resolveFixedRows(field, rows).map((r, i)=>Object.assign({}, r, { _rowLabel: field.fixedRows[i] }));
      const filledRows = resolved.filter(r=>field.subfields.some(sf=>r[sf.key]));
      if(filledRows.length === 0) return '<span style="color:var(--text-faint)">—</span>';
      const preview = filledRows.slice(0,4).map(r=>{
        const vals = field.subfields.map(sf=>r[sf.key]).filter(Boolean).join('/');
        return escapeHtml(r._rowLabel) + ': ' + escapeHtml(vals);
      }).join(', ');
      return '<span class="badge badge-ok">' + filledRows.length + ' / ' + field.fixedRows.length + ' ' + escapeHtml(field.rowLabelPlural || field.rowLabel || 'entries') + '</span>'
        + (preview ? '<div style="font-size:11.5px;color:var(--text-dim);margin-top:3px;">' + preview + (filledRows.length>4?'…':'') + '</div>' : '');
    }
    if(rows.length === 0) return '<span style="color:var(--text-faint)">—</span>';
    const firstKey = field.subfields[0].key;
    const names = rows.map(r=>r[firstKey]).filter(Boolean).slice(0,3).join(', ');
    return '<span class="badge badge-ok">' + rows.length + ' ' + escapeHtml(rows.length===1 ? (field.rowLabel||'member') : (field.rowLabelPlural||(field.rowLabel||'member')+'s')) + '</span>'
      + (names ? '<div style="font-size:11.5px;color:var(--text-dim);margin-top:3px;">' + escapeHtml(names) + (rows.length>3?'…':'') + '</div>' : '');
  }
  if(v === null || v === undefined || v === '') return '<span style="color:var(--text-faint)">—</span>';
  if(field.key === 'status') return '<span class="badge ' + statusBadgeClass(v) + '">' + escapeHtml(v) + '</span>';
  return escapeHtml(String(v));
}

let LIST_SELECTION = new Set();
// Which single group (e.g. one Batch, or one month) the list is currently
// filtered down to — '' means "show everyone, grouped" (the default).
let LIST_GROUP_FILTER = '';

function renderModuleList(moduleKey){
  const mod = MODULES[moduleKey];
  LIST_SELECTION = new Set();
  LIST_GROUP_FILTER = '';
  if(mod.readOnly){
    return '<div class="page-head"><div><h2>' + mod.icon + ' ' + escapeHtml(mod.label) + '</h2>'
      + '<p>' + getActive(moduleKey).length + ' entr' + (getActive(moduleKey).length===1?'y':'ies') + ' recorded</p></div></div>'
      + '<div class="search-bar"><input class="input" id="module-search" placeholder="Search…"></div>'
      + '<div class="table-wrap" id="module-table-wrap"></div>';
  }
  return '<div class="page-head"><div><h2>' + mod.icon + ' ' + escapeHtml(mod.label) + '</h2>'
    + '<p>' + getActive(moduleKey).length + ' active record(s)</p></div>'
    + '<div style="display:flex;gap:8px;flex-wrap:wrap;">'
    + '<button class="btn btn-ghost" id="bulk-import-btn">⬆ Bulk Import</button>'
    + '<button class="btn btn-primary" id="add-record-btn">+ Add ' + escapeHtml(mod.label) + '</button>'
    + '</div></div>'
    + '<div class="search-bar"><input class="input" id="module-search" placeholder="Search…">'
    + '<label style="display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-dim);">'
    + '<input type="checkbox" id="show-deleted"> Show deleted</label></div>'
    + '<div id="bulk-toolbar"></div>'
    + '<div class="table-wrap" id="module-table-wrap"></div>';
}

/** The value a record groups under, for modules that cluster their list
 *  view instead of showing one flat table — either an exact field value
 *  (mod.groupByField, e.g. admin-defined "Batch") or the calendar month of
 *  its dateField (mod.groupByMonth, e.g. Work Diary: "one month's entries
 *  together, then the next month starts"). Returns null for modules that
 *  don't group at all. */
function rowGroupKey(mod, r){
  if(mod.groupByField) return (r[mod.groupByField] || '').trim() || '(no ' + (fieldByKey(mod, mod.groupByField) || {label:'value'}).label.toLowerCase() + ')';
  if(mod.groupByMonth && mod.dateField){
    const d = r[mod.dateField];
    return d ? String(d).slice(0, 7) : '(no date)';
  }
  return null;
}
function rowGroupLabel(mod, key){
  if(mod.groupByMonth && /^\d{4}-\d{2}$/.test(key)){
    const parts = key.split('-');
    return MONTH_LONG[Number(parts[1]) - 1] + ' ' + parts[0];
  }
  return key;
}
function moduleRowHtml(mod, cols, r, selectable, moduleKey){
  let html = '<tr data-id="' + r.id + '"' + (r.deleted ? ' style="opacity:.5;"' : '') + '>';
  if(selectable) html += '<td style="padding:10px 6px;border-bottom:1px solid var(--border);"><input type="checkbox" class="row-select" data-id="' + r.id + '"' + (LIST_SELECTION.has(r.id) ? ' checked' : '') + '></td>';
  cols.forEach((c, ci)=>{
    // The first (title) column on an auto-logged Work Diary entry gets a
    // small badge so it reads clearly as "captured automatically from
    // somewhere else" rather than looking like a duplicate manual entry.
    const badge = (ci === 0 && r.autoSource) ? ' <span style="font-size:10px;font-weight:700;color:var(--gold);background:#fbf3e2;padding:2px 6px;border-radius:8px;white-space:nowrap;" title="Auto-logged from ' + escapeHtml(r.autoSource.split(':')[0]) + '">🔗 Auto</span>' : '';
    html += '<td style="padding:10px 12px;border-bottom:1px solid var(--border);font-size:13px;">' + fieldDisplayValue(mod, c, r) + badge + '</td>';
  });
  if(selectable){
    html += '<td style="padding:8px 12px;border-bottom:1px solid var(--border);"><div class="row-actions">';
    if(!r.deleted){
      html += '<button class="btn btn-ghost btn-sm" data-action="edit">Edit</button>';
      html += '<button class="btn btn-ghost btn-sm" data-action="notes">Notes' + ((r.notes && r.notes.length) ? ' (' + r.notes.length + ')' : '') + '</button>';
      // A "Minutes" quick-edit button shows up on ANY module that happens to
      // have a "minutes" field (today that's just Meetings) — same
      // presence-based pattern as the Email/WhatsApp buttons below, so it's
      // not hardcoded to one module.
      if(mod.fields.some(f=>f.key==='minutes')) html += '<button class="btn btn-ghost btn-sm" data-action="minutes">📝 Minutes</button>';
      // "Action Required" is specific to Meetings — it raises a new Action
      // Item already linked back to this meeting (Action Items' own
      // "Meeting" reference field), a one-click shortcut for the very
      // common "this meeting needs a follow-up task" step.
      if(moduleKey === 'meetings') html += '<button class="btn btn-ghost btn-sm" data-action="raise-action">☑️ Action Required</button>';
      if(mod.fields.some(f=>f.key==='email')) html += '<button class="btn btn-ghost btn-sm" data-action="email" title="Email">✉️</button>';
      if(mod.fields.some(f=>f.key==='phone')) html += '<button class="btn btn-ghost btn-sm" data-action="whatsapp" title="WhatsApp">💬</button>';
      html += '<button class="btn btn-ghost btn-sm" data-action="delete">Delete</button>';
    }else{
      html += '<button class="btn btn-ghost btn-sm" data-action="restore">Restore</button>';
      html += '<button class="btn btn-danger btn-sm" data-action="purge">Purge</button>';
    }
    html += '</div></td>';
  }
  html += '</tr>';
  return html;
}
function moduleTableHtml(moduleKey, cols, search, showDeleted){
  const mod = MODULES[moduleKey];
  const selectable = !mod.readOnly;
  let rows = showDeleted ? getCollection(moduleKey) : getActive(moduleKey);
  if(search){
    const q = search.toLowerCase();
    rows = rows.filter(r => JSON.stringify(r).toLowerCase().indexOf(q) !== -1);
  }
  rows = rows.slice().sort((a,b)=>{
    if(mod.dateField) return String(b[mod.dateField]||'').localeCompare(String(a[mod.dateField]||''));
    return String(b.createdAt||'').localeCompare(String(a.createdAt||''));
  });
  if(rows.length === 0) return '<div class="empty">' + (mod.readOnly ? 'No activity recorded yet.' : ('No records yet. Click "Add ' + escapeHtml(mod.label) + '" to create the first one.')) + '</div>';
  const grouping = !!(mod.groupByField || mod.groupByMonth);
  const colspan = cols.length + (selectable ? 2 : 1);
  // A "Status"-style dropdown on a grouped module (e.g. UG Research's
  // "Present Status") gets a bulk "apply to whole group" control right in
  // the group header, alongside the group's own quick-add and export.
  const groupStatusField = (grouping && mod.groupByField) ? mod.fields.find(f=>f.type==='select' && /status/i.test(f.key)) : null;
  // Grouping data is computed up front (rather than inline further down) so
  // a "Filter by <Batch/month/…>" dropdown can be rendered ABOVE the table —
  // this actually shows the list one group at a time (e.g. UG Research one
  // Batch at a time) rather than just scrolling to it, so "show it
  // batch-wise" means what it says: pick a batch, see only that batch.
  // "— All —" (the default) goes back to today's grouped view of everyone.
  let groupOrder = [], groups = {};
  if(grouping){
    rows.forEach(r=>{
      const key = rowGroupKey(mod, r);
      if(!groups[key]){ groups[key] = []; groupOrder.push(key); }
      groups[key].push(r);
    });
  }
  // The active filter only applies if it's still a real group in THIS data
  // set (search text or a deletion can make a previously-picked batch
  // disappear) — otherwise silently fall back to showing everyone.
  const activeFilter = (grouping && LIST_GROUP_FILTER && groups[LIST_GROUP_FILTER]) ? LIST_GROUP_FILTER : '';
  const visibleGroupOrder = activeFilter ? [activeFilter] : groupOrder;
  const visibleRows = grouping ? visibleGroupOrder.reduce((acc,key)=>acc.concat(groups[key]), []) : rows;
  let html = '';
  if(grouping && groupOrder.length > 1){
    const jumpLabel = mod.groupByField ? ((mod.fields.find(f=>f.key===mod.groupByField)||{}).label || 'group') : 'month';
    html += '<div style="margin-bottom:10px;display:flex;align-items:center;gap:8px;">'
      + '<label style="font-size:12px;color:var(--text-dim);white-space:nowrap;">Filter by ' + escapeHtml(jumpLabel) + ':</label>'
      + '<select class="input input-sm" id="group-jump-select" style="width:auto;">'
      + '<option value=""' + (activeFilter ? '' : ' selected') + '>— All (' + rows.length + ') —</option>'
      + groupOrder.map(key=>'<option value="' + escapeHtml(key) + '"' + (key === activeFilter ? ' selected' : '') + '>' + escapeHtml(rowGroupLabel(mod, key)) + ' (' + groups[key].length + ')</option>').join('')
      + '</select></div>';
  }
  html += '<table style="width:100%;border-collapse:collapse;"><thead><tr>';
  if(selectable){
    const visibleIds = visibleRows.map(r=>r.id);
    const allSelected = visibleIds.length > 0 && visibleIds.every(id=>LIST_SELECTION.has(id));
    html += '<th style="width:34px;padding:10px 6px;border-bottom:1px solid var(--border);"><input type="checkbox" id="select-all-rows"' + (allSelected ? ' checked' : '') + '></th>';
  }
  cols.forEach(c=>{ html += '<th style="text-align:left;padding:10px 12px;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-dim);border-bottom:1px solid var(--border);">' + escapeHtml(c.label) + '</th>'; });
  if(selectable) html += '<th style="border-bottom:1px solid var(--border);"></th>';
  html += '</tr></thead><tbody>';
  if(!grouping){
    rows.forEach(r=>{ html += moduleRowHtml(mod, cols, r, selectable, moduleKey); });
  }else{
    visibleGroupOrder.forEach(key=>{
      const groupRows = groups[key];
      const safeKey = escapeHtml(key);
      html += '<tr class="group-header-row" data-group-key="' + safeKey + '"><td colspan="' + colspan + '" style="padding:10px 12px;background:#f4f6fb;border-bottom:1px solid var(--border);border-top:2px solid var(--border);">'
        + '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">'
        + '<strong style="font-size:13px;">' + escapeHtml(rowGroupLabel(mod, key)) + '</strong>'
        + '<span class="badge badge-neutral">' + groupRows.length + '</span>'
        + (mod.groupByField ? '<button class="btn btn-ghost btn-sm" data-action="group-add" data-group-value="' + safeKey + '">+ Add to this group</button>' : '')
        + '<button class="btn btn-ghost btn-sm" data-action="group-export" data-group-value="' + safeKey + '">📤 Export this group</button>'
        + (groupStatusField ? ('<span style="display:flex;align-items:center;gap:6px;margin-left:auto;">'
            + '<select class="input input-sm" style="width:auto;padding:4px 8px;" data-group-status-select data-group-value="' + safeKey + '"><option value="">Set ' + escapeHtml(groupStatusField.label) + ' for whole group…</option>'
            + (groupStatusField.options||[]).map(o=>'<option value="' + escapeHtml(o) + '">' + escapeHtml(o) + '</option>').join('') + '</select>'
            + '<button class="btn btn-ghost btn-sm" data-action="group-status-apply" data-group-value="' + safeKey + '" data-status-field="' + groupStatusField.key + '">Apply</button>'
            + '</span>') : '')
        + '</div></td></tr>';
      groupRows.forEach(r=>{ html += moduleRowHtml(mod, cols, r, selectable, moduleKey); });
    });
  }
  html += '</tbody></table>';
  return html;
}

function wireModuleList(moduleKey){
  const mod = MODULES[moduleKey];
  const cols = moduleDisplayColumns(mod);
  const wrap = document.getElementById('module-table-wrap');
  const searchEl = document.getElementById('module-search');
  const showDelEl = document.getElementById('show-deleted');
  const bulkToolbarEl = document.getElementById('bulk-toolbar');

  function renderBulkToolbar(){
    if(!bulkToolbarEl) return;
    const n = LIST_SELECTION.size;
    if(n === 0){ bulkToolbarEl.innerHTML = ''; return; }
    const hasEmail = mod.fields.some(f=>f.key==='email');
    bulkToolbarEl.innerHTML = '<div style="display:flex;align-items:center;gap:10px;background:#eef2fb;border:1px solid var(--border);border-radius:8px;padding:9px 14px;margin-bottom:10px;flex-wrap:wrap;">'
      + '<strong style="font-size:13px;">' + n + ' selected</strong>'
      + (hasEmail ? '<button class="btn btn-ghost btn-sm" id="bulk-email-btn">✉️ Email Selected</button>' : '')
      + '<button class="btn btn-ghost btn-sm" id="bulk-delete-btn" style="color:var(--danger);">🗑 Delete Selected</button>'
      + '<button class="btn btn-ghost btn-sm" id="bulk-clear-btn" style="margin-left:auto;">Clear</button>'
      + '</div>';
    const clearBtn = document.getElementById('bulk-clear-btn');
    if(clearBtn) clearBtn.addEventListener('click', ()=>{ LIST_SELECTION.clear(); refreshTable(); });
    const emailBtn = document.getElementById('bulk-email-btn');
    if(emailBtn) emailBtn.addEventListener('click', ()=>{
      const records = Array.from(LIST_SELECTION).map(id=>getRecord(moduleKey, id)).filter(Boolean);
      openEmailComposeDrawer(moduleKey, records, ()=>{ LIST_SELECTION.clear(); refreshTable(); });
    });
    const bulkDeleteBtn = document.getElementById('bulk-delete-btn');
    if(bulkDeleteBtn) bulkDeleteBtn.addEventListener('click', async ()=>{
      if(bulkDeleteBtn.disabled) return;
      if(!confirm('Delete ' + n + ' selected record(s)? You can restore them later from "Show deleted".')) return;
      bulkDeleteBtn.disabled = true;
      try{
        const ids = Array.from(LIST_SELECTION);
        for(const id of ids){
          const rec = getRecord(moduleKey, id);
          await softDeleteRecord(moduleKey, id);
          logAudit(moduleKey, 'Deleted', id, rec ? (rec[mod.titleField] || '') : '');
        }
        toast(ids.length + ' record(s) deleted', 'ok');
        LIST_SELECTION.clear();
        refreshTable();
      }finally{ bulkDeleteBtn.disabled = false; }
    });
  }

  function refreshTable(){
    wrap.innerHTML = moduleTableHtml(moduleKey, cols, searchEl.value, showDelEl ? showDelEl.checked : false);
    renderBulkToolbar();
  }
  refreshTable();
  searchEl.addEventListener('input', refreshTable);
  if(showDelEl) showDelEl.addEventListener('change', refreshTable);
  const addBtn = document.getElementById('add-record-btn');
  if(addBtn) addBtn.addEventListener('click', ()=>openModuleForm(moduleKey, null));
  const bulkImportBtn = document.getElementById('bulk-import-btn');
  if(bulkImportBtn) bulkImportBtn.addEventListener('click', ()=>openBulkImportDrawer(moduleKey, refreshTable));
  // "Filter by <Batch/month/…>" dropdown (see moduleTableHtml) — re-renders
  // the table showing only that one group (picking "— All —" goes back to
  // everyone, grouped). A plain 'change' listener on the wrap survives
  // refreshTable() re-rendering the select every time, since it's attached
  // to wrap itself, not the (replaced) select element.
  wrap.addEventListener('change', (e)=>{
    const jumpSelect = e.target.closest('#group-jump-select');
    if(!jumpSelect) return;
    LIST_GROUP_FILTER = jumpSelect.value;
    refreshTable();
  });
  wrap.addEventListener('click', async (e)=>{
    const selectAllBox = e.target.closest('#select-all-rows');
    if(selectAllBox){
      const rowBoxes = wrap.querySelectorAll('.row-select');
      if(selectAllBox.checked) rowBoxes.forEach(cb=>LIST_SELECTION.add(cb.dataset.id));
      else LIST_SELECTION.clear();
      refreshTable();
      return;
    }
    const rowBox = e.target.closest('.row-select');
    if(rowBox){
      if(rowBox.checked) LIST_SELECTION.add(rowBox.dataset.id);
      else LIST_SELECTION.delete(rowBox.dataset.id);
      renderBulkToolbar();
      return;
    }
    const btn = e.target.closest('[data-action]');
    if(!btn) return;
    const action = btn.dataset.action;
    // Group-header actions (only present when the module is grouped —
    // mod.groupByField/groupByMonth) act on a whole group at once, so they
    // live outside any single tr[data-id] and are handled first.
    if(action === 'group-add'){
      const groupValue = btn.dataset.groupValue;
      const presets = (mod.groupByField && groupValue && groupValue.charAt(0) !== '(') ? { [mod.groupByField]: groupValue } : null;
      openModuleForm(moduleKey, null, presets);
      return;
    }
    if(action === 'group-export'){
      const groupValue = btn.dataset.groupValue;
      const groupRecords = getActive(moduleKey).filter(r=>rowGroupKey(mod, r) === groupValue);
      downloadText('fams-plus-' + moduleKey + '-' + groupValue.replace(/[^a-z0-9]+/gi,'-') + '-' + todayStr() + '.csv', recordsToCsv(mod, groupRecords), 'text/csv');
      toast('Exported ' + groupRecords.length + ' record(s)', 'ok');
      return;
    }
    if(action === 'group-status-apply'){
      const groupValue = btn.dataset.groupValue;
      const statusField = btn.dataset.statusField;
      const select = wrap.querySelector('[data-group-status-select][data-group-value="' + CSS.escape(groupValue) + '"]');
      const newStatus = select ? select.value : '';
      if(!newStatus){ toast('Choose a status to apply first', 'danger'); return; }
      const groupRecords = getActive(moduleKey).filter(r=>rowGroupKey(mod, r) === groupValue);
      if(!confirm('Set ' + statusField + ' to "' + newStatus + '" for all ' + groupRecords.length + ' record(s) in this group?')) return;
      btn.disabled = true;
      try{
        for(const r of groupRecords){
          await updateRecord(moduleKey, r.id, { [statusField]: newStatus });
        }
        logAudit(moduleKey, 'Bulk status update', '', groupValue + ' → ' + newStatus + ' (' + groupRecords.length + ' records)');
        toast('Updated ' + groupRecords.length + ' record(s)', 'ok');
        refreshTable();
      }finally{ btn.disabled = false; }
      return;
    }
    const tr = e.target.closest('tr[data-id]');
    if(!tr) return;
    const id = tr.dataset.id;
    const rec = getRecord(moduleKey, id);
    if(!rec) return;
    if(action === 'edit') openModuleForm(moduleKey, id);
    else if(action === 'notes') openNotesDrawer(moduleKey, id);
    else if(action === 'minutes'){
      openModal('<h3 style="margin:0 0 10px;">📝 Minutes — ' + escapeHtml(rec[mod.titleField] || '') + '</h3>'
        + '<div class="field"><textarea class="input" id="minutes-quick-edit" rows="8">' + escapeHtml(rec.minutes || '') + '</textarea></div>'
        + '<div style="display:flex;gap:8px;"><button class="btn btn-primary" id="minutes-quick-save">Save</button><button class="btn btn-ghost" id="minutes-quick-cancel">Cancel</button></div>');
      document.getElementById('minutes-quick-cancel').addEventListener('click', closeModal);
      document.getElementById('minutes-quick-save').addEventListener('click', async ()=>{
        const text = document.getElementById('minutes-quick-edit').value;
        await updateRecord(moduleKey, id, { minutes: text });
        logAudit(moduleKey, 'Updated minutes', id, rec[mod.titleField] || '');
        toast('Minutes saved', 'ok');
        closeModal();
        refreshTable();
      });
    }
    else if(action === 'raise-action'){
      openModuleForm('action-items', null, { meetingId: id, action: 'Follow up: ' + (rec[mod.titleField] || 'meeting') });
    }
    else if(action === 'email') openEmailComposeDrawer(moduleKey, [rec], refreshTable);
    else if(action === 'whatsapp') window.open(waLink(rec.phone), '_blank');
    else if(action === 'delete'){
      if(!confirm('Delete this record? You can restore it later from "Show deleted".')) return;
      await softDeleteRecord(moduleKey, id); logAudit(moduleKey, 'Deleted', id, rec[mod.titleField] || ''); toast('Deleted', 'ok');
      if(moduleKey === 'custom-modules') render(); else refreshTable();
    }else if(action === 'restore'){
      await restoreRecord(moduleKey, id); logAudit(moduleKey, 'Restored', id, rec[mod.titleField] || ''); toast('Restored', 'ok');
      if(moduleKey === 'custom-modules'){ registerAllCustomModules(); render(); } else refreshTable();
    }else if(action === 'purge'){
      if(!confirm('Permanently delete this record? This cannot be undone.')) return;
      await purgeRecord(moduleKey, id); logAudit(moduleKey, 'Purged', id, rec[mod.titleField] || ''); toast('Purged', 'ok');
      if(moduleKey === 'custom-modules') render(); else refreshTable();
    }
  });
}

function fieldInputHtml(mod, field, value, rec, idPrefix){
  const id = (idPrefix || 'f_') + field.key;
  let v = value;
  if(v === undefined || v === null) v = (field.default === '__today__' ? todayStr() : (field.default != null ? field.default : ''));
  if(field.type === 'select'){
    const opts = (field.options || []).map(o=>'<option value="' + escapeHtml(o) + '"' + (o === v ? ' selected' : '') + '>' + escapeHtml(o) + '</option>').join('');
    return '<select class="input" id="' + id + '"><option value="">' + escapeHtml(field.blankLabel || '— Select —') + '</option>' + opts + '</select>';
  }
  if(field.type === 'multiselect'){
    // Stored as a plain array of the checked option strings. Rendered as a
    // bordered, scrollable checkbox list rather than a native <select
    // multiple> — much easier to see (and tap, on a phone) which ones are
    // already checked than a multi-select listbox is.
    const selected = Array.isArray(v) ? v : [];
    const opts = (field.options || []).map((o, oi)=>'<label style="display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:400;padding:4px 2px;cursor:pointer;">'
      + '<input type="checkbox" class="multiselect-opt" value="' + escapeHtml(o) + '"' + (selected.indexOf(o) !== -1 ? ' checked' : '') + '> ' + escapeHtml(o) + '</label>').join('');
    return '<div class="multiselect-field" id="' + id + '" style="border:1px solid var(--border);border-radius:8px;padding:6px 10px;max-height:180px;overflow-y:auto;">' + opts + '</div>';
  }
  if(field.type === 'textarea') return '<textarea class="input" id="' + id + '">' + escapeHtml(v) + '</textarea>';
  if(field.type === 'reference'){
    const refMod = MODULES[field.ref];
    const opts = getActive(field.ref).map(r=>'<option value="' + r.id + '"' + (r.id === v ? ' selected' : '') + '>' + escapeHtml(r[refMod.titleField] || '(untitled)') + '</option>').join('');
    return '<select class="input" id="' + id + '"><option value="">— None —</option>' + opts + '</select>';
  }
  if(field.type === 'moduleRef'){
    const opts = polyrefTargetModules().map(k=>'<option value="' + k + '"' + (k === v ? ' selected' : '') + '>'
      + escapeHtml((MODULES[k].icon || '') + ' ' + MODULES[k].label) + '</option>').join('');
    return '<select class="input" id="' + id + '" data-poly-module-picker="1"><option value="">— Select a menu —</option>' + opts + '</select>';
  }
  if(field.type === 'categoryRef'){
    const opts = NAV_CATEGORIES.map(c=>'<option value="' + c.key + '"' + (c.key === v ? ' selected' : '') + '>'
      + escapeHtml(c.icon + ' ' + c.label) + '</option>').join('');
    return '<select class="input" id="' + id + '">' + opts + '</select>';
  }
  if(field.type === 'recordRef'){
    const curModKey = rec ? rec[field.dependsOn] : '';
    const opts = curModKey ? recordOptionsHtml(curModKey, v) : '';
    return '<select class="input" id="' + id + '" data-poly-record-picker="1" data-depends-on="f_' + field.dependsOn + '">'
      + '<option value="">' + (curModKey ? '— Select a record —' : '— Select a menu first —') + '</option>' + opts + '</select>';
  }
  if(field.type === 'subtable') return subtableFieldHtml(field, Array.isArray(v) ? v : []);
  // Subject / Subject Code: Timetable is the single source of truth for
  // which subjects exist, so any OTHER module that re-asks for a Subject
  // and/or Subject Code (Class Log, Question Bank, Internal Marks (CIA),
  // Extra Classes, and Timetable itself) gets the same names offered as
  // suggestions here via a <datalist> — typing/picking a match for one
  // side auto-fills the other at save time if it's still blank (see
  // applySubjectAutoFill()) so the same subject/code always maps the same
  // way everywhere instead of risking a mismatched spelling or code.
  if(field.type === 'text' && (field.key === 'subject' || field.key === 'subjectCode')){
    const catalog = subjectCatalog();
    if(catalog.length){
      const listId = field.key === 'subject' ? 'subject-catalog-datalist' : 'subjectcode-catalog-datalist';
      const opts = field.key === 'subject'
        ? catalog.map(c=>c.subject)
        : Array.from(new Set(catalog.map(c=>c.subjectCode).filter(Boolean)));
      const dl = '<datalist id="' + listId + '">' + Array.from(new Set(opts)).map(o=>'<option value="' + escapeHtml(o) + '">').join('') + '</datalist>';
      return '<input class="input" id="' + id + '" type="text" list="' + listId + '" value="' + escapeHtml(v) + '">' + dl;
    }
  }
  const typeMap = { text:'text', email:'email', phone:'tel', tel:'tel', number:'number', date:'date', time:'time', datetime:'datetime-local' };
  // step="any" on number inputs: without it, HTML5's default step (1) makes
  // the browser silently block form submission for any decimal value (e.g.
  // 1.5 hours) — the input shows no visible error, the Save click just does
  // nothing. Every hours/marks/amount field in the app is decimal-capable.
  const extraAttrs = field.type === 'number' ? ' step="any"' : '';
  return '<input class="input" id="' + id + '" type="' + (typeMap[field.type] || 'text') + '"' + extraAttrs + ' value="' + escapeHtml(v) + '">';
}
/** Canonical {subject, subjectCode} pairs, sourced from Timetable — see the
 *  comment on fieldInputHtml's Subject/Subject Code handling above. */
function subjectCatalog(){
  const seen = {};
  const list = [];
  getActive('timetable').forEach(t=>{
    if(!t.subject) return;
    const key = t.subject + '||' + (t.subjectCode || '');
    if(seen[key]) return;
    seen[key] = true;
    list.push({ subject: t.subject, subjectCode: t.subjectCode || '' });
  });
  return list;
}
/** Fills in a still-blank Subject or Subject Code from the Timetable
 *  catalog, given whichever of the pair the user DID fill in — called once
 *  at save time (see wireModuleForm's submit handler) rather than live
 *  while the form is open. Deliberately not wired to live 'input'/'change'
 *  events on the fields themselves: mutating one field's value as a
 *  side-effect of typing in the other is a race against whatever set the
 *  value in the first place (an external fill, a paste, a browser
 *  autofill), and only needs to be correct once, at submit — not
 *  continuously while the user is still typing. Never overwrites a value
 *  the user already typed on the other side. */
function applySubjectAutoFill(mod, data){
  if(!mod.fields.some(f=>f.key==='subject') || !mod.fields.some(f=>f.key==='subjectCode')) return;
  const subject = (data.subject || '').trim();
  const code = (data.subjectCode || '').trim();
  if(subject && !code){
    const match = subjectCatalog().find(c=>c.subject.toLowerCase() === subject.toLowerCase());
    if(match && match.subjectCode) data.subjectCode = match.subjectCode;
  }else if(code && !subject){
    const match = subjectCatalog().find(c=>c.subjectCode.toLowerCase() === code.toLowerCase());
    if(match && match.subject) data.subject = match.subject;
  }
}

/* ============================================================
   SUBTABLE FIELD — an embedded, editable mini-table stored directly
   on the parent record (e.g. an In-charge role's own list of student
   members, batch/class and all), rather than being its own separate
   top-level module linked back by a reference field. Row data is a
   plain array of {subfieldKey: value} objects on the parent record —
   no separate storage key, no separate CRUD screen, nothing to keep
   in sync: it saves/loads as part of the parent record like any other
   field. See wireSubtableFields() for the add/remove-row wiring and
   collectSubtableValue() for how a field's rows are read back out of
   the DOM on form submit.
   ============================================================ */
/** Matches stored subtable rows to a field's fixedRows labels — shared by
 *  the edit-form table, the list-view preview, and the plain-text export, so
 *  all three surfaces always agree on what's saved. Tolerant of messy/older
 *  data: an exact _rowLabel match first, then a case/whitespace-insensitive
 *  match (a copy-pasted spec can easily pick up stray spacing), then — only
 *  when NONE of the stored rows carry a _rowLabel at all (rows saved before
 *  this field became fixed-row, or before its fixedRows list was corrected)
 *  — falls back to matching by position. Existing marks should never just
 *  vanish off the screen because the fixedRows list's exact text changed. */
function resolveFixedRows(field, rows){
  rows = Array.isArray(rows) ? rows : [];
  const norm = s => String(s == null ? '' : s).trim().toLowerCase();
  const anyLabeled = rows.some(r => r && r._rowLabel != null && String(r._rowLabel).trim() !== '');
  return field.fixedRows.map((label, idx)=>{
    let match = rows.find(r => r && r._rowLabel === label);
    if(!match) match = rows.find(r => r && norm(r._rowLabel) === norm(label));
    if(!match && !anyLabeled) match = rows[idx];
    return match || {};
  });
}
function subtableRowHtml(field, rowData, fixedLabel){
  rowData = rowData || {};
  const labelCell = fixedLabel != null
    ? '<td style="padding:8px;font-size:12.5px;font-weight:700;color:var(--text);white-space:nowrap;">' + escapeHtml(fixedLabel) + '</td>'
    : '';
  const cells = field.subfields.map(sf=>{
    const val = rowData[sf.key] != null ? rowData[sf.key] : '';
    if(sf.type === 'select'){
      const opts = (sf.options || []).map(o=>'<option value="' + escapeHtml(o) + '"' + (o === val ? ' selected' : '') + '>' + escapeHtml(o) + '</option>').join('');
      return '<td style="padding:4px;"><select class="input subtable-cell" data-subkey="' + sf.key + '" style="min-width:110px;padding:6px 8px;font-size:12.5px;"><option value="">—</option>' + opts + '</select></td>';
    }
    return '<td style="padding:4px;"><input class="input subtable-cell" data-subkey="' + sf.key + '" type="text" value="' + escapeHtml(val) + '" placeholder="' + escapeHtml(sf.label) + '" style="min-width:110px;padding:6px 8px;font-size:12.5px;"></td>';
  }).join('');
  // A fixed row (part of a pre-defined list like Sem-1..Sem-6) can't be
  // removed — that slot always exists — so it gets a blank trailing cell
  // instead of the ✕ button, keeping column alignment with the header.
  const trailingCell = fixedLabel != null
    ? '<td></td>'
    : '<td style="padding:4px;text-align:center;"><button type="button" class="btn btn-ghost btn-sm subtable-remove-row" title="Remove row" style="padding:4px 8px;">✕</button></td>';
  return '<tr class="subtable-row"' + (fixedLabel != null ? ' data-fixed-label="' + escapeHtml(fixedLabel) + '"' : '') + '>'
    + labelCell + cells + trailingCell + '</tr>';
}
function subtableFieldHtml(field, rows){
  const labelHeader = field.fixedRows ? '<th style="text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--text-dim);padding:4px 8px;">' + escapeHtml(field.rowLabel || 'Row') + '</th>' : '';
  const headerCells = labelHeader + field.subfields.map(sf=>'<th style="text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--text-dim);padding:4px 8px;">' + escapeHtml(sf.label) + '</th>').join('') + '<th></th>';
  // Fixed-row mode: always render exactly one row per entry in field.fixedRows,
  // in that order, matching each to any previously-saved data by its stored
  // _rowLabel (see resolveFixedRows) — so "Sem-3"'s marks land back in the
  // "Sem-3" row on reopen regardless of what order rows happen to be stored
  // in, or whether they even have a matching label at all.
  const bodyRows = field.fixedRows
    ? resolveFixedRows(field, rows).map((r, i)=>subtableRowHtml(field, r, field.fixedRows[i])).join('')
    : rows.map(r=>subtableRowHtml(field, r)).join('');
  return '<div class="subtable-field" id="f_' + field.key + '">'
    + '<div style="overflow-x:auto;"><table class="subtable-table" style="width:100%;border-collapse:collapse;"><thead><tr>' + headerCells + '</tr></thead>'
    + '<tbody class="subtable-body">' + bodyRows + '</tbody></table></div>'
    + (field.fixedRows ? '' : '<button type="button" class="btn btn-ghost btn-sm subtable-add-row" style="margin-top:8px;">+ Add ' + escapeHtml(field.rowLabel || 'Row') + '</button>')
    + '</div>';
}
/** Wires the +Add/✕Remove buttons for every subtable field in a just-opened
 *  record form. Called once from wireModuleForm() alongside the existing
 *  moduleRef/recordRef cascading-picker wiring. A fixed-row subtable has
 *  neither button rendered, so this is simply a no-op for those fields. */
function wireSubtableFields(mod){
  mod.fields.filter(f=>f.type === 'subtable').forEach(f=>{
    const container = document.getElementById('f_' + f.key);
    if(!container) return;
    const tbody = container.querySelector('.subtable-body');
    const addBtn = container.querySelector('.subtable-add-row');
    if(addBtn) addBtn.addEventListener('click', ()=>{ tbody.insertAdjacentHTML('beforeend', subtableRowHtml(f, {})); });
    tbody.addEventListener('click', (e)=>{
      const btn = e.target.closest('.subtable-remove-row');
      if(btn) btn.closest('tr').remove();
    });
  });
}
/** Reads a subtable field's current rows back out of the DOM (called from
 *  the record-form submit handler in place of the usual `el.value` read).
 *  Free-form rows where every cell is blank are dropped so an untouched
 *  blank "+ Add Row" doesn't get saved as an empty member. Fixed rows are
 *  always kept (blank or not) — the slot for "Sem-4" should still exist
 *  next time the form opens even before that semester's mark is entered —
 *  tagged with _rowLabel so subtableFieldHtml can match it back up. */
function collectSubtableValue(field){
  const container = document.getElementById('f_' + field.key);
  if(!container) return [];
  const result = [];
  container.querySelectorAll('.subtable-row').forEach(tr=>{
    const fixedLabel = tr.dataset.fixedLabel;
    const obj = {};
    let hasAny = false;
    field.subfields.forEach(sf=>{
      const cell = tr.querySelector('[data-subkey="' + sf.key + '"]');
      const val = cell ? cell.value.trim() : '';
      if(val) hasAny = true;
      obj[sf.key] = val;
    });
    if(fixedLabel != null){ obj._rowLabel = fixedLabel; result.push(obj); }
    else if(hasAny) result.push(obj);
  });
  return result;
}
/** Reads a 'multiselect' field's checked options back out of the DOM (see
 *  fieldInputHtml's multiselect branch) — parallel to collectSubtableValue
 *  above, called from the record-form submit handler in place of `el.value`. */
function collectMultiselectValue(field){
  const container = document.getElementById('f_' + field.key);
  if(!container) return [];
  return Array.from(container.querySelectorAll('.multiselect-opt:checked')).map(cb=>cb.value);
}

function notesTabHtml(rec){
  const notes = rec.notes || [];
  let html = '<div class="notes-list">';
  if(notes.length === 0) html += '<div class="empty" style="padding:20px;">No notes yet.</div>';
  notes.slice().reverse().forEach(n=>{ html += '<div class="note-item"><div class="ts">' + escapeHtml(fmtDateTime(n.at)) + '</div>' + escapeHtml(n.text) + '</div>'; });
  html += '</div>';
  html += '<div class="field" style="margin-top:10px;"><label>Add note</label><textarea class="input" id="new-note-text"></textarea></div>';
  html += '<button class="btn btn-primary btn-sm" id="add-note-btn" type="button">Add Note</button>';
  return html;
}

/* ============================================================
   LOG TABS — a module can declare `logTabs` (see 'research-contacts' for
   the shape) to get one or more extra append-only, timestamped lists on the
   edit-record drawer, alongside the built-in Notes tab: e.g. Researcher
   Network's Papers / Contact History / Visits to India. Each entry is a
   small structured form (not just free text like Notes), stored as an
   array on the parent record under tabDef.arrayKey — same "no separate
   CRUD screen, saves as part of the parent record" idea as a subtable
   field, but reached from its own tab instead of being inline on the main
   form, and only available once the record has been saved at least once
   (there's no id to attach entries to before that).
   ============================================================ */
function logTabHtml(rec, tabDef){
  const entries = rec[tabDef.arrayKey] || [];
  let html = '<div class="notes-list">';
  if(entries.length === 0) html += '<div class="empty" style="padding:20px;">No ' + escapeHtml(tabDef.label.toLowerCase()) + ' yet.</div>';
  entries.slice().reverse().forEach(en=>{
    const link = tabDef.linkKey && en[tabDef.linkKey] ? en[tabDef.linkKey] : '';
    const href = link ? (/^https?:\/\//i.test(link) ? link : 'https://' + link) : '';
    html += '<div class="note-item"><div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start;">'
      + '<div style="flex:1;"><div class="ts">' + escapeHtml(tabDef.summary(en)) + '</div>'
      + (tabDef.bodyKey && en[tabDef.bodyKey] ? escapeHtml(en[tabDef.bodyKey]) : '')
      + (href ? ('<div><a href="' + escapeHtml(href) + '" target="_blank" rel="noopener">' + escapeHtml(link) + '</a></div>') : '')
      + '</div>'
      + '<button type="button" class="btn btn-ghost btn-sm log-entry-remove" data-log-tab="' + tabDef.key + '" data-entry-id="' + en.id + '" title="Remove">✕</button>'
      + '</div></div>';
  });
  html += '</div>';
  html += '<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border);">';
  tabDef.fields.forEach(f=>{ html += '<div class="field"><label>' + escapeHtml(f.label) + (f.required ? ' *' : '') + '</label>' + fieldInputHtml({fields:tabDef.fields}, f, undefined, null, 'log_' + tabDef.key + '_') + '</div>'; });
  html += '<div class="error-box" id="log-' + tabDef.key + '-error"></div>';
  html += '<button class="btn btn-primary btn-sm" type="button" data-log-add="' + tabDef.key + '">' + escapeHtml(tabDef.addLabel || 'Add') + '</button>';
  html += '</div>';
  return html;
}
async function addLogEntry(moduleKey, id, arrayKey, data){
  const arr = getCollection(moduleKey).slice();
  const idx = arr.findIndex(r=>r.id===id);
  if(idx===-1) return;
  const list = (arr[idx][arrayKey] || []).slice();
  list.push(Object.assign({ id: uid(), at: nowIso() }, data));
  const patch = {}; patch[arrayKey] = list;
  arr[idx] = Object.assign({}, arr[idx], patch, { updatedAt: nowIso() });
  await saveCollection(moduleKey, arr);
}
async function removeLogEntry(moduleKey, id, arrayKey, entryId){
  const arr = getCollection(moduleKey).slice();
  const idx = arr.findIndex(r=>r.id===id);
  if(idx===-1) return;
  const list = (arr[idx][arrayKey] || []).filter(e=>e.id !== entryId);
  const patch = {}; patch[arrayKey] = list;
  arr[idx] = Object.assign({}, arr[idx], patch, { updatedAt: nowIso() });
  await saveCollection(moduleKey, arr);
}
/** The "save this record first, then you can…" hint shown at the bottom of
 *  an ADD form (never an edit form, since the log tabs are already right
 *  there) for any module that declares logTabs and/or profileExport —
 *  spelled out generically from each logTab's hintPhrase rather than
 *  hardcoded to Researcher Network, so any future module gets the same
 *  hint for free just by declaring the same shape. */
function saveFirstHintHtml(mod){
  const phrases = (mod.logTabs || []).map(t=>t.hintPhrase).filter(Boolean);
  if(mod.profileExport) phrases.push('export a profile PDF');
  if(!phrases.length) return '';
  const noun = mod.recordNoun || mod.label.toLowerCase();
  const joined = phrases.length > 1 ? (phrases.slice(0, -1).join(', ') + ', and ' + phrases[phrases.length - 1]) : phrases[0];
  return '<div style="font-size:12px;color:var(--text-dim);margin-top:10px;">Save this ' + escapeHtml(noun) + ' first, then you can ' + escapeHtml(joined) + '.</div>';
}

function openModuleForm(moduleKey, id, presets){
  const mod = MODULES[moduleKey];
  const rec = id ? getRecord(moduleKey, id) : null;
  const exportBtn = (rec && mod.profileExport) ? '<button type="button" class="btn btn-ghost btn-sm" id="export-profile-btn" style="margin-bottom:10px;">📄 Export Profile (PDF)</button>' : '';
  let html = '<h3 style="margin:0 0 4px;padding-right:26px;">' + (rec ? 'Edit ' : 'Add ') + escapeHtml(mod.label) + '</h3>' + exportBtn;
  const logTabs = rec ? (mod.logTabs || []) : [];
  if(rec){
    html += '<div class="drawer-tabs"><div class="drawer-tab active" data-tab="details">Details</div>'
      + '<div class="drawer-tab" data-tab="notes">Notes (' + ((rec.notes || []).length) + ')</div>'
      + logTabs.map(t=>'<div class="drawer-tab" data-tab="' + t.key + '">' + t.icon + ' ' + escapeHtml(t.label) + ' (' + ((rec[t.arrayKey] || []).length) + ')</div>').join('')
      + '</div>';
  }
  html += '<div id="tab-details" class="tab-panel"><form id="record-form">';
  // presets: only used when adding a brand-new record (e.g. clicking
  // "+ Add to this group" from a grouped list view) to pre-fill one field —
  // like the group's own value — so the new record lands in that same group.
  // A `section` on a field (e.g. Researcher Network's "👤 Basic
  // Information" / "🔗 Links & Profiles") gets a heading rendered right
  // before its first field; fields with no section (every other module
  // today) render exactly as before, with no heading at all.
  let currentSection = null;
  mod.fields.forEach(f=>{
    if(f.section && f.section !== currentSection){
      currentSection = f.section;
      html += '<h4 class="form-section-heading">' + escapeHtml(currentSection) + '</h4>';
    }
    html += '<div class="field"><label>' + escapeHtml(f.label) + (f.required ? ' *' : '') + '</label>' + fieldInputHtml(mod, f, rec ? rec[f.key] : (presets ? presets[f.key] : undefined), rec) + '</div>';
  });
  html += '<div class="error-box" id="form-error"></div>';
  html += '<div style="display:flex;gap:8px;margin-top:6px;"><button type="submit" class="btn btn-primary">Save</button><button type="button" class="btn btn-ghost" id="form-cancel">Cancel</button></div>';
  if(!rec) html += saveFirstHintHtml(mod);
  html += '</form></div>';
  if(rec){
    html += '<div id="tab-notes" class="tab-panel hidden">' + notesTabHtml(rec) + '</div>';
    logTabs.forEach(t=>{ html += '<div id="tab-' + t.key + '" class="tab-panel hidden">' + logTabHtml(rec, t) + '</div>'; });
  }
  openDrawer(html);
  wireModuleForm(moduleKey, id);
}
function openNotesDrawer(moduleKey, id){
  openModuleForm(moduleKey, id);
  const tab = document.querySelector('.drawer-tab[data-tab="notes"]');
  if(tab) tab.click();
}
function wireModuleForm(moduleKey, id){
  const mod = MODULES[moduleKey];
  const drawer = document.getElementById('drawer-body');
  const tabs = drawer.querySelectorAll('.drawer-tab');
  tabs.forEach(t=>{
    t.addEventListener('click', ()=>{
      tabs.forEach(x=>x.classList.remove('active'));
      t.classList.add('active');
      drawer.querySelectorAll('.tab-panel').forEach(p=>p.classList.toggle('hidden', p.id !== 'tab-' + t.dataset.tab));
    });
  });
  // "Related To" polymorphic-reference fields: a moduleRef select feeds one
  // or more recordRef selects — when the menu choice changes, repopulate the
  // dependent record dropdown(s) from that module's active records.
  mod.fields.filter(f=>f.type === 'moduleRef').forEach(mf=>{
    const modSelect = document.getElementById('f_' + mf.key);
    if(!modSelect) return;
    const dependents = mod.fields.filter(df=>df.type === 'recordRef' && df.dependsOn === mf.key);
    if(!dependents.length) return;
    modSelect.addEventListener('change', ()=>{
      const chosenModKey = modSelect.value;
      dependents.forEach(df=>{
        const recSelect = document.getElementById('f_' + df.key);
        if(!recSelect) return;
        recSelect.innerHTML = '<option value="">' + (chosenModKey ? '— Select a record —' : '— Select a menu first —') + '</option>'
          + (chosenModKey ? recordOptionsHtml(chosenModKey, '') : '');
      });
    });
  });
  wireSubtableFields(mod);
  const cancelBtn = document.getElementById('form-cancel');
  if(cancelBtn) cancelBtn.addEventListener('click', closeDrawer);
  const form = document.getElementById('record-form');
  if(form){
    form.addEventListener('submit', async (e)=>{
      e.preventDefault();
      // Guard against a fast double-click / double-Enter firing this handler
      // twice before the button visually disables — without this, a second
      // near-simultaneous submit would create two records instead of one.
      const btn = form.querySelector('button[type=submit]');
      if(btn.disabled) return;
      const errEl = document.getElementById('form-error');
      errEl.textContent = '';
      // Collected in TWO passes: first every field's raw value with no
      // required-ness check yet, then applySubjectAutoFill() gets a chance
      // to fill in a still-blank Subject/Subject Code from the Timetable
      // catalog, and only THEN is "is this required field actually filled
      // in" checked — otherwise a Subject Code left blank on purpose
      // (relying on the auto-fill) would wrongly be rejected as missing
      // before the auto-fill ever got to run.
      const data = {};
      for(let i=0;i<mod.fields.length;i++){
        const f = mod.fields[i];
        if(f.type === 'subtable'){ data[f.key] = collectSubtableValue(f); continue; }
        if(f.type === 'multiselect'){ data[f.key] = collectMultiselectValue(f); continue; }
        const el = document.getElementById('f_' + f.key);
        let v = el.value;
        if(f.type === 'number') v = v === '' ? '' : Number(v);
        data[f.key] = v;
      }
      applySubjectAutoFill(mod, data);
      for(let i=0;i<mod.fields.length;i++){
        const f = mod.fields[i];
        if(f.type === 'subtable' || f.type === 'multiselect') continue;
        const v = data[f.key];
        if(f.required && (v === '' || v == null)){
          errEl.textContent = f.label + ' is required.';
          const el = document.getElementById('f_' + f.key);
          if(el) el.focus();
          return;
        }
      }
      btn.disabled = true; btn.textContent = 'Saving…';
      try{
        let savedRec;
        if(id){ savedRec = await updateRecord(moduleKey, id, data); logAudit(moduleKey, 'Updated', id, savedRec[mod.titleField] || ''); }
        else{ savedRec = await createRecord(moduleKey, data); logAudit(moduleKey, 'Created', savedRec.id, savedRec[mod.titleField] || ''); }
        toast('Saved', 'ok');
        closeDrawer();
        if(moduleKey === 'custom-modules'){
          // A new/edited custom menu definition — compile it into a real
          // module and rebuild the whole shell so its nav entry shows up
          // immediately, without needing a page reload.
          registerAllCustomModules();
          render();
        }else{
          const r = parseRoute();
          if(r.screen === 'module' && r.moduleKey === moduleKey){ renderRoute(); }
          else if(r.screen === 'dashboard'){ renderRoute(); }
        }
      }catch(err){
        errEl.textContent = err && err.message ? err.message : String(err);
        btn.disabled = false; btn.textContent = 'Save';
      }
    });
  }
  const addNoteBtn = document.getElementById('add-note-btn');
  if(addNoteBtn){
    addNoteBtn.addEventListener('click', async ()=>{
      if(addNoteBtn.disabled) return;
      const ta = document.getElementById('new-note-text');
      const text = ta.value.trim();
      if(!text) return;
      addNoteBtn.disabled = true;
      try{
        await addNote(moduleKey, id, text);
        openNotesDrawer(moduleKey, id);
      }catch(err){ toast('Failed to add note', 'danger'); addNoteBtn.disabled = false; }
    });
  }
  // Log tabs (Papers / Contact History / Visits to India on Researcher
  // Network, and any future module that declares mod.logTabs the same way):
  // one "add" button per tab, wired to that tab's own small field set, plus
  // a "✕" remove button on every already-saved entry.
  (mod.logTabs || []).forEach(tabDef=>{
    const addBtn = drawer.querySelector('[data-log-add="' + tabDef.key + '"]');
    if(!addBtn) return;
    addBtn.addEventListener('click', async ()=>{
      if(addBtn.disabled) return;
      const errEl = document.getElementById('log-' + tabDef.key + '-error');
      if(errEl) errEl.textContent = '';
      const idPrefix = 'log_' + tabDef.key + '_';
      const data = {};
      tabDef.fields.forEach(f=>{
        const el = document.getElementById(idPrefix + f.key);
        if(!el) return;
        let v = el.value;
        if(f.type === 'number') v = v === '' ? '' : Number(v);
        data[f.key] = v;
      });
      const missing = tabDef.fields.find(f=>f.required && (data[f.key] === '' || data[f.key] == null));
      if(missing){ if(errEl) errEl.textContent = missing.label + ' is required.'; return; }
      addBtn.disabled = true;
      try{
        await addLogEntry(moduleKey, id, tabDef.arrayKey, data);
        openModuleForm(moduleKey, id);
        const tab = document.querySelector('.drawer-tab[data-tab="' + tabDef.key + '"]');
        if(tab) tab.click();
      }catch(err){ if(errEl) errEl.textContent = 'Failed to save.'; addBtn.disabled = false; }
    });
  });
  drawer.querySelectorAll('.log-entry-remove').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const tabKey = btn.dataset.logTab;
      const entryId = btn.dataset.entryId;
      const tabDef = (mod.logTabs || []).find(t=>t.key === tabKey);
      if(!tabDef) return;
      if(!confirm('Remove this entry? This cannot be undone.')) return;
      await removeLogEntry(moduleKey, id, tabDef.arrayKey, entryId);
      openModuleForm(moduleKey, id);
      const tab = document.querySelector('.drawer-tab[data-tab="' + tabKey + '"]');
      if(tab) tab.click();
    });
  });
  const exportBtn = document.getElementById('export-profile-btn');
  if(exportBtn) exportBtn.addEventListener('click', ()=>{ exportRecordProfilePdf(moduleKey, id); });
}

/* ============================================================
   EMAIL COMPOSE — sends real mail (not a mailto: link) through the
   app's own backend, so it goes out from the official email address
   configured for this deployment (see backend/Code.gs OFFICE_EMAIL /
   sendAs_). Works for a single record's "✉️ Email" row action or a
   multi-record "Email Selected" bulk action — both funnel through
   the same drawer and the existing mailMerge backend endpoint, so
   {{name}} (and any other record field) can be used as a merge tag.
   ============================================================ */
function emailComposeHtml(recipients, missingCount, contextLabel){
  const toLine = recipients.length
    ? recipients.map(r => escapeHtml((r.name || '(no name)') + ' <' + r.email + '>')).join(', ')
    : '<span style="color:var(--text-faint);">No valid recipients</span>';
  return '<h3 style="margin:0 0 4px;padding-right:26px;">✉️ Email' + (contextLabel ? ' — ' + escapeHtml(contextLabel) : '') + '</h3>'
    + '<div style="font-size:12.5px;color:var(--text-dim);margin-bottom:4px;line-height:1.5;">To: ' + toLine + '</div>'
    + (missingCount ? '<div style="font-size:12px;color:var(--warn,#b45309);margin-bottom:10px;">' + missingCount + ' selected record(s) have no email address and will be skipped.</div>' : '<div style="margin-bottom:10px;"></div>')
    + '<form id="email-compose-form">'
    + '<div class="field"><label>Subject</label><input class="input" id="ec-subject" required></div>'
    + '<div class="field"><label>Message <span style="font-weight:400;color:var(--text-dim);">— {{name}} is replaced with each recipient\'s name</span></label><textarea class="input" id="ec-body" style="min-height:170px;" required></textarea></div>'
    + '<div class="error-box" id="ec-error"></div>'
    + '<div style="display:flex;gap:8px;">'
    + '<button type="submit" class="btn btn-primary" id="ec-send"' + (recipients.length === 0 ? ' disabled' : '') + '>Send' + (recipients.length > 1 ? ' to ' + recipients.length : '') + '</button>'
    + '<button type="button" class="btn btn-ghost" id="ec-cancel">Cancel</button>'
    + '</div></form>';
}
function openEmailComposeDrawer(moduleKey, records, onDone){
  const mod = MODULES[moduleKey];
  const withEmail = records.filter(r => r.email);
  const recipients = withEmail.map(r => Object.assign({}, r, { name: r[mod.titleField] || r.name || '' }));
  const missingCount = records.length - withEmail.length;
  openDrawer(emailComposeHtml(recipients, missingCount, mod.label));
  const cancelBtn = document.getElementById('ec-cancel');
  if(cancelBtn) cancelBtn.addEventListener('click', closeDrawer);
  const form = document.getElementById('email-compose-form');
  if(!form) return;
  form.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const sendBtn = document.getElementById('ec-send');
    if(sendBtn.disabled) return;
    const errEl = document.getElementById('ec-error');
    const subject = document.getElementById('ec-subject').value.trim();
    const body = document.getElementById('ec-body').value;
    if(!subject || !body || recipients.length === 0) return;
    sendBtn.disabled = true; sendBtn.textContent = 'Sending…'; errEl.textContent = '';
    try{
      const res = await apiMailMerge(recipients, subject, body);
      if(!res || !res.ok) throw new Error((res && res.error) || 'Send failed');
      const results = res.results || [];
      const failed = results.filter(r=>!r.ok);
      withEmail.forEach(r=>{ logAudit(moduleKey, 'Emailed', r.id, r[mod.titleField] || r.name || '', subject); });
      if(failed.length === 0) toast('Email sent to ' + results.length + ' recipient(s)', 'ok');
      else if(failed.length === results.length) toast('Email failed to send', 'err');
      else toast('Sent to ' + (results.length - failed.length) + ' of ' + results.length + ' recipient(s)', 'ok');
      closeDrawer();
      if(onDone) onDone();
    }catch(err){
      errEl.textContent = err && err.message ? err.message : String(err);
      sendBtn.disabled = false; sendBtn.textContent = 'Send' + (recipients.length > 1 ? ' to ' + recipients.length : '');
    }
  });
}

/* ============================================================
   BULK IMPORT (Excel / CSV) — for any module, driven by the same
   MODULES[key].fields config as the manual add/edit form. Uses
   SheetJS (loaded via CDN in <head>) to read .xlsx/.xls/.csv in
   the browser — nothing is uploaded anywhere, the file never
   leaves the device until the parsed records are saved to your
   own backend the normal way.
   ============================================================ */
function bulkImportAvailable(){ return typeof XLSX !== 'undefined'; }

function downloadModuleTemplate(moduleKey){
  const mod = MODULES[moduleKey];
  // A subtable field (e.g. "Members") is a whole nested mini-table, not a
  // single cell — it isn't representable as one flat spreadsheet column, so
  // bulk import simply doesn't cover it (add members after import, from the
  // record's own edit form).
  const importableFields = mod.fields.filter(f=>f.type !== 'subtable' && f.type !== 'multiselect');
  const headers = importableFields.map(f=>f.label);
  const sampleRow = {};
  importableFields.forEach(f=>{
    sampleRow[f.label] = f.type === 'select' ? (f.options && f.options[0] || '') : (f.type === 'date' ? todayStr() : '');
  });
  const ws = XLSX.utils.json_to_sheet([sampleRow], { header: headers });
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, safeSheetName(mod.label, new Set()));
  deliverWorkbook(wb, 'fams-plus-' + moduleKey + '-template.xlsx');
}

/** Best-effort match of a spreadsheet column header to a module field, by
 *  exact label, then by field key, both case/space-insensitive. */
function matchFieldForHeader(mod, header){
  const norm = String(header || '').trim().toLowerCase();
  const candidates = mod.fields.filter(f => f.type !== 'subtable' && f.type !== 'multiselect');
  return candidates.find(f => f.label.trim().toLowerCase() === norm)
    || candidates.find(f => f.key.trim().toLowerCase() === norm)
    || null;
}
/** Loosely coerces a spreadsheet cell into the shape a field expects —
 *  SheetJS already turns real Excel dates into JS Date objects, so dates
 *  need converting back to the plain YYYY-MM-DD strings the app stores. */
function coerceImportValue(field, raw){
  if(raw == null) return '';
  if(field.type === 'date'){
    if(raw instanceof Date) return raw.toISOString().slice(0, 10);
    const s = String(raw).trim();
    const parsed = new Date(s);
    if(s && !isNaN(parsed) && /\d/.test(s)) return parsed.toISOString().slice(0, 10);
    return s;
  }
  if(field.type === 'number'){
    const n = Number(raw);
    return isNaN(n) ? '' : n;
  }
  return String(raw).trim();
}

function parseWorkbookForModule(moduleKey, arrayBuffer){
  const mod = MODULES[moduleKey];
  const wb = XLSX.read(arrayBuffer, { type: 'array', cellDates: true });
  const sheet = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(sheet, { defval: '' });
  const records = [];
  const skipped = [];
  rows.forEach((row, idx)=>{
    const headers = Object.keys(row);
    const allBlank = headers.every(h => String(row[h]).trim() === '');
    if(allBlank) return;
    const data = {};
    headers.forEach(h=>{
      const field = matchFieldForHeader(mod, h);
      if(field) data[field.key] = coerceImportValue(field, row[h]);
    });
    const missingRequired = mod.fields.filter(f => f.required && (data[f.key] === undefined || data[f.key] === ''));
    if(missingRequired.length){
      skipped.push({ row: idx + 2, reason: 'missing ' + missingRequired.map(f=>f.label).join(', ') });
      return;
    }
    mod.fields.forEach(f=>{ if(data[f.key] === undefined) data[f.key] = (f.type === 'subtable' || f.type === 'multiselect') ? [] : (f.default === '__today__' ? todayStr() : (f.default != null ? f.default : '')); });
    records.push(data);
  });
  return { records, skipped, totalRows: rows.length };
}

function openBulkImportDrawer(moduleKey, onDone){
  const mod = MODULES[moduleKey];

  const html = '<h3 style="padding-right:26px;">⬆ Bulk Import — ' + escapeHtml(mod.label) + '</h3>'
    + '<p style="font-size:12.5px;color:var(--text-dim);line-height:1.6;">Import many records at once from an Excel '
    + '(.xlsx) or CSV file. The first row must be column headers matching a field name below — column order doesn\'t '

  openDrawer(html);

  document.getElementById('bulk-file-input').addEventListener('change', async (e)=>{
    const file = e.target.files[0];

    if(!file) return;
    previewArea.innerHTML = '<p style="font-size:12.5px;color:var(--text-dim);">Reading file…</p>';
    try{

      if(records.length === 0){

      const previewCols = moduleDisplayColumns(mod).slice(0, 4);
      let html2 = '<p style="font-size:12.5px;color:var(--text-dim);margin-top:14px;"><b>' + records.length + '</b> record(s) ready to import'
        + (skipped.length ? ', <b>' + skipped.length + '</b> row(s) skipped (missing a required field)' : '') + '. Preview:</p>';
      html2 += '<div class="table-wrap"><table style="width:100%;border-collapse:collapse;"><thead><tr>'
        + previewCols.map(c=>'<th style="text-align:left;padding:7px 10px;font-size:11px;color:var(--text-dim);border-bottom:1px solid var(--border);">' + escapeHtml(c.label) + '</th>').join('')
        + '</tr></thead><tbody>'
        + records.slice(0, 6).map(r=>'<tr>' + previewCols.map(c=>'<td style="padding:7px 10px;border-bottom:1px solid var(--border);font-size:12.5px;">' + escapeHtml(String(r[c.key] || '')) + '</td>').join('') + '</tr>').join('')
        + (records.length > 6 ? '<tr><td colspan="' + previewCols.length + '" style="padding:7px 10px;font-size:12px;color:var(--text-faint);">…and ' + (records.length - 6) + ' more</td></tr>' : '')
        + '</tbody></table></div>';
      html2 += '<button class="btn btn-primary" id="bulk-confirm-btn" type="button" style="width:100%;margin-top:14px;">Import ' + records.length + ' Record' + (records.length === 1 ? '' : 's') + '</button>';
      previewArea.innerHTML = html2;
      document.getElementById('bulk-confirm-btn').addEventListener('click', async (ev)=>{
        const btn = ev.target;
        if(btn.disabled) return;
        btn.disabled = true; btn.textContent = 'Importing…';
        try{
          const arr = getCollection(moduleKey).slice();
          records.forEach(data=>{
            arr.push(Object.assign({ id: uid(), createdAt: nowIso(), updatedAt: nowIso(), notes: [], deleted:false }, data));
          });
          await saveCollection(moduleKey, arr);
          toast(records.length + ' record(s) imported', 'ok');
          closeDrawer();
          if(onDone) onDone();
        }catch(err){
          toast('Import failed: ' + (err && err.message ? err.message : String(err)), 'danger');
          btn.disabled = false; btn.textContent = 'Import ' + records.length + ' Records';
        }
      });
    }catch(err){
      previewArea.innerHTML = '<div class="error-box">Could not read that file: ' + escapeHtml(err && err.message ? err.message : String(err)) + '</div>';
    }
  });
}

// [collectionKey, dateField, statusField, "done" values to skip, label] — mirrors backend/Code.gs DEADLINE_SOURCES
const DEADLINE_SOURCES = [
  ['leave-records', 'fromDate', 'status', ['Rejected'], 'Leave/OD'],
  ['invigilation-duties', 'date', null, [], 'Invigilation Duty'],
  ['evaluations', 'deadline', 'status', ['Completed'], 'Evaluation'],
  ['mentee-meetings', 'date', null, [], 'Mentoring Meeting'],
  ['lab-exams', 'date', null, [], 'Lab Exam'],
  ['extra-classes', 'date', null, [], 'Extra Class'],
  ['research-targets', 'targetDate', 'status', ['Completed'], 'Research Target'],
  ['project-grants', 'endDate', 'status', ['Closed','Completed'], 'Project/Grant deadline'],
  ['meetings', 'date', 'status', ['Completed'], 'Meeting'],
  ['action-items', 'dueDate', 'status', ['Done'], 'Action Item'],
  ['reminders', 'dueDate', 'status', ['Done'], 'Reminder'],
  ['office-followups', 'followUpDate', 'status', ['Resolved'], 'Office Follow-up']
];
const DOW_NAMES3 = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
/** Decimal hours between two "HH:MM" strings (Timetable's Start/End Time
 *  fields) — e.g. '09:00' → '10:30' = 1.5. Returns 0 for anything unparsable
 *  rather than throwing, since this feeds a sum that must never crash the
 *  Dashboard/Analytics screens over one malformed record. */
function timeRangeHours(start, end){
  const parse = (s)=>{ const m = /^(\d{1,2}):(\d{2})/.exec(String(s||'')); return m ? (Number(m[1])*60 + Number(m[2])) : null; };
  const a = parse(start), b = parse(end);
  if(a === null || b === null) return 0;
  const mins = b - a;
  return mins > 0 ? Math.round((mins/60)*100)/100 : 0;
}
/** Preferred duration for any record with From Time/To Time fields (Meetings,
 *  Invigilation Duty, Extra/Additional Classes, Lab Exams, Research Events):
 *  the real elapsed time between them when both are filled in, falling back
 *  to that record's own manual "Duration (hours)" number field otherwise
 *  (older records, or ones where only a total was typed without a specific
 *  from/to) — used everywhere those hours are counted (Time Spent, the
 *  auto-logged Work Diary entry) so a real From/To always wins over a
 *  possibly-stale manual number. */
function computedDurationHours(rec){
  if(rec.fromTime && rec.toTime){
    const hrs = timeRangeHours(rec.fromTime, rec.toTime);
    if(hrs) return hrs;
  }
  return parseFloat(rec.durationHours) || 0;
}

function upcomingItems(days){
  const today = todayStr();
  const end = new Date(Date.now() + days*86400000).toISOString().slice(0,10);
  const items = [];
  DEADLINE_SOURCES.forEach(src=>{
    const key = src[0], dateField = src[1], statusField = src[2], doneValues = src[3], label = src[4];
    getActive(key).forEach(rec=>{
      const d = rec[dateField];
      if(!d || d < today || d > end) return;
      if(statusField && doneValues.indexOf(rec[statusField]) !== -1) return;
      const mod = MODULES[key];
      items.push({ moduleKey:key, label:label, date:d, title: rec[mod.titleField] || '(untitled)' });
    });
  });
  items.sort((a,b)=>a.date.localeCompare(b.date));
  return items;
}
function todaysClasses(){
  const dow = DOW_NAMES3[new Date().getDay()];
  return getActive('timetable').filter(t=>t.day===dow && t.status!=='Cancelled')
    .sort((a,b)=>String(a.startTime||'').localeCompare(String(b.startTime||'')));
}
/** Everything else (besides Timetable) that can carry a real From/To Time
 *  for a specific date — feeds todaysScheduleItems() below, so the
 *  Dashboard's "Today's Schedule" shows the whole day's work, not just
 *  classes. Class Log is deliberately left out: a class marked "Held"
 *  today already shows via its matching Timetable slot, so repeating it
 *  here would just be the same class twice. */
const TODAYS_SCHEDULE_EXTRA_SOURCES = [
  { key:'meetings', icon:'📅', title:(r)=>r.title||'', meta:(r)=>r.venue||'' },
  { key:'invigilation-duties', icon:'🖊️', title:(r)=>r.examName||'', meta:(r)=>[r.session, r.venue].filter(Boolean).join(', ') },
  { key:'extra-classes', icon:'➕', title:(r)=>(r.subject||'') + (r.subjectCode?(' ('+r.subjectCode+')'):''), meta:(r)=>r.type||'' },
  { key:'lab-exams', icon:'🔬', title:(r)=>r.labCourse||'', meta:(r)=>r.batch||'' },
  { key:'research-events', icon:'🎤', title:(r)=>r.eventName||'', meta:(r)=>r.role||'' }
];
/** Today's whole schedule, combined from every module that can carry a
 *  real time for a specific date — Timetable's recurring classes plus any
 *  Meeting, Invigilation Duty, Extra/Additional Class, Lab Exam or Research
 *  Event actually dated today (see TODAYS_SCHEDULE_EXTRA_SOURCES) — sorted
 *  chronologically by From Time; items with no time set (or Timetable's own
 *  Start Time) sort after the timed ones, in the order they were entered. */
function todaysScheduleItems(){
  const today = todayStr();
  const items = [];
  todaysClasses().forEach(c=>{
    items.push({ moduleKey:'timetable', icon:'📘', time:c.startTime||'', endTime:c.endTime||'',
      title:c.subject||'', meta:[c.section, c.venue].filter(Boolean).join(', '), cancelled:false });
  });
  TODAYS_SCHEDULE_EXTRA_SOURCES.forEach(src=>{
    const dateField = MODULES[src.key].dateField;
    getActive(src.key).filter(r=>dateField && r[dateField] === today).forEach(r=>{
      items.push({ moduleKey:src.key, icon:src.icon, time:r.fromTime||'', endTime:r.toTime||'',
        title:src.title(r), meta:src.meta(r), cancelled: r.status === 'Cancelled' });
    });
  });
  items.sort((a,b)=>String(a.time||'99:99').localeCompare(String(b.time||'99:99')));
  return items;
}
/* ---------- cross-module day status: Holidays/Leave automatically affect
   the Timetable/Dashboard, per the "leave marked ... automatically connects
   with other menus" requirement. A holiday cancels the day outright; an
   approved Leave/OD flags today's classes as needing rescheduling — neither
   requires touching the Timetable module's own records. ---------- */
function holidayOn(dateStr){ return getActive('holidays').find(h=>h.date===dateStr) || null; }
function approvedLeaveOn(dateStr){
  return getActive('leave-records').find(l=>l.status==='Approved' && l.fromDate && l.toDate && l.fromDate<=dateStr && dateStr<=l.toDate) || null;
}
function todayDayStatus(){
  const today = todayStr();
  return { holiday: holidayOn(today), leave: approvedLeaveOn(today) };
}
function overdueItems(){
  const today = todayStr();
  const items = [];
  DEADLINE_SOURCES.forEach(src=>{
    const key = src[0], dateField = src[1], statusField = src[2], doneValues = src[3], label = src[4];
    if(!dateField) return;
    getActive(key).forEach(rec=>{
      const d = rec[dateField];
      if(!d || d >= today) return;
      if(statusField && doneValues.indexOf(rec[statusField]) !== -1) return;
      const mod = MODULES[key];
      items.push({ moduleKey:key, label:label, date:d, title: rec[mod.titleField] || '(untitled)' });
    });
  });
  items.sort((a,b)=>a.date.localeCompare(b.date));
  return items;
}
function urgencyClass(dateStr){
  const today = todayStr();
  if(dateStr < today) return 'urgency-overdue';
  if(dateStr === today) return 'urgency-today';
  const soon = new Date(Date.now() + 3*86400000).toISOString().slice(0,10);
  if(dateStr <= soon) return 'urgency-soon';
  return 'urgency-later';
}
function greeting(){
  const h = istParts(new Date()).h;
  if(h < 12) return 'Good morning';
  if(h < 17) return 'Good afternoon';
  return 'Good evening';
}
/** Adds `n` IST calendar days to a 'YYYY-MM-DD' date string, returning
 *  another 'YYYY-MM-DD' string — pure date-math (via istParts on a shifted
 *  instant), so it's never affected by the runtime's own timezone. */
function addDaysStr(dateStr, n){
  const [y,mo,da] = dateStr.split('-').map(Number);
  const shifted = new Date(Date.UTC(y, mo-1, da + n));
  return shifted.getUTCFullYear() + '-' + String(shifted.getUTCMonth()+1).padStart(2,'0') + '-' + String(shifted.getUTCDate()).padStart(2,'0');
}
function startOfWeekStr(){
  const p = istParts(new Date()); // p.dow: 0=Sun
  const today = p.y + '-' + String(p.mo+1).padStart(2,'0') + '-' + String(p.da).padStart(2,'0');
  const diffToMon = (p.dow === 0) ? -6 : (1 - p.dow);
  return addDaysStr(today, diffToMon);
}
function endOfWeekStr(){
  const p = istParts(new Date()); // p.dow: 0=Sun
  const today = p.y + '-' + String(p.mo+1).padStart(2,'0') + '-' + String(p.da).padStart(2,'0');
  const diffToSun = (p.dow === 0) ? 0 : (7 - p.dow);
  return addDaysStr(today, diffToSun);
}
/** Open (not-done) DEADLINE_SOURCES items whose date falls within an
 *  inclusive range — the shared engine behind both "due this week" and
 *  the "Deadlines by area" breakdown on the Dashboard. */
function itemsDueBetween(fromStr, toStr){

      items.push({ moduleKey:key, label:label, date:d, title: rec[MODULES[key].titleField] || '(untitled)' });
    });

}
/** Every open overdue/upcoming item (next 30 days), grouped by functional
 *  area using the same AREA_COLORS every other screen already uses — so an
 *  area's color means the same thing here as it does in the nav, Analytics,
 *  and the recent-activity feed. */
function deadlinesByArea(){

  const counts = {};
  items.forEach(it=>{

    counts[menu] = (counts[menu] || 0) + 1;

  return Object.keys(counts).map(menu=>{
