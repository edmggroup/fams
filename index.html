%23e0b558%22%20stroke-width%3D%222%22/%3E%3Ccircle%20cx%3D%2219.5%22%20cy%3D%229.6%22%20r%3D%222.3%22%20fill%3D%22%23e0b558%22/%3E%3C/g%3E%3C/svg%3E">

<style>
:root{
  --navy:#0f1f3d; --navy-2:#16264a; --navy-3:#1c2b4a;
  --gold:#c99a3c; --gold-2:#e0b558;
  --bg:#f0f3fa; --card:#ffffff; --border:#e3e7f0; --border-strong:#cbd1db;
  --text:#1c2333; --text-dim:#5c6478; --text-faint:#8a92a6;
  --ok:#1f8a52; --ok-wash:#e4f4ec;
  --warn:#b9741c; --warn-wash:#fbf0dd;
  --danger:#b3273b; --danger-wash:#fbeae9;
  --info:#2a63c9; --info-wash:#e7eef8;
  --radius:10px; --shadow:0 1px 3px rgba(20,30,60,.08), 0 1px 2px rgba(20,30,60,.06);
  --shadow-md:0 4px 14px rgba(20,30,60,.10);
  --shadow-lg:0 10px 30px rgba(15,25,60,.18);

  /* area accent colours — one per functional zone, used across the
     sidebar, stat cards, badges and analytics so each part of FAMS+
     reads as its own "colour family" at a glance instead of one flat
     navy-and-gold palette everywhere. */
  --a-teaching:#2a63c9;   --a-teaching-wash:#e7eef8;
  --a-exams:#7c3aed;      --a-exams-wash:#f1eafd;
  --a-mentoring:#0891b2;  --a-mentoring-wash:#e3f4f7;
  --a-lab:#0e9f6e;        --a-lab-wash:#e2f7ee;
  --a-extra:#d97706;      --a-extra-wash:#fdf1de;
  --a-research:#059669;   --a-research-wash:#e1f5ee;
  --a-projects:#c99a3c;   --a-projects-wash:#faf3e3;
  --a-incharge:#dc2626;   --a-incharge-wash:#fce9e9;
  --a-committees:#ea580c; --a-committees-wash:#fdece0;
  --a-meetings:#4f46e5;   --a-meetings-wash:#eceafc;
  --a-reminders:#db2777;  --a-reminders-wash:#fce7f0;
  --a-resp:#0f766e;       --a-resp-wash:#e1f2f0;
  --a-diary:#7c5cbf;      --a-diary-wash:#f0ecfa;

  font-size:15px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
.hidden{display:none !important;}
body{font-family:'Inter',sans-serif;color:var(--text);background:var(--bg);min-height:100vh;-webkit-font-smoothing:antialiased;}
.mono{font-family:'IBM Plex Mono',monospace;}
a{color:var(--info);text-decoration:none;}
button{font-family:inherit;}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.content{animation:fadeUp .28s ease both;}
.grid>.stat-card,.grid>.card{animation:fadeUp .34s ease both;}
.grid>.stat-card:nth-child(1),.grid>.card:nth-child(1){animation-delay:.01s;}
.grid>.stat-card:nth-child(2),.grid>.card:nth-child(2){animation-delay:.07s;}
.grid>.stat-card:nth-child(3),.grid>.card:nth-child(3){animation-delay:.13s;}
.grid>.stat-card:nth-child(4),.grid>.card:nth-child(4){animation-delay:.19s;}

/* ---------- layout shell (horizontal top navigation) ---------- */
#app{display:flex;flex-direction:column;min-height:100vh;}
.topnav{position:sticky;top:0;z-index:40;background:var(--card);border-bottom:1px solid var(--border);box-shadow:0 2px 10px rgba(15,25,60,.05);}
.topnav-row1{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;border-bottom:1px solid var(--border);}
.topnav-brand{display:flex;align-items:center;gap:10px;}
.topnav-brand svg{flex:0 0 auto;}
.topnav-brand .name{font-weight:800;font-size:16.5px;letter-spacing:.3px;line-height:1.15;color:var(--navy);}
.topnav-brand .name span{color:var(--gold-2);}
.topnav-brand .name .tag{font-weight:500;font-size:10.5px;letter-spacing:.02em;color:var(--text-dim);margin-top:2px;}
.topnav-utils{display:flex;align-items:center;gap:10px;}
.topnav-row2{display:flex;align-items:center;gap:6px 12px;padding:0 14px;min-height:46px;flex-wrap:wrap;}
.topnav-row2 .row2-title{display:flex;align-items:center;gap:8px;flex:0 0 auto;font-weight:700;font-size:13.5px;color:var(--navy);
  padding:8px 12px 8px 0;border-right:1px solid var(--border);white-space:nowrap;}
/* NOTE: deliberately NOT overflow-x:auto here — that would clip .topnav-dropdown's
   vertical overflow too (an overflow-x:auto ancestor forces overflow-y:auto and
   clips ANY descendant, including position:absolute ones, that extends past its
   box). Categories wrap onto a second line instead on narrow screens. */
.topnav-cats{display:flex;align-items:stretch;gap:2px;flex-wrap:wrap;flex:1;}
.topnav-cat{position:relative;flex:0 0 auto;}
.topnav-cat-btn{display:flex;align-items:center;gap:6px;padding:12px 12px;background:none;border:none;cursor:pointer;
  font-family:inherit;font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--text-dim);
  white-space:nowrap;border-bottom:2.5px solid transparent;transition:color .12s,border-color .12s;}
.topnav-cat-btn:hover{color:var(--navy);}
.topnav-cat.active .topnav-cat-btn{color:var(--navy);border-bottom-color:var(--gold);}
.topnav-cat.open .topnav-cat-btn{color:var(--navy);}
.topnav-cat-chevron{font-size:9px;transition:transform .15s;color:var(--text-faint);}
.topnav-cat.open .topnav-cat-chevron{transform:rotate(180deg);}
.topnav-dropdown{position:absolute;top:100%;left:0;min-width:240px;max-width:320px;max-height:70vh;overflow-y:auto;
  background:var(--card);border:1px solid var(--border);border-radius:0 0 10px 10px;box-shadow:var(--shadow-lg);
  padding:8px;z-index:60;opacity:0;transform:translateY(-6px);pointer-events:none;transition:opacity .16s ease,transform .16s ease;}
.topnav-cat.open .topnav-dropdown{opacity:1;transform:translateY(0);pointer-events:auto;}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;color:var(--text);
  cursor:pointer;font-size:13.5px;font-weight:500;margin-bottom:2px;transition:background .12s,color .12s;}
.nav-item:hover{background:#f1f3f9;}
.nav-item.active{background:rgba(201,154,60,.14);color:var(--navy);box-shadow:inset 2px 0 0 var(--gold-2);font-weight:700;}
.nav-item .chip{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;
  font-size:13px;flex:0 0 auto;background:#f1f3f9;}
.nav-section{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-faint);padding:9px 10px 3px;}
.main{flex:1;display:flex;flex-direction:column;min-height:0;}
.content{flex:1;padding:22px 28px 40px;width:100%;}
.fullscreen-toggle{cursor:pointer;}
@media (max-width:640px){
  .topnav-brand .tag{display:none;}
  .topnav-row2 .row2-title span:last-child{display:none;}
}

/* ---------- cards / generic ---------- */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;transition:box-shadow .15s,transform .15s;}
.card h3{margin:0 0 12px;font-size:15.5px;display:flex;align-items:center;gap:8px;}
.page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
.page-head h2{margin:0;font-size:20px;}
.page-head p{margin:2px 0 0;color:var(--text-dim);font-size:13px;}
.grid{display:grid;gap:14px;}
.grid-2{grid-template-columns:repeat(2,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-4{grid-template-columns:repeat(4,1fr);}
@media (max-width:900px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 16px;border-radius:8px;
  font-size:13.5px;font-weight:600;border:1.5px solid transparent;cursor:pointer;transition:.12s;}
.btn-primary{background:var(--navy);color:#fff;}
.btn-primary:hover{background:#0a1730;}
.btn-gold{background:var(--gold);color:#20200a;}
.btn-gold:hover{background:var(--gold-2);}
.btn-ghost{background:transparent;color:var(--navy);border-color:var(--border-strong);}
.btn-ghost:hover{background:#f1f3f9;}
.btn-danger{background:var(--danger);color:#fff;}
.btn-sm{padding:6px 11px;font-size:12px;border-radius:6px;}
.btn:disabled{opacity:.55;cursor:not-allowed;}

.field{margin-bottom:13px;}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--text-dim);margin-bottom:5px;}
.input,select.input,textarea.input{width:100%;padding:10px 11px;border:1.5px solid var(--border);border-radius:8px;
  font-size:14px;background:#fbfcfe;font-family:inherit;transition:.12s;}
.input:focus{outline:none;border-color:var(--info);box-shadow:0 0 0 3px rgba(42,99,201,.12);}
textarea.input{resize:vertical;min-height:70px;}

.table-wrap{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:auto;box-shadow:var(--shadow);}
table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{text-align:left;padding:10px 12px;background:#f8f9fc;border-bottom:1.5px solid var(--border);font-weight:700;
  font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-dim);white-space:nowrap;}
td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:top;}
tr:hover td{background:#fafbfd;}
.row-actions{display:flex;gap:6px;white-space:nowrap;}

.badge{display:inline-flex;align-items:center;padding:2.5px 9px;border-radius:99px;font-size:11px;font-weight:700;}
.badge-ok{background:var(--ok-wash);color:var(--ok);}
.badge-warn{background:var(--warn-wash);color:var(--warn);}
.badge-danger{background:var(--danger-wash);color:var(--danger);}
.badge-info{background:var(--info-wash);color:var(--info);}
.badge-neutral{background:#eef0f3;color:var(--text-dim);}

.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:16px;display:flex;align-items:center;gap:13px;position:relative;overflow:hidden;transition:transform .15s,box-shadow .15s;}
.stat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);}
.stat-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex:0 0 auto;}
.stat-num{font-size:23px;font-weight:800;line-height:1.1;}
.stat-label{font-size:12px;color:var(--text-dim);}
.stat-trend{font-size:11px;font-weight:600;margin-top:2px;}
.stat-trend.up{color:var(--ok);}
.stat-trend.down{color:var(--danger);}
.stat-trend.flat{color:var(--text-faint);}

.empty{padding:40px 20px;text-align:center;color:var(--text-faint);}
.empty svg{opacity:.4;margin-bottom:10px;}

/* ---------- dashboard: hero / quick actions / progress rings / activity feed ---------- */
.hero{background:linear-gradient(120deg,var(--navy) 0%,#22336b 55%,#3a2a68 100%);color:#fff;border-radius:14px;
  padding:24px 26px;margin-bottom:18px;position:relative;overflow:hidden;box-shadow:var(--shadow-lg);}
.hero::before{content:'';position:absolute;top:-40%;right:-8%;width:320px;height:320px;border-radius:50%;
  background:radial-gradient(circle,rgba(201,154,60,.28),transparent 65%);}
.hero::after{content:'';position:absolute;bottom:-60%;left:10%;width:280px;height:280px;border-radius:50%;
  background:radial-gradient(circle,rgba(111,163,255,.16),transparent 65%);}
.hero-row{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;position:relative;z-index:1;}
.hero-greeting{font-size:21px;font-weight:800;letter-spacing:.2px;}
.hero-sub{font-size:12.5px;color:#c3cbe8;margin-top:4px;}
.hero-clock{text-align:right;}
.hero-clock .time{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:700;}
.hero-clock .date{font-size:11.5px;color:#c3cbe8;margin-top:2px;}

.quick-actions{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 18px;position:relative;z-index:1;}
.qa-btn{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:99px;font-size:12.5px;font-weight:600;
  background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.22);cursor:pointer;transition:.15s;}
.qa-btn:hover{background:rgba(255,255,255,.22);transform:translateY(-1px);}

.ring-wrap{display:flex;align-items:center;gap:14px;}
.ring{width:74px;height:74px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:0 0 auto;position:relative;}
.ring .ring-num{font-size:15px;font-weight:800;color:var(--text);}
.ring-label{font-size:12.5px;font-weight:600;color:var(--text);}
.ring-sub{font-size:11.5px;color:var(--text-dim);margin-top:1px;}

.activity-feed{display:flex;flex-direction:column;}
.activity-item{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);font-size:12.5px;}
.activity-item:last-child{border-bottom:none;}
.activity-dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;margin-top:4px;}
.activity-time{color:var(--text-faint);font-size:11px;white-space:nowrap;}

.urgency-overdue{border-left:3px solid var(--danger);}
.urgency-today{border-left:3px solid var(--warn);}
.urgency-soon{border-left:3px solid var(--gold);}
.urgency-later{border-left:3px solid var(--info);}

/* ---------- auth screens ---------- */
.center-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  background:radial-gradient(circle at 20% 20%, rgba(201,154,60,.10), transparent 45%),
             radial-gradient(circle at 80% 80%, rgba(42,99,201,.10), transparent 45%), var(--bg);}
.auth-card{width:400px;max-width:92vw;background:var(--card);border-radius:16px;box-shadow:var(--shadow-lg);
  padding:34px 30px;position:relative;overflow:hidden;}
.auth-card::before{content:'';position:absolute;top:0;left:0;right:0;height:6px;
  background:linear-gradient(90deg,var(--navy),var(--gold));}
.logo-wrap{text-align:center;margin-bottom:20px;}
.logo-wrap svg{filter:drop-shadow(0 6px 14px rgba(15,25,60,.28));margin-bottom:8px;}
.brand-h1{font-weight:800;font-size:26px;margin:10px 0 4px;color:var(--navy);}
.brand-h1 span{color:var(--gold);}
.auth-sub{font-size:12.5px;color:var(--text-dim);line-height:1.5;}
.pin-input{text-align:center;font-size:30px;letter-spacing:16px;font-family:'IBM Plex Mono',monospace;
  padding:16px 10px 16px 26px;font-weight:600;margin-top:22px;}
.pin-input:disabled{background:#f1f3f9;color:var(--text-faint);}
.error-box{color:var(--danger);font-size:13px;margin-top:12px;min-height:16px;}
.error-box.info{color:var(--info);}

/* ---------- quote card ---------- */
.quote-card{background:linear-gradient(120deg,#3a2a68 0%,#5b3a96 55%,#c99a3c 160%);color:#fff;border-radius:var(--radius);
  padding:16px 18px;margin-bottom:16px;font-size:13.5px;line-height:1.5;position:relative;overflow:hidden;box-shadow:var(--shadow-md);}
.quote-card::before{content:'\201C';position:absolute;top:-18px;right:10px;font-size:90px;font-family:Georgia,serif;
  color:rgba(255,255,255,.12);line-height:1;}
.quote-card .attr{margin-top:6px;font-size:11.5px;opacity:.8;position:relative;}

/* ---------- modal / drawer ---------- */
.overlay{position:fixed;inset:0;background:rgba(15,25,60,.45);display:flex;align-items:center;justify-content:center;
  z-index:100;padding:20px;}
.overlay.hidden{display:none;}
.modal{background:var(--card);border-radius:14px;box-shadow:var(--shadow-lg);max-width:600px;width:100%;
  max-height:88vh;overflow-y:auto;padding:22px;}
.modal h3{margin:0 0 14px;}
.drawer-overlay{position:fixed;inset:0;background:rgba(15,25,60,.42);z-index:90;display:flex;justify-content:flex-end;
  opacity:0;pointer-events:none;transition:opacity .22s ease;}
.drawer-overlay.visible{opacity:1;pointer-events:auto;}
.drawer{background:var(--card);width:520px;max-width:94vw;height:100%;overflow-y:auto;padding:26px 30px 26px 26px;box-shadow:-8px 0 30px rgba(15,25,60,.22);
  transform:translateX(100%);transition:transform .28s cubic-bezier(.19,1,.22,1);position:relative;}
.drawer-overlay.visible .drawer{transform:translateX(0);}
.drawer-close{position:absolute;top:18px;right:18px;width:30px;height:30px;border-radius:50%;background:#f1f3f9;
  border:none;color:var(--text-dim);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;}
.drawer-close:hover{background:var(--danger-wash);color:var(--danger);transform:rotate(90deg);}
.drawer-tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:14px;}
.drawer-tab{padding:8px 12px;font-size:12.5px;font-weight:600;color:var(--text-dim);cursor:pointer;border-bottom:2px solid transparent;}
.drawer-tab.active{color:var(--navy);border-color:var(--navy);}

.toast-wrap{position:fixed;bottom:18px;right:18px;z-index:200;display:flex;flex-direction:column;gap:8px;}

<script>
/* ============================================================
   CONFIG — paste your deployed Apps Script Web App URL below,
   and match APP_KEY / ADMIN_SETUP_KEY to backend/Code.gs exactly.
   ============================================================ */
const DATA_API_URL = 'https://script.google.com/macros/s/AKfycbxCl_KOvuMoln05bxg0PffJzEJP3HdeCjHYs9c2sYr8DMsE-yCZWbckvvpk-a6zhXAJ/exec';
const APP_KEY = 'change-this-to-your-own-random-string-2026';
const APP_NAME = 'FAMS+';
const INSTITUTION_NAME = 'CHRIST (Deemed to be University), Bengaluru';
const DEPARTMENT_NAME = 'Department of Physics and Electronics';

function backendConfigured(){ return typeof DATA_API_URL === 'string' && DATA_API_URL.startsWith('http'); }

/* ============================================================
   API LAYER — plain fetch() calls, no google.script.run. This is
   the single biggest reliability difference from the old build:
   fetch() either gets you real JSON or a real network error, with
   no silent-null failure mode in between.
   ============================================================ */
async function apiGetAll(keys){
  const res = await fetch(DATA_API_URL + '?action=getAll&keys=' + encodeURIComponent(keys.join(',')) + '&key_check=' + encodeURIComponent(APP_KEY));
  if(!res.ok) throw new Error('Backend returned ' + res.status);
  const json = await res.json();
  if(json && json.error) throw new Error(json.error);
  return json.values || {};
}
async function apiSetRaw(key, value){
  const res = await fetch(DATA_API_URL, { method:'POST', body: JSON.stringify({ key, value, appKey: APP_KEY }) });
  if(!res.ok) throw new Error('Backend returned ' + res.status);
  const json = await res.json().catch(()=>({}));
  if(json && json.error) throw new Error(json.error);
  return true;
}
async function apiNotify(type, payload){
  try{
    const res = await fetch(DATA_API_URL, { method:'POST', body: JSON.stringify({ action:'notify', type, payload, appKey: APP_KEY }) });
    const json = await res.json().catch(()=>({}));
    if(!json.ok) console.error('[FAMS+] notification failed:', type, json.error);
    return json;
  }catch(e){ console.error('[FAMS+] notification failed to send (network error):', type, e); return { ok:false, error: String(e) }; }
}
async function apiTestEmail(to){
  const res = await fetch(DATA_API_URL, { method:'POST', body: JSON.stringify({ action:'testEmail', to, appKey: APP_KEY }) });
  return res.json().catch(()=>({ ok:false, error:'Could not parse response' }));
}
async function apiMailMerge(recipients, subject, bodyTemplate){
  const res = await fetch(DATA_API_URL, { method:'POST', body: JSON.stringify({ action:'mailMerge', recipients, subject, bodyTemplate, appKey: APP_KEY }) });
  return res.json().catch(()=>({ ok:false, error:'Could not parse response' }));
}

/* ============================================================
   SMALL UTILITIES
   ============================================================ */
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,9); }
function nowIso(){ return new Date().toISOString(); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(iso){
  if(!iso) return '';
  try{ const d = new Date(iso+'T00:00:00'); return d.getDate()+' '+d.toLocaleDateString('en-US',{month:'short'})+' '+d.getFullYear(); }
  catch(e){ return iso; }
}
function fmtDateTime(iso){
  if(!iso) return '';
  try{ const d = new Date(iso); return d.toLocaleDateString('en-GB')+' '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}); }
  catch(e){ return iso; }
}
function waLink(phone){
  if(!phone) return '#';
  const digits = String(phone).replace(/\D/g,'');
  return 'https://wa.me/' + (digits.length===10 ? '91'+digits : digits);
}
async function sha256(text){
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function toast(msg, kind){
  const wrap = document.getElementById('toast-wrap');
  const el = document.createElement('div');
  el.className = 'toast' + (kind ? ' '+kind : '');
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(()=>el.remove(), 4200);
}
function closeModal(){ document.getElementById('modal-overlay').classList.add('hidden'); document.getElementById('modal-body').innerHTML=''; }
function openModal(html){ document.getElementById('modal-body').innerHTML = html; document.getElementById('modal-overlay').classList.remove('hidden'); }
function closeDrawer(){
  document.getElementById('drawer-overlay').classList.remove('visible');
  setTimeout(()=>{ document.getElementById('drawer-body').innerHTML = ''; }, 220);
}
function openDrawer(html){
  document.getElementById('drawer-body').innerHTML = html;
  document.getElementById('drawer-overlay').classList.add('visible');
}
document.getElementById('modal-overlay').addEventListener('click', e=>{ if(e.target.id==='modal-overlay') closeModal(); });
document.getElementById('drawer-overlay').addEventListener('click', e=>{ if(e.target.id==='drawer-overlay') closeDrawer(); });
document.getElementById('drawer-close-btn').addEventListener('click', closeDrawer);
document.addEventListener('keydown', e=>{
  if(e.key === 'Escape'){
    if(document.getElementById('drawer-overlay').classList.contains('visible')) closeDrawer();
    else if(!document.getElementById('modal-overlay').classList.contains('hidden')) closeModal();
  }
});

window.addEventListener('online', ()=>document.getElementById('offline-banner').classList.add('hidden'));
window.addEventListener('offline', ()=>document.getElementById('offline-banner').classList.remove('hidden'));
window.addEventListener('error', e=>console.error('[FAMS+] uncaught error:', e.error||e.message));
window.addEventListener('unhandledrejection', e=>console.error('[FAMS+] unhandled rejection:', e.reason));

/* ============================================================
   LOGO — an inline SVG mark (graduation cap + orbital ring, for
   "faculty" + "physics/electronics") instead of an emoji or a
   static image file, so it's crisp at any size and themeable via
   the gradients below without shipping a separate image asset.
   Gradient ids are suffixed per-call since the mark is embedded
   more than once in the same document (sidebar, login, etc.).
   ============================================================ */
function logoMarkSvg(size, tag){
  const u = 'lg' + (tag || Math.random().toString(36).slice(2,7));
  return '<svg viewBox="0 0 64 64" width="' + size + '" height="' + size + '" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">'
    + '<defs>'
    + '<linearGradient id="' + u + 'bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1c2f5a"/><stop offset="1" stop-color="#08142c"/></linearGradient>'
    + '<linearGradient id="' + u + 'gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f0c674"/><stop offset="1" stop-color="#c99a3c"/></linearGradient>'
    + '<radialGradient id="' + u + 'glow" cx="0.35" cy="0.28" r="0.8"><stop offset="0" stop-color="#3157a0" stop-opacity="0.95"/><stop offset="1" stop-color="#1c2f5a" stop-opacity="0"/></radialGradient>'
    + '</defs>'
    + '<circle cx="32" cy="32" r="32" fill="url(#' + u + 'bg)"/>'
    + '<circle cx="32" cy="32" r="32" fill="url(#' + u + 'glow)"/>'
    + '<ellipse cx="32" cy="34" rx="25" ry="10.5" fill="none" stroke="#7db0ff" stroke-width="2.4" opacity="0.55" transform="rotate(-20 32 34)"/>'
    + '<circle cx="55.7" cy="26.2" r="2.6" fill="#9cc6ff" transform="rotate(-20 32 34)"/>'
    + '<g transform="translate(32,29)">'
    + '<path d="M0 -12 L19.5 -4 L0 4 L-19.5 -4 Z" fill="url(#' + u + 'gold)"/>'
    + '<path d="M-9 -0.6 L-9 8 Q0 13.2 9 8 L9 -0.6 L0 3.2 Z" fill="#f8efd9"/>'
    + '<line x1="19.5" y1="-4" x2="19.5" y2="8" stroke="#e0b558" stroke-width="2"/>'
    + '<circle cx="19.5" cy="9.6" r="2.3" fill="#e0b558"/>'
    + '</g></svg>';
}

/* ============================================================
   APP STATE & DATA LAYER
   ------------------------------------------------------------
   STATE.data[moduleKey] holds the module's full record array,
   loaded once at boot via a single apiGetAll() call (one sheet
   read on the backend, not one round trip per module). Every
   write goes straight back to the backend (JSON.stringify the
   whole array under that module's key) AND updates STATE.data
   in place, so the UI never has to re-fetch to see its own
   change reflected.
   ============================================================ */
const STATE = { meta:null, config:null, data:{}, loaded:false };

function getCollection(key){ return STATE.data[key] || []; }
function getActive(key){ return getCollection(key).filter(r=>!r.deleted); }
function getRecord(key, id){ return getCollection(key).find(r=>r.id===id) || null; }

function defaultConfig(){
  return { academicYear:'', semester:'', digestHour:7, backupHour:23 };
}

async function loadAllData(){
  const keys = MODULE_KEYS.concat(['app-meta','app-config']);
  const values = await apiGetAll(keys);
  MODULE_KEYS.forEach(k=>{
    try{ STATE.data[k] = values[k] ? JSON.parse(values[k]) : []; }
    catch(e){ STATE.data[k] = []; }
  });
  try{ STATE.meta = values['app-meta'] ? JSON.parse(values['app-meta']) : null; }
  catch(e){ STATE.meta = null; }
  try{ STATE.config = values['app-config'] ? Object.assign(defaultConfig(), JSON.parse(values['app-config'])) : defaultConfig(); }
  catch(e){ STATE.config = defaultConfig(); }
  STATE.loaded = true;
}

async function saveCollection(key, arr){
  STATE.data[key] = arr;
  await apiSetRaw(key, JSON.stringify(arr));
}
async function saveMeta(){ await apiSetRaw('app-meta', JSON.stringify(STATE.meta)); }
async function saveConfig(){ await apiSetRaw('app-config', JSON.stringify(STATE.config)); }

async function createRecord(moduleKey, data){
  const arr = getCollection(moduleKey).slice();
  const rec = Object.assign({ id: uid(), createdAt: nowIso(), updatedAt: nowIso(), notes: [], deleted:false }, data);
  arr.push(rec);
  await saveCollection(moduleKey, arr);
  return rec;
}
async function updateRecord(moduleKey, id, patch){
  const arr = getCollection(moduleKey).slice();
  const idx = arr.findIndex(r=>r.id===id);
  if(idx===-1) throw new Error('Record not found');
  arr[idx] = Object.assign({}, arr[idx], patch, { updatedAt: nowIso() });
  await saveCollection(moduleKey, arr);
  return arr[idx];
}
async function softDeleteRecord(moduleKey, id){ return updateRecord(moduleKey, id, { deleted:true }); }
async function restoreRecord(moduleKey, id){ return updateRecord(moduleKey, id, { deleted:false }); }
async function purgeRecord(moduleKey, id){
  const arr = getCollection(moduleKey).filter(r=>r.id!==id);
  await saveCollection(moduleKey, arr);
}

/* ============================================================
   ACTIVITY LOG — a lightweight, append-only audit trail. Every
   create/update/delete/restore/purge/email-sent action across every
   module writes one entry here (bypassing createRecord so the log
   never logs its own writes). Viewable read-only under Tools →
   Activity Log, and included automatically in Reports since it's
   just another entry in MODULE_KEYS.
   ============================================================ */
const AUDIT_LOG_MAX_ENTRIES = 2000;
async function logAudit(moduleKey, action, recordId, recordTitle, details){
  if(moduleKey === 'audit-log') return; // never log writes to the log itself
  try{
    const arr = getCollection('audit-log').slice();
    arr.push({
      id: uid(), createdAt: nowIso(), updatedAt: nowIso(), notes: [], deleted: false,
      action: action,
      at: nowIso(),
      moduleLabel: (MODULES[moduleKey] && MODULES[moduleKey].label) || moduleKey,
      recordTitle: recordTitle || '(untitled)',
      actor: (STATE.meta && STATE.meta.facultyName) || '',
      details: details || ''
    });
    const trimmed = arr.length > AUDIT_LOG_MAX_ENTRIES ? arr.slice(arr.length - AUDIT_LOG_MAX_ENTRIES) : arr;
    await saveCollection('audit-log', trimmed);
  }catch(e){ console.error('[FAMS+] activity log write failed:', e); }
}

async function addNote(moduleKey, id, text){
  const arr = getCollection(moduleKey).slice();
  const idx = arr.findIndex(r=>r.id===id);
  if(idx===-1) return;
  const notes = (arr[idx].notes || []).slice();
  notes.push({ id: uid(), text, at: nowIso() });
  arr[idx] = Object.assign({}, arr[idx], { notes, updatedAt: nowIso() });
  await saveCollection(moduleKey, arr);
}

/** Resolves a 'reference' field's value (a record id in another module) to
 *  a human-readable label using that module's titleField. */
function refLabel(moduleKey, id){
  if(!id) return '';
  const rec = getRecord(moduleKey, id);
  if(!rec) return '(deleted)';
  const mod = MODULES[moduleKey];
  return rec[mod.titleField] || '(untitled)';
}

/* ============================================================
   AUTH — a single-faculty app, so "auth" is just: has a PIN been
   set (first-run), and does the PIN typed in match it. Session
   is a plain expiry timestamp in localStorage — good enough for
   a personal device, and explicitly NOT presented as enterprise
   -grade security (same disclaimer as the reference project).
   ============================================================ */
const SESSION_KEY = 'fams_session_until';
const SESSION_HOURS = 16;
const PIN_FAIL_KEY = 'fams_pin_fails';
const PIN_LOCK_KEY = 'fams_pin_lock_until';
const PIN_MAX_FAILS = 5;
const PIN_LOCK_MINUTES = 5;

function isAuthed(){ return Number(localStorage.getItem(SESSION_KEY) || 0) > Date.now(); }
function startSession(){ localStorage.setItem(SESSION_KEY, String(Date.now() + SESSION_HOURS*3600*1000)); }
function endSession(){ localStorage.removeItem(SESSION_KEY); }

function pinLocked(){ return Number(localStorage.getItem(PIN_LOCK_KEY) || 0) > Date.now(); }
function pinLockRemainingSec(){ return Math.max(0, Math.ceil((Number(localStorage.getItem(PIN_LOCK_KEY) || 0) - Date.now())/1000)); }
function registerPinFail(){
  const fails = Number(localStorage.getItem(PIN_FAIL_KEY) || 0) + 1;
  if(fails >= PIN_MAX_FAILS){
    localStorage.setItem(PIN_LOCK_KEY, String(Date.now() + PIN_LOCK_MINUTES*60000));
    localStorage.setItem(PIN_FAIL_KEY, '0');
  }else{
    localStorage.setItem(PIN_FAIL_KEY, String(fails));
  }
}
function clearPinFails(){ localStorage.removeItem(PIN_FAIL_KEY); localStorage.removeItem(PIN_LOCK_KEY); }

async function doFirstRunSetup(name, email, phone, pin){
  const pinHash = await sha256(pin);
  STATE.meta = { facultyName: name, email: email, phone: phone || '', pinHash: pinHash, setupAt: nowIso() };
  await saveMeta();
  startSession();
}
async function doLogin(pin){
  if(pinLocked()) throw new Error('Too many attempts. Try again in ' + Math.ceil(pinLockRemainingSec()/60) + ' min.');
  if(!STATE.meta) throw new Error('Not set up yet.');
  const hash = await sha256(pin);
  if(hash !== STATE.meta.pinHash){
    registerPinFail();
    throw new Error('Incorrect PIN.');
  }
  clearPinFails();
  startSession();
}
async function doChangePin(oldPin, newPin){
  const oldHash = await sha256(oldPin);
  if(oldHash !== STATE.meta.pinHash) throw new Error('Current PIN is incorrect.');
  STATE.meta.pinHash = await sha256(newPin);
  await saveMeta();
}
function doLogout(){ endSession(); location.hash = ''; render(); }

const SPECIAL_SCREENS = { dashboard:'📊', 'work-diary':'📔', analytics:'📈', reports:'📤', calendar:'🗓️', admin:'⚙️' };

  mentoring:'#0891b2', laboratory:'#0e9f6e', 'extra-classes':'#d97706', research:'#059669',

];

function parseRoute(){
  const h = (location.hash || '#/dashboard').replace(/^#\/?/, '');
  const parts = h.split('/').filter(Boolean);
  if(parts[0] === 'module' && parts[1]) return { screen:'module', moduleKey:parts[1] };
  if(parts[0] && (SPECIAL_SCREENS[parts[0]] || ['analytics','reports','calendar','admin','dashboard'].indexOf(parts[0])!==-1)) return { screen:parts[0] };
  return { screen:'dashboard' };
}
function isModuleRoute(key){ const r = parseRoute(); return r.screen==='module' && r.moduleKey===key; }
function isScreenRoute(key){ const r = parseRoute(); return r.screen===key; }
function navigate(href){ location.hash = href; }

/* ============================================================
   BOOT / TOP-LEVEL RENDER
   ============================================================ */
const ROOT = document.getElementById('root');
let clockTimer = null;

async function boot(){
  if(!backendConfigured()){ ROOT.innerHTML = renderSetupNeededScreen(); return; }
  try{
    await loadAllData();
  }catch(e){
    ROOT.innerHTML = renderLoadErrorScreen(e);
    const btn = document.getElementById('retry-load-btn');
    if(btn) btn.addEventListener('click', boot);
    return;
  }
  window.addEventListener('hashchange', render);
  render();
}

function render(){
  if(!STATE.meta){ ROOT.innerHTML = renderFirstRunScreen(); wireFirstRunScreen(); return; }
  if(!isAuthed()){ ROOT.innerHTML = renderLoginScreen(); wireLoginScreen(); return; }
  ROOT.innerHTML = renderShellSkeleton();
  wireShell();
  renderRoute();
  startClock();
}

function startClock(){
  if(clockTimer) clearInterval(clockTimer);
  const tick = ()=>{
    const el = document.getElementById('live-clock');
    if(!el){ clearInterval(clockTimer); return; }
    el.textContent = new Date().toLocaleString('en-IN', { weekday:'short', day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' });
    const heroClock = document.getElementById('hero-clock');
    if(heroClock) heroClock.textContent = new Date().toLocaleTimeString('en-IN', { hour:'2-digit', minute:'2-digit' });
  };
  tick();
  clockTimer = setInterval(tick, 30000);
}

function renderRoute(){
  const r = parseRoute();
  const content = document.getElementById('content');
  const titleEl = document.getElementById('topbar-title');
  if(r.screen === 'module'){
    const mod = MODULES[r.moduleKey];
    if(!mod){ content.innerHTML = '<div class="empty">Unknown module.</div>'; return; }
    titleEl.textContent = mod.label;
    if(r.moduleKey === 'timetable'){
      content.innerHTML = renderTimetableScreen();
      wireTimetableScreen();
    }else{
      content.innerHTML = renderModuleList(r.moduleKey);
      wireModuleList(r.moduleKey);
    }
  }else if(r.screen === 'dashboard'){
    titleEl.textContent = 'Dashboard';
    content.innerHTML = renderDashboard();
    wireDashboard();
  }else if(r.screen === 'analytics'){
    titleEl.textContent = 'Analytics';
    content.innerHTML = renderAnalytics();
    wireAnalytics();
  }else if(r.screen === 'reports'){
    titleEl.textContent = 'Reports';
    content.innerHTML = renderReports();
    wireReports();
  }else if(r.screen === 'calendar'){
    titleEl.textContent = 'Calendar';
    content.innerHTML = renderCalendar();
  }else if(r.screen === 'admin'){
    titleEl.textContent = 'Admin & Settings';
    content.innerHTML = renderAdmin();
    wireAdmin();
  }else{
    titleEl.textContent = 'Dashboard';
    content.innerHTML = renderDashboard();
    wireDashboard();
  }
}

function wireFirstRunScreen(){

    + '<button class="btn btn-primary" type="submit" id="pin-submit" style="width:100%;margin-top:14px;" disabled>Sign In</button>'
    + '</form>'
    + '<div class="error-box' + (locked ? '' : ' info') + '" id="login-error">' + (locked ? ('Locked — try again in ' + Math.ceil(pinLockRemainingSec()/60) + ' min.') : 'Enter your 4-digit PIN.') + '</div>'
    + '</div></div>';
}
function wireLoginScreen(){
  const input = document.getElementById('pin-input');
  const errEl = document.getElementById('login-error');
  const submitBtn = document.getElementById('pin-submit');
  const form = document.getElementById('login-form');
  if(!pinLocked()) input.focus();
  input.addEventListener('input', ()=>{
    input.value = input.value.replace(/\D/g, '').slice(0, 4);
    submitBtn.disabled = input.value.length !== 4 || pinLocked();
  });
  form.addEventListener('submit', async (e)=>{
    e.preventDefault();
    if(input.value.length !== 4 || pinLocked()) return;
    submitBtn.disabled = true;
    errEl.className = 'error-box';
    errEl.textContent = 'Checking…';
    try{
      await doLogin(input.value);
      render();
    }catch(err){
      input.value = '';
      submitBtn.disabled = true;
      errEl.textContent = (err && err.message ? err.message : String(err));
      input.focus();
    }
  });
}

/* ============================================================
   APP SHELL — horizontal top navigation (built from MAIN_MENUS +
   MODULES): a brand/utility row, then a row of category tabs that
   each open a dropdown of that category's modules. Replaces the
   earlier left sidebar — much better on narrow/touch screens, and
   there's no permanent vertical menu competing with page content.
   ============================================================ */
function navItemHtml(icon, label, href, active, color){
  const style = color ? ' style="background:' + color + '38;"' : '';
  return '<div class="nav-item' + (active ? ' active' : '') + '" data-href="' + href + '"><span class="chip"' + style + '>' + icon + '</span><span>' + escapeHtml(label) + '</span></div>';
}
function navGroupHtml(group){
  const color = AREA_COLORS[group.key];
  if(SPECIAL_SCREENS[group.key] && group.key !== 'work-diary'){
    return navItemHtml(SPECIAL_SCREENS[group.key], group.label, '#/' + group.key, isScreenRoute(group.key), color);
  }
  const mods = MODULE_KEYS.filter(k => MODULES[k].menu === group.key);
  if(mods.length === 1 && mods[0] === group.key){
    const m = MODULES[mods[0]];
    return navItemHtml(m.icon, group.label, '#/module/' + mods[0], isModuleRoute(mods[0]), color);
  }
  if(mods.length === 0) return '';
  let html = '<div class="nav-section">' + escapeHtml(group.label) + '</div>';
  mods.forEach(k=>{
    const m = MODULES[k];
    html += navItemHtml(m.icon, m.label, '#/module/' + k, isModuleRoute(k), color);
  });
  return html;
}
function activeCategoryKey(){
  const r = parseRoute();
  const groupKey = r.screen === 'module' ? MODULES[r.moduleKey].menu : r.screen;
  const cat = NAV_CATEGORIES.find(c => c.groups.indexOf(groupKey) !== -1);
  return cat ? cat.key : NAV_CATEGORIES[0].key;
}
function currentScreenLabel(){
  const r = parseRoute();
  if(r.screen === 'module') return (MODULES[r.moduleKey] && MODULES[r.moduleKey].label) || r.moduleKey;
  const group = MAIN_MENUS.find(g=>g.key===r.screen);
  return group ? group.label : 'Dashboard';
}
function topNavCatsHtml(){
  const activeCat = activeCategoryKey();
  let html = '';
  NAV_CATEGORIES.forEach(cat=>{
    html += '<div class="topnav-cat' + (cat.key === activeCat ? ' active' : '') + '" data-cat="' + cat.key + '">';

    });

  });
  return html;
}

/* ============================================================
   GENERIC MODULE ENGINE — one list/search/table renderer and one
   form-drawer renderer, driven entirely by a MODULES[key] config.
   Every built-in module (and any you add later) gets a working
   list + add/edit/notes/delete screen for free from this.
   ============================================================ */
function fieldByKey(mod, key){ return mod.fields.find(f=>f.key===key); }

function moduleDisplayColumns(mod){
  const cols = [];
  const titleF = fieldByKey(mod, mod.titleField);
  if(titleF) cols.push(titleF);
  if(mod.dateField){
    const df = fieldByKey(mod, mod.dateField);
    if(df && cols.indexOf(df)===-1) cols.push(df);
  }
  mod.fields.forEach(f=>{
    if(cols.length >= 4) return;
    if(cols.indexOf(f) !== -1) return;
    if(f.type === 'textarea') return;
    cols.push(f);
  });
  return cols;
}

function statusBadgeClass(v){
  const s = String(v).toLowerCase();
  if(['completed','done','approved','resolved','active','held','on track','ok'].indexOf(s) !== -1) return 'badge-ok';
  if(['cancelled','rejected','delayed'].indexOf(s) !== -1) return 'badge-danger';
  if(['pending','open','applied','scheduled','planned','assigned','in progress'].indexOf(s) !== -1) return 'badge-warn';
  return 'badge-neutral';
}
function fieldDisplayValue(mod, field, rec){
  const v = rec[field.key];
  if(field.type === 'reference') return escapeHtml(refLabel(field.ref, v));
  if(field.type === 'date') return v ? escapeHtml(fmtDate(v)) : '<span style="color:var(--text-faint)">—</span>';
  if(field.type === 'datetime') return v ? escapeHtml(fmtDateTime(v)) : '<span style="color:var(--text-faint)">—</span>';
  if(v === null || v === undefined || v === '') return '<span style="color:var(--text-faint)">—</span>';
  if(field.key === 'status') return '<span class="badge ' + statusBadgeClass(v) + '">' + escapeHtml(v) + '</span>';
  return escapeHtml(String(v));
}

let LIST_SELECTION = new Set();

function renderModuleList(moduleKey){
  const mod = MODULES[moduleKey];
  LIST_SELECTION = new Set();
  if(mod.readOnly){
    return '<div class="page-head"><div><h2>' + mod.icon + ' ' + escapeHtml(mod.label) + '</h2>'
      + '<p>' + getActive(moduleKey).length + ' entr' + (getActive(moduleKey).length===1?'y':'ies') + ' recorded</p></div></div>'
      + '<div class="search-bar"><input class="input" id="module-search" placeholder="Search…"></div>'
      + '<div class="table-wrap" id="module-table-wrap"></div>';
  }
  return '<div class="page-head"><div><h2>' + mod.icon + ' ' + escapeHtml(mod.label) + '</h2>'
    + '<p>' + getActive(moduleKey).length + ' active record(s)</p></div>'
    + '<div style="display:flex;gap:8px;flex-wrap:wrap;">'
    + '<button class="btn btn-ghost" id="bulk-import-btn">⬆ Bulk Import</button>'
    + '<button class="btn btn-primary" id="add-record-btn">+ Add ' + escapeHtml(mod.label) + '</button>'
    + '</div></div>'
    + '<div class="search-bar"><input class="input" id="module-search" placeholder="Search…">'
    + '<label style="display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-dim);">'
    + '<input type="checkbox" id="show-deleted"> Show deleted</label></div>'
    + '<div id="bulk-toolbar"></div>'
    + '<div class="table-wrap" id="module-table-wrap"></div>';
}

function moduleTableHtml(moduleKey, cols, search, showDeleted){
  const mod = MODULES[moduleKey];
  const selectable = !mod.readOnly;
  let rows = showDeleted ? getCollection(moduleKey) : getActive(moduleKey);
  if(search){
    const q = search.toLowerCase();
    rows = rows.filter(r => JSON.stringify(r).toLowerCase().indexOf(q) !== -1);
  }
  rows = rows.slice().sort((a,b)=>{
    if(mod.dateField) return String(b[mod.dateField]||'').localeCompare(String(a[mod.dateField]||''));
    return String(b.createdAt||'').localeCompare(String(a.createdAt||''));
  });
  if(rows.length === 0) return '<div class="empty">' + (mod.readOnly ? 'No activity recorded yet.' : ('No records yet. Click "Add ' + escapeHtml(mod.label) + '" to create the first one.')) + '</div>';
  let html = '<table style="width:100%;border-collapse:collapse;"><thead><tr>';
  if(selectable){
    const visibleIds = rows.map(r=>r.id);
    const allSelected = visibleIds.length > 0 && visibleIds.every(id=>LIST_SELECTION.has(id));
    html += '<th style="width:34px;padding:10px 6px;border-bottom:1px solid var(--border);"><input type="checkbox" id="select-all-rows"' + (allSelected ? ' checked' : '') + '></th>';
  }
  cols.forEach(c=>{ html += '<th style="text-align:left;padding:10px 12px;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-dim);border-bottom:1px solid var(--border);">' + escapeHtml(c.label) + '</th>'; });
  if(selectable) html += '<th style="border-bottom:1px solid var(--border);"></th>';
  html += '</tr></thead><tbody>';
  rows.forEach(r=>{
    html += '<tr data-id="' + r.id + '"' + (r.deleted ? ' style="opacity:.5;"' : '') + '>';
    if(selectable) html += '<td style="padding:10px 6px;border-bottom:1px solid var(--border);"><input type="checkbox" class="row-select" data-id="' + r.id + '"' + (LIST_SELECTION.has(r.id) ? ' checked' : '') + '></td>';
    cols.forEach(c=>{ html += '<td style="padding:10px 12px;border-bottom:1px solid var(--border);font-size:13px;">' + fieldDisplayValue(mod, c, r) + '</td>'; });
    if(selectable){
      html += '<td style="padding:8px 12px;border-bottom:1px solid var(--border);"><div class="row-actions">';
      if(!r.deleted){
        html += '<button class="btn btn-ghost btn-sm" data-action="edit">Edit</button>';
        html += '<button class="btn btn-ghost btn-sm" data-action="notes">Notes' + ((r.notes && r.notes.length) ? ' (' + r.notes.length + ')' : '') + '</button>';
        if(mod.fields.some(f=>f.key==='email')) html += '<button class="btn btn-ghost btn-sm" data-action="email" title="Email">✉️</button>';
        if(mod.fields.some(f=>f.key==='phone')) html += '<button class="btn btn-ghost btn-sm" data-action="whatsapp" title="WhatsApp">💬</button>';
        html += '<button class="btn btn-ghost btn-sm" data-action="delete">Delete</button>';
      }else{
        html += '<button class="btn btn-ghost btn-sm" data-action="restore">Restore</button>';
        html += '<button class="btn btn-danger btn-sm" data-action="purge">Purge</button>';
      }
      html += '</div></td>';
    }
    html += '</tr>';
  });
  html += '</tbody></table>';
  return html;
}

function wireModuleList(moduleKey){
  const mod = MODULES[moduleKey];
  const cols = moduleDisplayColumns(mod);
  const wrap = document.getElementById('module-table-wrap');
  const searchEl = document.getElementById('module-search');
  const showDelEl = document.getElementById('show-deleted');
  const bulkToolbarEl = document.getElementById('bulk-toolbar');

  function renderBulkToolbar(){
    if(!bulkToolbarEl) return;
    const n = LIST_SELECTION.size;
    if(n === 0){ bulkToolbarEl.innerHTML = ''; return; }
    const hasEmail = mod.fields.some(f=>f.key==='email');
    bulkToolbarEl.innerHTML = '<div style="display:flex;align-items:center;gap:10px;background:#eef2fb;border:1px solid var(--border);border-radius:8px;padding:9px 14px;margin-bottom:10px;flex-wrap:wrap;">'
      + '<strong style="font-size:13px;">' + n + ' selected</strong>'
      + (hasEmail ? '<button class="btn btn-ghost btn-sm" id="bulk-email-btn">✉️ Email Selected</button>' : '')
      + '<button class="btn btn-ghost btn-sm" id="bulk-delete-btn" style="color:var(--danger);">🗑 Delete Selected</button>'
      + '<button class="btn btn-ghost btn-sm" id="bulk-clear-btn" style="margin-left:auto;">Clear</button>'
      + '</div>';
    const clearBtn = document.getElementById('bulk-clear-btn');
    if(clearBtn) clearBtn.addEventListener('click', ()=>{ LIST_SELECTION.clear(); refreshTable(); });
    const emailBtn = document.getElementById('bulk-email-btn');
    if(emailBtn) emailBtn.addEventListener('click', ()=>{
      const records = Array.from(LIST_SELECTION).map(id=>getRecord(moduleKey, id)).filter(Boolean);
      openEmailComposeDrawer(moduleKey, records, ()=>{ LIST_SELECTION.clear(); refreshTable(); });
    });
    const bulkDeleteBtn = document.getElementById('bulk-delete-btn');
    if(bulkDeleteBtn) bulkDeleteBtn.addEventListener('click', async ()=>{
      if(!confirm('Delete ' + n + ' selected record(s)? You can restore them later from "Show deleted".')) return;
      const ids = Array.from(LIST_SELECTION);
      for(const id of ids){
        const rec = getRecord(moduleKey, id);
        await softDeleteRecord(moduleKey, id);
        logAudit(moduleKey, 'Deleted', id, rec ? (rec[mod.titleField] || '') : '');
      }
      toast(ids.length + ' record(s) deleted', 'ok');
      LIST_SELECTION.clear();
      refreshTable();
    });
  }

  function refreshTable(){
    wrap.innerHTML = moduleTableHtml(moduleKey, cols, searchEl.value, showDelEl ? showDelEl.checked : false);
    renderBulkToolbar();
  }
  refreshTable();
  searchEl.addEventListener('input', refreshTable);
  if(showDelEl) showDelEl.addEventListener('change', refreshTable);
  const addBtn = document.getElementById('add-record-btn');
  if(addBtn) addBtn.addEventListener('click', ()=>openModuleForm(moduleKey, null));
  const bulkImportBtn = document.getElementById('bulk-import-btn');
  if(bulkImportBtn) bulkImportBtn.addEventListener('click', ()=>openBulkImportDrawer(moduleKey, refreshTable));
  wrap.addEventListener('click', async (e)=>{
    const selectAllBox = e.target.closest('#select-all-rows');
    if(selectAllBox){
      const rowBoxes = wrap.querySelectorAll('.row-select');
      if(selectAllBox.checked) rowBoxes.forEach(cb=>LIST_SELECTION.add(cb.dataset.id));
      else LIST_SELECTION.clear();
      refreshTable();
      return;
    }
    const rowBox = e.target.closest('.row-select');
    if(rowBox){
      if(rowBox.checked) LIST_SELECTION.add(rowBox.dataset.id);
      else LIST_SELECTION.delete(rowBox.dataset.id);
      renderBulkToolbar();
      return;
    }
    const btn = e.target.closest('[data-action]');
    if(!btn) return;
    const tr = e.target.closest('tr[data-id]');
    const id = tr.dataset.id;
    const action = btn.dataset.action;
    const rec = getRecord(moduleKey, id);
    if(!rec) return;
    if(action === 'edit') openModuleForm(moduleKey, id);
    else if(action === 'notes') openNotesDrawer(moduleKey, id);
    else if(action === 'email') openEmailComposeDrawer(moduleKey, [rec], refreshTable);
    else if(action === 'whatsapp') window.open(waLink(rec.phone), '_blank');
    else if(action === 'delete'){
      if(!confirm('Delete this record? You can restore it later from "Show deleted".')) return;
      await softDeleteRecord(moduleKey, id); logAudit(moduleKey, 'Deleted', id, rec[mod.titleField] || ''); toast('Deleted', 'ok'); refreshTable();
    }else if(action === 'restore'){
      await restoreRecord(moduleKey, id); logAudit(moduleKey, 'Restored', id, rec[mod.titleField] || ''); toast('Restored', 'ok'); refreshTable();
    }else if(action === 'purge'){
      if(!confirm('Permanently delete this record? This cannot be undone.')) return;
      await purgeRecord(moduleKey, id); logAudit(moduleKey, 'Purged', id, rec[mod.titleField] || ''); toast('Purged', 'ok'); refreshTable();
    }
  });
}

function fieldInputHtml(mod, field, value){
  const id = 'f_' + field.key;
  let v = value;
  if(v === undefined || v === null) v = (field.default === '__today__' ? todayStr() : (field.default != null ? field.default : ''));
  if(field.type === 'select'){
    const opts = (field.options || []).map(o=>'<option value="' + escapeHtml(o) + '"' + (o === v ? ' selected' : '') + '>' + escapeHtml(o) + '</option>').join('');
    return '<select class="input" id="' + id + '"><option value="">— Select —</option>' + opts + '</select>';
  }
  if(field.type === 'textarea') return '<textarea class="input" id="' + id + '">' + escapeHtml(v) + '</textarea>';
  if(field.type === 'reference'){
    const refMod = MODULES[field.ref];
    const opts = getActive(field.ref).map(r=>'<option value="' + r.id + '"' + (r.id === v ? ' selected' : '') + '>' + escapeHtml(r[refMod.titleField] || '(untitled)') + '</option>').join('');
    return '<select class="input" id="' + id + '"><option value="">— None —</option>' + opts + '</select>';
  }
  const typeMap = { text:'text', email:'email', phone:'tel', number:'number', date:'date', time:'time' };
  return '<input class="input" id="' + id + '" type="' + (typeMap[field.type] || 'text') + '" value="' + escapeHtml(v) + '">';
}

function notesTabHtml(rec){
  const notes = rec.notes || [];
  let html = '<div class="notes-list">';
  if(notes.length === 0) html += '<div class="empty" style="padding:20px;">No notes yet.</div>';
  notes.slice().reverse().forEach(n=>{ html += '<div class="note-item"><div class="ts">' + escapeHtml(fmtDateTime(n.at)) + '</div>' + escapeHtml(n.text) + '</div>'; });
  html += '</div>';
  html += '<div class="field" style="margin-top:10px;"><label>Add note</label><textarea class="input" id="new-note-text"></textarea></div>';
  html += '<button class="btn btn-primary btn-sm" id="add-note-btn" type="button">Add Note</button>';
  return html;
}

function openModuleForm(moduleKey, id){
  const mod = MODULES[moduleKey];
  const rec = id ? getRecord(moduleKey, id) : null;
  let html = '<h3 style="margin:0 0 4px;padding-right:26px;">' + (rec ? 'Edit ' : 'Add ') + escapeHtml(mod.label) + '</h3>';
  if(rec) html += '<div class="drawer-tabs"><div class="drawer-tab active" data-tab="details">Details</div><div class="drawer-tab" data-tab="notes">Notes (' + ((rec.notes || []).length) + ')</div></div>';
  html += '<div id="tab-details"><form id="record-form">';
  mod.fields.forEach(f=>{ html += '<div class="field"><label>' + escapeHtml(f.label) + (f.required ? ' *' : '') + '</label>' + fieldInputHtml(mod, f, rec ? rec[f.key] : undefined) + '</div>'; });
  html += '<div class="error-box" id="form-error"></div>';
  html += '<div style="display:flex;gap:8px;margin-top:6px;"><button type="submit" class="btn btn-primary">Save</button><button type="button" class="btn btn-ghost" id="form-cancel">Cancel</button></div>';
  html += '</form></div>';
  if(rec) html += '<div id="tab-notes" class="hidden">' + notesTabHtml(rec) + '</div>';
  openDrawer(html);
  wireModuleForm(moduleKey, id);
}
function openNotesDrawer(moduleKey, id){
  openModuleForm(moduleKey, id);
  const tab = document.querySelector('.drawer-tab[data-tab="notes"]');
  if(tab) tab.click();
}
function wireModuleForm(moduleKey, id){
  const mod = MODULES[moduleKey];
  const drawer = document.getElementById('drawer-body');
  const tabs = drawer.querySelectorAll('.drawer-tab');
  tabs.forEach(t=>{
    t.addEventListener('click', ()=>{
      tabs.forEach(x=>x.classList.remove('active'));
      t.classList.add('active');
      const dTab = drawer.querySelector('#tab-details'); if(dTab) dTab.classList.toggle('hidden', t.dataset.tab !== 'details');
      const nTab = drawer.querySelector('#tab-notes'); if(nTab) nTab.classList.toggle('hidden', t.dataset.tab !== 'notes');
    });
  });
  const cancelBtn = document.getElementById('form-cancel');
  if(cancelBtn) cancelBtn.addEventListener('click', closeDrawer);
  const form = document.getElementById('record-form');
  if(form){
    form.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const errEl = document.getElementById('form-error');
      errEl.textContent = '';
      const data = {};
      for(let i=0;i<mod.fields.length;i++){
        const f = mod.fields[i];
        const el = document.getElementById('f_' + f.key);
        let v = el.value;
        if(f.type === 'number') v = v === '' ? '' : Number(v);
        if(f.required && (v === '' || v == null)){ errEl.textContent = f.label + ' is required.'; el.focus(); return; }
        data[f.key] = v;
      }
      const btn = form.querySelector('button[type=submit]');
      btn.disabled = true; btn.textContent = 'Saving…';
      try{
        let savedRec;
        if(id){ savedRec = await updateRecord(moduleKey, id, data); logAudit(moduleKey, 'Updated', id, savedRec[mod.titleField] || ''); }
        else{ savedRec = await createRecord(moduleKey, data); logAudit(moduleKey, 'Created', savedRec.id, savedRec[mod.titleField] || ''); }
        toast('Saved', 'ok');
        closeDrawer();
        const r = parseRoute();
        if(r.screen === 'module' && r.moduleKey === moduleKey){ renderRoute(); }
        else if(r.screen === 'dashboard'){ renderRoute(); }
      }catch(err){
        errEl.textContent = err && err.message ? err.message : String(err);
        btn.disabled = false; btn.textContent = 'Save';
      }
    });
  }
  const addNoteBtn = document.getElementById('add-note-btn');
  if(addNoteBtn){
    addNoteBtn.addEventListener('click', async ()=>{
      const ta = document.getElementById('new-note-text');
      const text = ta.value.trim();
      if(!text) return;
      addNoteBtn.disabled = true;
      try{
        await addNote(moduleKey, id, text);
        openNotesDrawer(moduleKey, id);
      }catch(err){ toast('Failed to add note', 'danger'); addNoteBtn.disabled = false; }
    });
  }
}

/* ============================================================
   EMAIL COMPOSE — sends real mail (not a mailto: link) through the
   app's own backend, so it goes out from the official email address
   configured for this deployment (see backend/Code.gs OFFICE_EMAIL /
   sendAs_). Works for a single record's "✉️ Email" row action or a
   multi-record "Email Selected" bulk action — both funnel through
   the same drawer and the existing mailMerge backend endpoint, so
   {{name}} (and any other record field) can be used as a merge tag.
   ============================================================ */
function emailComposeHtml(recipients, missingCount, contextLabel){
  const toLine = recipients.length
    ? recipients.map(r => escapeHtml((r.name || '(no name)') + ' <' + r.email + '>')).join(', ')
    : '<span style="color:var(--text-faint);">No valid recipients</span>';
  return '<h3 style="margin:0 0 4px;padding-right:26px;">✉️ Email' + (contextLabel ? ' — ' + escapeHtml(contextLabel) : '') + '</h3>'
    + '<div style="font-size:12.5px;color:var(--text-dim);margin-bottom:4px;line-height:1.5;">To: ' + toLine + '</div>'
    + (missingCount ? '<div style="font-size:12px;color:var(--warn,#b45309);margin-bottom:10px;">' + missingCount + ' selected record(s) have no email address and will be skipped.</div>' : '<div style="margin-bottom:10px;"></div>')
    + '<form id="email-compose-form">'
    + '<div class="field"><label>Subject</label><input class="input" id="ec-subject" required></div>'
    + '<div class="field"><label>Message <span style="font-weight:400;color:var(--text-dim);">— {{name}} is replaced with each recipient\'s name</span></label><textarea class="input" id="ec-body" style="min-height:170px;" required></textarea></div>'
    + '<div class="error-box" id="ec-error"></div>'
    + '<div style="display:flex;gap:8px;">'
    + '<button type="submit" class="btn btn-primary" id="ec-send"' + (recipients.length === 0 ? ' disabled' : '') + '>Send' + (recipients.length > 1 ? ' to ' + recipients.length : '') + '</button>'
    + '<button type="button" class="btn btn-ghost" id="ec-cancel">Cancel</button>'
    + '</div></form>';
}
function openEmailComposeDrawer(moduleKey, records, onDone){
  const mod = MODULES[moduleKey];
  const withEmail = records.filter(r => r.email);
  const recipients = withEmail.map(r => Object.assign({}, r, { name: r[mod.titleField] || r.name || '' }));
  const missingCount = records.length - withEmail.length;
  openDrawer(emailComposeHtml(recipients, missingCount, mod.label));
  const cancelBtn = document.getElementById('ec-cancel');
  if(cancelBtn) cancelBtn.addEventListener('click', closeDrawer);
  const form = document.getElementById('email-compose-form');
  if(!form) return;
  form.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const sendBtn = document.getElementById('ec-send');
    const errEl = document.getElementById('ec-error');
    const subject = document.getElementById('ec-subject').value.trim();
    const body = document.getElementById('ec-body').value;
    if(!subject || !body || recipients.length === 0) return;
    sendBtn.disabled = true; sendBtn.textContent = 'Sending…'; errEl.textContent = '';
    try{
      const res = await apiMailMerge(recipients, subject, body);
      if(!res || !res.ok) throw new Error((res && res.error) || 'Send failed');
      const results = res.results || [];
      const failed = results.filter(r=>!r.ok);
      withEmail.forEach(r=>{ logAudit(moduleKey, 'Emailed', r.id, r[mod.titleField] || r.name || '', subject); });
      if(failed.length === 0) toast('Email sent to ' + results.length + ' recipient(s)', 'ok');
      else if(failed.length === results.length) toast('Email failed to send', 'err');
      else toast('Sent to ' + (results.length - failed.length) + ' of ' + results.length + ' recipient(s)', 'ok');
      closeDrawer();
      if(onDone) onDone();
    }catch(err){
      errEl.textContent = err && err.message ? err.message : String(err);
      sendBtn.disabled = false; sendBtn.textContent = 'Send' + (recipients.length > 1 ? ' to ' + recipients.length : '');
    }
  });
}

/* ============================================================
   BULK IMPORT (Excel / CSV) — for any module, driven by the same
   MODULES[key].fields config as the manual add/edit form. Uses
   SheetJS (loaded via CDN in <head>) to read .xlsx/.xls/.csv in
   the browser — nothing is uploaded anywhere, the file never
   leaves the device until the parsed records are saved to your
   own backend the normal way.
   ============================================================ */
function bulkImportAvailable(){ return typeof XLSX !== 'undefined'; }

function downloadModuleTemplate(moduleKey){
  const mod = MODULES[moduleKey];
  const headers = mod.fields.map(f=>f.label);
  const sampleRow = {};
  mod.fields.forEach(f=>{
    sampleRow[f.label] = f.type === 'select' ? (f.options && f.options[0] || '') : (f.type === 'date' ? todayStr() : '');
  });
  const ws = XLSX.utils.json_to_sheet([sampleRow], { header: headers });
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, mod.label.slice(0, 28) || 'Sheet1');
  XLSX.writeFile(wb, 'fams-plus-' + moduleKey + '-template.xlsx');
}

/** Best-effort match of a spreadsheet column header to a module field, by
 *  exact label, then by field key, both case/space-insensitive. */
function matchFieldForHeader(mod, header){
  const norm = String(header || '').trim().toLowerCase();
  return mod.fields.find(f => f.label.trim().toLowerCase() === norm)
    || mod.fields.find(f => f.key.trim().toLowerCase() === norm)
    || null;
}
/** Loosely coerces a spreadsheet cell into the shape a field expects —
 *  SheetJS already turns real Excel dates into JS Date objects, so dates
 *  need converting back to the plain YYYY-MM-DD strings the app stores. */
function coerceImportValue(field, raw){
  if(raw == null) return '';
  if(field.type === 'date'){
    if(raw instanceof Date) return raw.toISOString().slice(0, 10);
    const s = String(raw).trim();
    const parsed = new Date(s);
    if(s && !isNaN(parsed) && /\d/.test(s)) return parsed.toISOString().slice(0, 10);
    return s;
  }
  if(field.type === 'number'){
    const n = Number(raw);
    return isNaN(n) ? '' : n;
  }
  return String(raw).trim();
}

function parseWorkbookForModule(moduleKey, arrayBuffer){
  const mod = MODULES[moduleKey];
  const wb = XLSX.read(arrayBuffer, { type: 'array', cellDates: true });
  const sheet = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(sheet, { defval: '' });
  const records = [];
  const skipped = [];
  rows.forEach((row, idx)=>{
    const headers = Object.keys(row);
    const allBlank = headers.every(h => String(row[h]).trim() === '');
    if(allBlank) return;
    const data = {};
    headers.forEach(h=>{
      const field = matchFieldForHeader(mod, h);
      if(field) data[field.key] = coerceImportValue(field, row[h]);
    });
    const missingRequired = mod.fields.filter(f => f.required && (data[f.key] === undefined || data[f.key] === ''));
    if(missingRequired.length){
      skipped.push({ row: idx + 2, reason: 'missing ' + missingRequired.map(f=>f.label).join(', ') });
      return;
    }
    mod.fields.forEach(f=>{ if(data[f.key] === undefined) data[f.key] = f.default === '__today__' ? todayStr() : (f.default != null ? f.default : ''); });
    records.push(data);
  });
  return { records, skipped, totalRows: rows.length };
}

      html2 += '<div class="table-wrap"><table style="width:100%;border-collapse:collapse;"><thead><tr>'

          records.forEach(data=>{
            arr.push(Object.assign({ id: uid(), createdAt: nowIso(), updatedAt: nowIso(), notes: [], deleted:false }, data));
          });
          await saveCollection(moduleKey, arr);
          toast(records.length + ' record(s) imported', 'ok');
          closeDrawer();
          if(onDone) onDone();
        }catch(err){
          toast('Import failed: ' + (err && err.message ? err.message : String(err)), 'danger');
          btn.disabled = false; btn.textContent = 'Import ' + records.length + ' Records';
        }
      });
    }catch(err){
      previewArea.innerHTML = '<div class="error-box">Could not read that file: ' + escapeHtml(err && err.message ? err.message : String(err)) + '</div>';
    }
  });
}

// [collectionKey, dateField, statusField, "done" values to skip, label] — mirrors backend/Code.gs DEADLINE_SOURCES
const DEADLINE_SOURCES = [
  ['leave-records', 'fromDate', 'status', ['Rejected'], 'Leave/OD'],
  ['invigilation-duties', 'date', null, [], 'Invigilation Duty'],
  ['evaluations', 'deadline', 'status', ['Completed'], 'Evaluation'],
  ['mentee-meetings', 'date', null, [], 'Mentoring Meeting'],
  ['lab-exams', 'date', null, [], 'Lab Exam'],
  ['extra-classes', 'date', null, [], 'Extra Class'],
  ['research-targets', 'targetDate', 'status', ['Completed'], 'Research Target'],
  ['project-grants', 'endDate', 'status', ['Closed','Completed'], 'Project/Grant deadline'],
  ['meetings', 'date', 'status', ['Completed'], 'Meeting'],
  ['action-items', 'dueDate', 'status', ['Done'], 'Action Item'],
  ['reminders', 'dueDate', 'status', ['Done'], 'Reminder'],
  ['office-followups', 'followUpDate', 'status', ['Resolved'], 'Office Follow-up']
];
const DOW_NAMES3 = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

function upcomingItems(days){
  const today = todayStr();
  const end = new Date(Date.now() + days*86400000).toISOString().slice(0,10);
  const items = [];
  DEADLINE_SOURCES.forEach(src=>{
    const key = src[0], dateField = src[1], statusField = src[2], doneValues = src[3], label = src[4];
    getActive(key).forEach(rec=>{
      const d = rec[dateField];
      if(!d || d < today || d > end) return;
      if(statusField && doneValues.indexOf(rec[statusField]) !== -1) return;
      const mod = MODULES[key];
      items.push({ moduleKey:key, label:label, date:d, title: rec[mod.titleField] || '(untitled)' });
    });
  });
  items.sort((a,b)=>a.date.localeCompare(b.date));
  return items;
}
function todaysClasses(){
  const dow = DOW_NAMES3[new Date().getDay()];
  return getActive('timetable').filter(t=>t.day===dow && t.status!=='Cancelled')
    .sort((a,b)=>String(a.startTime||'').localeCompare(String(b.startTime||'')));
}
function overdueItems(){
  const today = todayStr();
  const items = [];
  DEADLINE_SOURCES.forEach(src=>{
    const key = src[0], dateField = src[1], statusField = src[2], doneValues = src[3], label = src[4];
    if(!dateField) return;
    getActive(key).forEach(rec=>{
      const d = rec[dateField];
      if(!d || d >= today) return;
      if(statusField && doneValues.indexOf(rec[statusField]) !== -1) return;
      const mod = MODULES[key];
      items.push({ moduleKey:key, label:label, date:d, title: rec[mod.titleField] || '(untitled)' });
    });
  });
  items.sort((a,b)=>a.date.localeCompare(b.date));
  return items;
}
function urgencyClass(dateStr){
  const today = todayStr();
  if(dateStr < today) return 'urgency-overdue';
  if(dateStr === today) return 'urgency-today';
  const soon = new Date(Date.now() + 3*86400000).toISOString().slice(0,10);
  if(dateStr <= soon) return 'urgency-soon';
  return 'urgency-later';
}
function greeting(){
  const h = new Date().getHours();
  if(h < 12) return 'Good morning';
  if(h < 17) return 'Good afternoon';
  return 'Good evening';
}
function startOfWeekStr(){
  const d = new Date();
  const day = d.getDay(); // 0=Sun
  const diffToMon = (day === 0) ? -6 : (1 - day);
  const mon = new Date(d.getFullYear(), d.getMonth(), d.getDate() + diffToMon);
  return mon.toISOString().slice(0,10);
}
function relativeTime(iso){
  if(!iso) return '';
  const diff = Date.now() - new Date(iso).getTime();
  const min = Math.floor(diff / 60000);
  if(min < 1) return 'just now';
  if(min < 60) return min + 'm ago';
  const hr = Math.floor(min / 60);
  if(hr < 24) return hr + 'h ago';
  const day = Math.floor(hr / 24);
  if(day < 7) return day + 'd ago';
  return fmtDate(iso.slice(0,10));
}
function recentActivity(limit){
  const items = [];
  MODULE_KEYS.forEach(k=>{
    if(k === 'audit-log') return; // the log itself isn't a "user activity" to feature here
    const mod = MODULES[k];
    getActive(k).forEach(r=>{
      const at = r.updatedAt || r.createdAt;
      if(!at) return;
      items.push({ moduleKey:k, icon:mod.icon, label:mod.label, title: r[mod.titleField] || '(untitled)', at:at, isNew: r.createdAt === r.updatedAt, color: AREA_COLORS[mod.menu] || 'var(--info)' });
    });
  });
  items.sort((a,b)=>String(b.at).localeCompare(String(a.at)));
  return items.slice(0, limit || 8);
}
/** Animates a number counting up from 0 to `target` — small touch that makes
 *  the Dashboard feel alive on every visit rather than just static text.
 *  Respects prefers-reduced-motion by jumping straight to the final value. */
function animateCount(el, target, duration, suffix){
  suffix = suffix || '';
  if(!el) return;
  if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches){ el.textContent = target + suffix; return; }
  const start = performance.now();
  function tick(now){
    const p = Math.min(1, (now - start) / duration);
    const eased = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.round(target * eased) + suffix;
    if(p < 1) requestAnimationFrame(tick);
    else el.textContent = target + suffix;
  }
  requestAnimationFrame(tick);
}
function statCardHtml(icon, num, label, color, trend){
  return '<div class="stat-card"><div class="stat-icon" style="background:' + color + '22;color:' + color + ';">' + icon + '</div>'
    + '<div><div class="stat-num" data-count="' + num + '">0</div><div class="stat-label">' + escapeHtml(label) + '</div>'
    + (trend ? '<div class="stat-trend ' + trend.cls + '">' + escapeHtml(trend.text) + '</div>' : '') + '</div></div>';
}
function progressRingHtml(percent, color, label, sub){
  const p = Math.max(0, Math.min(100, Math.round(percent)));
  const deg = p * 3.6;
  const style = 'background:conic-gradient(' + color + ' ' + deg + 'deg, var(--border) ' + deg + 'deg 360deg);';
  return '<div class="ring-wrap"><div class="ring" style="' + style + '">'
    + '<div style="width:56px;height:56px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;"><span class="ring-num" data-count="' + p + '">0%</span></div></div>'
    + '<div><div class="ring-label">' + escapeHtml(label) + '</div><div class="ring-sub">' + escapeHtml(sub) + '</div></div></div>';
}

/* ============================================================
   REPORTS — export any module (or everything) to CSV.
   ============================================================ */
function toCsvValue(v){
  const s = v == null ? '' : String(v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
}
function collectionToCsv(moduleKey){
  const mod = MODULES[moduleKey];
  const cols = mod.fields.map(f=>f.key);
  const header = ['id'].concat(cols).concat(['createdAt','updatedAt','deleted']);
  const lines = [header.join(',')];
  getCollection(moduleKey).forEach(r=>{
    const row = [r.id].concat(cols.map(c=>toCsvValue(r[c]))).concat([r.createdAt||'', r.updatedAt||'', r.deleted?'1':'0']);
    lines.push(row.join(','));
  });
  return lines.join('\n');
}
function downloadText(filename, text, mime){
  const blob = new Blob([text], { type: mime || 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}

/* ---------- Word (.doc) + printable-PDF export ----------
   No document-generation library is bundled (this stays a single static
   file with no build step) — instead this uses the well-established
   "HTML tagged as a Word file" trick: Word opens an .doc file that is
   actually MS-Office-flavoured HTML perfectly happily, tables and all.
   PDF export reuses the same HTML through the browser's own print/
   "Save as PDF" dialog rather than a separate PDF-generation library. */
function fieldPlainValue(mod, field, rec){
  const v = rec[field.key];
  if(field.type === 'reference') return refLabel(field.ref, v);
  if(field.type === 'date') return v ? fmtDate(v) : '';
  return v == null ? '' : String(v);
}
function moduleReportHtml(moduleKey, sectionBreak){
  const mod = MODULES[moduleKey];
  const rows = getCollection(moduleKey);
  let html = '<div' + (sectionBreak ? ' class="section-break"' : '') + '>'
    + '<h1>' + mod.icon + ' ' + escapeHtml(mod.label) + '</h1>'
    + '<div class="meta">Generated ' + escapeHtml(fmtDateTime(nowIso())) + ' &middot; '
    + escapeHtml((STATE.meta && STATE.meta.facultyName) || '') + ' &middot; ' + escapeHtml(DEPARTMENT_NAME) + '</div>';
  if(rows.length === 0){
    html += '<p style="color:#888;">No records.</p></div>';
    return html;
  }
  html += '<table><thead><tr>' + mod.fields.map(c=>'<th>' + escapeHtml(c.label) + '</th>').join('') + '<th>Status</th></tr></thead><tbody>';
  rows.forEach(r=>{
    html += '<tr>' + mod.fields.map(c=>'<td>' + escapeHtml(fieldPlainValue(mod, c, r)) + '</td>').join('') + '<td>' + (r.deleted ? 'Deleted' : 'Active') + '</td></tr>';
  });
  html += '</tbody></table></div>';
  return html;
}
function fullReportBodyHtml(){

function reportDocStyles(){
  return 'body{font-family:Calibri,Arial,sans-serif;color:#1c2333;padding:20px;} '
    + 'h1{color:#0f1f3d;font-size:18pt;margin-bottom:2px;} '
    + '.meta{color:#666;font-size:9.5pt;margin-bottom:16px;} '
    + 'table{border-collapse:collapse;width:100%;margin-bottom:24px;} '
    + 'th,td{border:1px solid #ccc;padding:5px 8px;font-size:10pt;text-align:left;} th{background:#0f1f3d;color:#fff;} '
    + '.section-break{page-break-before:always;mso-page-break-before:always;margin-top:20px;}';
}
function wordDocumentHtml(title, bodyHtml){
  return '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">'
    + '<head><meta charset="utf-8"><title>' + escapeHtml(title) + '</title>'
    + '<!--[if gte mso 9]><xml><w:WordDocument><w:View>Print</w:View><w:Zoom>100</w:Zoom></w:WordDocument></xml><![endif]-->'
    + '<style>' + reportDocStyles() + '</style></head><body>' + bodyHtml + '</body></html>';
}
function downloadWordDoc(filename, bodyHtml, title){
  const html = wordDocumentHtml(title, bodyHtml);
  const blob = new Blob(['﻿', html], { type: 'application/msword' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
function printHtmlDocument(title, bodyHtml){
  const win = window.open('', '_blank');
  if(!win){ toast('Please allow pop-ups for this site to export a PDF', 'danger'); return; }
  win.document.write('<!doctype html><html><head><meta charset="utf-8"><title>' + escapeHtml(title) + '</title>'
    + '<style>' + reportDocStyles() + '</style></head><body>' + bodyHtml + '</body></html>');
  win.document.close();
  win.focus();
  setTimeout(()=>{ win.print(); }, 350);
}

/* ============================================================
   CALENDAR — a simple month view aggregating every module's date
   field into one place.
   ============================================================ */
let CAL_CURSOR = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
function calendarEventsForMonth(year, month){
  const events = {};
  MODULE_KEYS.forEach(k=>{
    if(k === 'audit-log') return; // internal audit trail, not a calendar-worthy event
    const mod = MODULES[k];
    if(!mod.dateField) return;
    getActive(k).forEach(r=>{
      const d = r[mod.dateField];
      if(!d) return;
      const dt = new Date(d + (d.length<=10 ? 'T00:00:00' : ''));
      if(isNaN(dt)) return;
      if(dt.getFullYear() !== year || dt.getMonth() !== month) return;
      const day = dt.getDate();
      (events[day] = events[day] || []).push({ moduleKey:k, label: mod.label, icon: mod.icon, title: r[mod.titleField] || '(untitled)' });
    });
  });
  return events;
}
function renderCalendar(){
  const year = CAL_CURSOR.getFullYear(), month = CAL_CURSOR.getMonth();
  const monthName = CAL_CURSOR.toLocaleDateString('en-US', { month:'long', year:'numeric' });
  const firstDow = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const events = calendarEventsForMonth(year, month);
  const todayKey = todayStr();

  let html = '<div class="page-head"><div><h2>🗓️ Calendar — ' + escapeHtml(monthName) + '</h2><p>Every module\'s dated items in one view</p></div>'
    + '<div style="display:flex;gap:8px;"><button class="btn btn-ghost btn-sm" id="cal-prev">‹ Prev</button><button class="btn btn-ghost btn-sm" id="cal-today">Today</button><button class="btn btn-ghost btn-sm" id="cal-next">Next ›</button></div></div>';
  html += '<div class="table-wrap"><table style="width:100%;border-collapse:collapse;table-layout:fixed;">';
  html += '<thead><tr>' + ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>'<th style="padding:8px;border-bottom:1px solid var(--border);font-size:11px;color:var(--text-dim);">'+d+'</th>').join('') + '</tr></thead><tbody><tr>';
  for(let i=0;i<firstDow;i++) html += '<td style="border:1px solid var(--border);height:90px;background:#fafbfd;"></td>';
  let col = firstDow;
  for(let day=1; day<=daysInMonth; day++){
    const dateKey = year + '-' + String(month+1).padStart(2,'0') + '-' + String(day).padStart(2,'0');
    const dayEvents = events[day] || [];
    html += '<td style="border:1px solid var(--border);height:90px;vertical-align:top;padding:4px;font-size:11px;' + (dateKey===todayKey?'background:#eef3fc;':'') + '">'
      + '<div style="font-weight:700;margin-bottom:3px;">' + day + '</div>'
      + dayEvents.slice(0,3).map(ev=>'<div style="background:#eef0f3;border-radius:4px;padding:1px 4px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" title="' + escapeHtml(ev.label+': '+ev.title) + '">' + ev.icon + ' ' + escapeHtml(ev.title) + '</div>').join('')
      + (dayEvents.length>3 ? '<div style="color:var(--text-faint);">+' + (dayEvents.length-3) + ' more</div>' : '')
      + '</td>';
    col++;
    if(col === 7){ html += '</tr><tr>'; col = 0; }
  }
  if(col !== 0){ for(let i=col;i<7;i++) html += '<td style="border:1px solid var(--border);background:#fafbfd;"></td>'; html += '</tr>'; }
  html += '</tbody></table></div>';
  setTimeout(wireCalendar, 0);
  return html;
}
function wireCalendar(){
  const prev = document.getElementById('cal-prev'), next = document.getElementById('cal-next'), today = document.getElementById('cal-today');
  if(!prev) return;
  prev.addEventListener('click', ()=>{ CAL_CURSOR = new Date(CAL_CURSOR.getFullYear(), CAL_CURSOR.getMonth()-1, 1); renderRoute(); });
  next.addEventListener('click', ()=>{ CAL_CURSOR = new Date(CAL_CURSOR.getFullYear(), CAL_CURSOR.getMonth()+1, 1); renderRoute(); });
  today.addEventListener('click', ()=>{ CAL_CURSOR = new Date(new Date().getFullYear(), new Date().getMonth(), 1); renderRoute(); });
}
