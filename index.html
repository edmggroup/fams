<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FAMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=IBM+Plex+Mono:wght@500;700&display=optional">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#0f1f3d">

<script>
/* Runs before the browser paints anything. It decides the theme and whether
   the PIN screen or the workspace is shown, so neither one ever flashes. */
(function () {
  try {
    var t = localStorage.getItem('fams.theme');
    if (t) t = t.replace(/^"|"$/g, '');          // stored as JSON, read raw here
    if (t !== 'dark' && t !== 'light') {
      t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', t);
    window.__boot = {
      theme: t,
      token: localStorage.getItem('fams.token') || '',
      endpoint: localStorage.getItem('fams.endpoint') || '',
      index: JSON.parse(localStorage.getItem('fams.index') || 'null')
    };
  } catch (e) {
    window.__boot = { theme: 'light', token: '', endpoint: '', index: null };
  }
})();
</script>

<style>
:root{
  --navy:#0f1f3d; --navy-2:#1c2c58; --gold:#c99a3c; --gold-2:#e0b558;
  --bg:#f0f3fa; --card:#ffffff; --sunk:#f7f9fd;
  --border:#e3e7f0; --border-strong:#cbd1db;
  --text:#0f1424; --text-dim:#404a68; --text-faint:#68718c;
  --ok:#1f8a52; --ok-wash:#e4f4ec;
  --warn:#b9741c; --warn-wash:#fbf0dd;
  --danger:#b3273b; --danger-wash:#fbeae9;
  --info:#2a63c9; --info-wash:#e7eef8;
  --radius:10px;
  --shadow:0 1px 3px rgba(20,30,60,.08), 0 1px 2px rgba(20,30,60,.06);
  --shadow-md:0 4px 14px rgba(20,30,60,.10);
  --shadow-lg:0 10px 30px rgba(15,25,60,.18);
  --sans:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
html[data-theme=dark]:root{
  --navy:#101a30; --navy-2:#18243f; --bg:#0e1424; --card:#161d31; --sunk:#111829;
  --border:#232c44; --border-strong:#35405c;
  --text:#e8ecf6; --text-dim:#a8b2cb; --text-faint:#7c88a5;
  --ok:#4ec08a; --ok-wash:#11301f;
  --warn:#e2a244; --warn-wash:#33250d;
  --danger:#ef7b8a; --danger-wash:#3a1419;
  --info:#6fa2f0; --info-wash:#132540;
  --shadow:0 1px 3px rgba(0,0,0,.4); --shadow-md:0 4px 14px rgba(0,0,0,.45);
  --shadow-lg:0 10px 30px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--sans);font-size:15px;line-height:1.5;color:var(--text);
  background:var(--bg);-webkit-font-smoothing:antialiased;padding-bottom:64px;
  -webkit-text-size-adjust:100%}
.wrap{max-width:1040px;margin:0 auto;padding:0 18px}
a{color:var(--info);text-decoration:none}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:.1px}
.mono{font-family:var(--mono)}
.muted{color:var(--text-faint)}
.small{font-size:12px}
.row{display:flex;align-items:center;gap:9px}
.grow{flex:1;min-width:0}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

button{font:inherit;font-weight:600;font-size:13px;color:var(--text-dim);
  background:var(--card);border:1px solid var(--border-strong);border-radius:8px;
  padding:7px 13px;cursor:pointer;transition:.13s}
button:hover{border-color:var(--text-faint);color:var(--text)}
button:active{transform:scale(.985)}
button.primary{background:var(--navy);border-color:var(--navy);color:#fff}
button.primary:hover{background:var(--navy-2);color:#fff}
button.gold{background:transparent;border-color:var(--gold);color:var(--gold)}
button.gold:hover{background:var(--gold);color:#1a1205;border-color:var(--gold)}
button.danger{color:var(--danger);border-color:var(--danger)}
button.plain{background:transparent;border-color:transparent;color:var(--text-faint);padding:6px 9px}
button.plain:hover{color:var(--text);background:var(--sunk)}

input,select,textarea{font:inherit;font-size:14px;color:var(--text);background:var(--sunk);
  border:1px solid var(--border-strong);border-radius:8px;padding:9px 11px;width:100%;
  transition:.12s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--info);
  background:var(--card);box-shadow:0 0 0 3px var(--info-wash)}
textarea{min-height:80px;resize:vertical}
label{display:block;font-size:11px;font-weight:600;letter-spacing:.04em;
  text-transform:uppercase;color:var(--text-faint);margin:0 0 5px}

/* ---------- top navigation ---------- */
.topnav{position:sticky;top:0;z-index:40;background:var(--card);
  border-bottom:1px solid var(--border);box-shadow:0 2px 10px rgba(15,25,60,.05)}
.topnav .wrap{display:flex;align-items:center;gap:10px;height:58px}
.logo{width:26px;height:26px;flex:none;border-radius:6px;background:var(--navy);
  display:flex;align-items:center;justify-content:center;color:var(--gold-2);
  font-size:11px;font-weight:700;letter-spacing:.5px}
.navtitle{font-size:14.5px;font-weight:700;letter-spacing:.2px}
.navsep{width:1px;height:22px;background:var(--border);margin:0 3px}
.syncdot{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;
  color:var(--text-faint);font-weight:600}
.syncdot i{width:6px;height:6px;border-radius:50%;background:var(--ok);display:block}

/* ---------- hero ---------- */
.hero{background:linear-gradient(100deg,var(--navy) 0%,var(--navy-2) 100%);color:#fff;
  border-radius:12px;padding:17px 21px;margin:18px 0 4px;position:relative;
  overflow:hidden;box-shadow:var(--shadow-md)}
.hero::before{content:'';position:absolute;top:-62%;right:-5%;width:240px;height:240px;
  border-radius:50%;background:radial-gradient(circle,rgba(201,154,60,.22),transparent 65%)}
.hero-row{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;
  flex-wrap:wrap;position:relative;z-index:1}
.hero h1{font-size:18px;line-height:1.3;font-weight:700}
.hero .dept{font-size:12px;color:#b8c1e0;margin-top:3px}
.hero .inst{font-size:11.5px;color:var(--gold-2);margin-top:4px;letter-spacing:.2px}
.hero-clock{text-align:right;flex:none}
.hero-clock .time{font-family:var(--mono);font-size:18px;font-weight:700}
.hero-clock .date{font-size:11px;color:#b8c1e0;margin-top:2px}
.hero-stats{display:flex;gap:26px;margin-top:15px;padding-top:13px;position:relative;z-index:1;
  flex-wrap:wrap;border-top:1px solid rgba(255,255,255,.13)}
.hero-stats div{font-size:10.5px;color:#9daad0;text-transform:uppercase;letter-spacing:.05em}
.hero-stats b{display:block;font-family:var(--mono);font-size:19px;color:#fff;font-weight:700;
  letter-spacing:-.5px;margin-bottom:1px}
.hero-stats b.alert{color:#ffb3b3}

/* ---------- section labels ---------- */
.section-label{font-size:11px;font-weight:700;text-transform:uppercase;
  letter-spacing:.07em;color:var(--text-faint);margin:24px 0 10px;
  display:flex;align-items:center;gap:11px}
.section-label .line{flex:1;height:1px;background:var(--border)}
.section-label .n{font-family:var(--mono);font-weight:700;color:var(--text-faint)}

/* ---------- upcoming ---------- */
.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:10px}
.ev{background:var(--card);border:1px solid var(--border);border-left:3px solid var(--border-strong);
  border-radius:0 var(--radius) var(--radius) 0;padding:11px 14px;cursor:pointer;
  box-shadow:var(--shadow);transition:.15s}
.ev:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.ev.late{border-left-color:var(--danger);background:var(--danger-wash)}
.ev.soon{border-left-color:var(--warn);background:var(--warn-wash)}
.ev .when{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;
  color:var(--text-faint);font-size:10px;letter-spacing:.06em}
.ev.late .when{color:var(--danger)}
.ev.soon .when{color:var(--warn)}
.ev .what{font-size:13px;font-weight:600;margin-top:3px;color:var(--text)}
.ev .who{font-size:11px;color:var(--text-faint);margin-top:2px}

/* ---------- work cards ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);cursor:pointer;overflow:hidden;display:flex;flex-direction:column;
  transition:box-shadow .15s,transform .15s,border-color .15s;position:relative}
.card::after{content:'';position:absolute;left:0;top:0;height:2px;width:100%;
  background:var(--c,var(--border-strong))}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);border-color:var(--border-strong)}
.card .cover{height:74px;width:100%;object-fit:cover;display:block;background:var(--sunk)}
.card .body{padding:13px 14px 11px;display:flex;flex-direction:column;flex:1}
.chead{display:flex;align-items:center;gap:9px;min-width:0}
.card .ico{width:26px;height:26px;border-radius:7px;flex:none;display:flex;
  align-items:center;justify-content:center;
  background:color-mix(in srgb,var(--c) 12%,transparent);color:var(--c)}
html[data-theme=dark] .card .ico{background:color-mix(in srgb,var(--c) 22%,transparent);
  color:color-mix(in srgb,var(--c) 62%,white)}
.card .ico svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.card .nm{font-size:13.5px;font-weight:700;letter-spacing:.1px;line-height:1.3;
  min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .sub{font-size:11.5px;color:var(--text-faint);margin-top:7px;line-height:1.45;flex:1;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .foot{margin-top:11px;padding-top:9px;border-top:1px solid var(--border);
  display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--text-faint);
  font-family:var(--mono);letter-spacing:-.2px}
.card .foot .sep{opacity:.45}
.badge{font-size:10px;font-weight:700;letter-spacing:.02em;padding:2px 7px;
  border-radius:4px;background:var(--sunk);color:var(--text-faint);
  font-family:var(--sans);margin-left:auto}
.badge.late{background:var(--danger-wash);color:var(--danger)}
.badge.soon{background:var(--warn-wash);color:var(--warn)}
.badge.ok{background:var(--ok-wash);color:var(--ok)}
.card .go{display:none}
.card.more{align-items:center;justify-content:center;min-height:104px;
  border-style:dashed;box-shadow:none;background:transparent;color:var(--text-dim);
  font-size:12px;font-weight:600}
.card.more::after{display:none}

/* ---------- chips ---------- */
.chips{display:flex;gap:7px;flex-wrap:wrap;margin:16px 0 2px}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;
  padding:6px 12px;border-radius:7px;background:var(--card);border:1px solid var(--border);
  color:var(--text-dim);cursor:pointer;box-shadow:var(--shadow);transition:.13s}
.chip:hover{border-color:var(--border-strong);transform:translateY(-1px)}
.chip .n{font-family:var(--mono);font-weight:700;opacity:.75}
.chip i{width:7px;height:7px;border-radius:2px;background:var(--c,var(--border-strong));display:block}

/* ---------- panels, rows, records ---------- */
.panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden;margin-top:11px}
.lrow{display:flex;align-items:center;gap:11px;padding:12px 15px;
  border-bottom:1px solid var(--border)}
.lrow:last-child{border-bottom:none}
.lrow:hover{background:var(--sunk)}
.lrow .dot{width:9px;height:9px;border-radius:3px;flex:none}
.ic{font-size:12px;font-weight:700;color:var(--text-faint);background:transparent;
  border:none;padding:5px 7px;cursor:pointer;border-radius:6px}
.ic:hover{background:var(--bg);color:var(--text)}
.ic.danger:hover{background:var(--danger-wash);color:var(--danger)}
.rec{padding:12px 15px;border-bottom:1px solid var(--border);cursor:pointer}
.rec:last-child{border-bottom:none}
.rec:hover{background:var(--sunk)}
.rec .t{font-size:14px;font-weight:700}
.rec .d{font-size:11.5px;color:var(--text-faint);margin-top:3px}

/* ---------- forms, notes ---------- */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:14px;margin-top:14px}
.form .wide{grid-column:1/-1}
.note{border-radius:8px;padding:11px 14px;margin-top:13px;font-size:13px;font-weight:600}
.note.bad{background:var(--danger-wash);color:var(--danger)}
.note.good{background:var(--ok-wash);color:var(--ok)}
.note.warn{background:var(--warn-wash);color:var(--warn)}
.fields{margin-top:11px}
.fieldrow{display:grid;grid-template-columns:1fr 1fr 118px auto;gap:9px;align-items:center;
  padding:9px 0;border-bottom:1px solid var(--border)}
.iconpick{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.iconpick button{width:36px;height:36px;padding:0;display:flex;align-items:center;
  justify-content:center;border-radius:8px}
.iconpick button svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.iconpick button.on{border-color:var(--navy);color:var(--navy);background:var(--info-wash)}

/* ---------- auth ---------- */
.authwrap{min-height:88vh;display:flex;align-items:center;justify-content:center;padding:20px}
.auth-card{width:420px;max-width:94vw;background:var(--card);border-radius:16px;
  box-shadow:var(--shadow-lg);padding:34px 30px;text-align:center;
  border-top:4px solid var(--gold)}
.auth-card .mark{width:46px;height:46px;border-radius:12px;background:var(--navy);
  color:var(--gold-2);display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:15px;margin:0 auto 16px;letter-spacing:.5px}
.auth-card h2{font-size:18px}
.auth-card p.lead{font-size:12.5px;color:var(--text-faint);margin:7px 0 20px}
.pin-input{text-align:center;font-family:var(--mono);font-size:26px;letter-spacing:.42em;
  padding:13px 10px;text-indent:.42em}

@media (max-width:640px){
  .wrap{padding:0 14px}
  .cards{grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
  .card .body{padding:12px 12px 10px}
  .hero{padding:16px 17px}
  .hero-clock{text-align:left}
  .fieldrow{grid-template-columns:1fr 1fr}
  .topnav .wrap{height:54px}
}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ==================================================================
   FAMS Lite — frontend. One file, no framework, no build step.
   Data flow: localStorage is drawn first, the network confirms after.
   ================================================================== */

var BOOT = window.__boot || {};
var APP = document.getElementById('app');

var state = {
  endpoint: BOOT.endpoint || '',
  token: BOOT.token || '',
  index: BOOT.index || null,
  records: {},          // workId -> array, hydrated from cache on demand
  editMode: false,
  expanded: {},          // category id -> showing every card in it
  syncing: false,
  syncNote: '',
  lastPaint: ''         // JSON of what is on screen, so identical data never repaints
};

/* ---------------- storage ---------------- */

function lsGet(k, fallback) {
  try { var v = localStorage.getItem(k); return v === null ? fallback : JSON.parse(v); }
  catch (e) { return fallback; }
}
function lsSet(k, v) {
  try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* full or blocked */ }
}
function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }

function cacheIndex(index) { state.index = index; lsSet('fams.index', index); }
function cacheRecords(id, recs) { state.records[id] = recs; lsSet('fams.recs.' + id, recs); }
function loadRecords(id) {
  if (state.records[id]) return state.records[id];
  var cached = lsGet('fams.recs.' + id, null);
  if (cached) state.records[id] = cached;
  return cached;
}

/* ---------------- api ---------------- */

/* text/plain on purpose: application/json would trigger a CORS preflight
   that Apps Script cannot answer. */
function api(action, payload) {
  if (!state.endpoint) return Promise.reject(new Error('No backend URL set yet.'));
  var body = Object.assign({ action: action, token: state.token }, payload || {});
  return fetch(state.endpoint, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(body),
    redirect: 'follow'
  }).then(function (r) { return r.json(); }).then(function (res) {
    if (res && res.ok === false && /session expired|not set up/i.test(res.error || '')) {
      // Either the session lapsed or the backend was reset underneath us.
      if (/not set up/i.test(res.error || '')) state.needsSetup = true;
      signOut(true);
      throw new Error(res.error);
    }
    if (res && res.ok === false) throw new Error(res.error || 'Something went wrong.');
    return res;
  });
}

/* ---------------- offline queue ---------------- */

function queue() { return lsGet('fams.queue', []); }
function enqueue(action, payload) {
  var q = queue();
  q.push({ action: action, payload: payload, at: Date.now() });
  lsSet('fams.queue', q);
}
function drainQueue() {
  var q = queue();
  if (!q.length) return Promise.resolve();
  var job = q[0];
  return api(job.action, job.payload).then(function (res) {
    q.shift(); lsSet('fams.queue', q);
    if (res.index) cacheIndex(res.index);
    return drainQueue();
  }).catch(function () { /* stay queued, try again on the next sync */ });
}

/* ---------------- sync ---------------- */

function sync(opts) {
  opts = opts || {};
  if (state.syncing || !state.token || !state.endpoint) return Promise.resolve();
  state.syncing = true;
  return drainQueue()
    .then(function () {
      return api('sync', { version: state.index ? state.index.version : 0 });
    })
    .then(function (res) {
      if (res.same) return;
      cacheIndex(res.index);
      render();                       // only reached when data actually changed
    })
    .catch(function (err) {
      if (opts.loud) toast(err.message, 'bad');
    })
    .then(function () {
      state.syncing = false;
      var el = document.getElementById('syncNote');
      if (el) el.textContent = 'synced ' + clockNow();
    });
}

/* ---------------- helpers ---------------- */

function esc(s) {
  return String(s === undefined || s === null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}
function todayISO() {
  var d = new Date();
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
}
function pad(n) { return (n < 10 ? '0' : '') + n; }
function clockNow() {
  var d = new Date();
  return pad(d.getHours()) + ':' + pad(d.getMinutes());
}
function daysFrom(iso) {
  var a = new Date(todayISO() + 'T00:00:00');
  var b = new Date(String(iso).slice(0, 10) + 'T00:00:00');
  return Math.round((b - a) / 86400000);
}
function whenLabel(iso) {
  var d = daysFrom(iso);
  if (d < -1) return 'overdue ' + Math.abs(d) + ' days';
  if (d === -1) return 'overdue 1 day';
  if (d === 0) return 'today';
  if (d === 1) return 'tomorrow';
  if (d < 7) return 'in ' + d + ' days';
  var dt = new Date(String(iso).slice(0, 10) + 'T00:00:00');
  return dt.toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
}
function cat(id) {
  var cs = (state.index && state.index.categories) || [];
  for (var i = 0; i < cs.length; i++) if (cs[i].id === id) return cs[i];
  return { id: '', name: 'Other', color: '#888780' };
}
function work(id) {
  var ws = (state.index && state.index.works) || [];
  for (var i = 0; i < ws.length; i++) if (ws[i].id === id) return ws[i];
  return null;
}
function visibleWorks() {
  return ((state.index && state.index.works) || [])
    .filter(function (w) { return !w.hidden && w.status !== 'Completed'; })
    .sort(function (a, b) { return (a.order || 0) - (b.order || 0); });
}
function liveEvents() {
  return ((state.index && state.index.events) || [])
    .filter(function (ev) { return !ev.done && daysFrom(ev.date) <= 45; })
    .sort(function (a, b) { return String(a.date).localeCompare(String(b.date)); });
}
function toast(msg, kind) {
  state.syncNote = msg;
  var el = document.getElementById('toast');
  if (el) {
    el.className = 'note ' + (kind || 'warn');
    el.textContent = msg;
    el.style.display = 'block';
  }
}

/* ---------------- routing ---------------- */

function route() {
  var h = (location.hash || '#/').replace(/^#\/?/, '');
  var p = h.split('/').filter(Boolean);
  if (!p.length) return { screen: 'home' };
  if (p[0] === 'w' && p[1]) return { screen: 'work', id: p[1] };
  return { screen: p[0] };
}
function go(hash) { location.hash = hash; }

window.addEventListener('hashchange', function () { render(); window.scrollTo(0, 0); });
document.addEventListener('visibilitychange', function () {
  if (!document.hidden) sync();
});

/* ==================================================================
   Render
   ================================================================== */

function render() {
  if (!state.endpoint) return paint(screenSetup());
  if (!state.token) return paint(screenPin());

  var r = route();
  var html;
  if (r.screen === 'work') html = screenWork(r.id);
  else if (r.screen === 'admin') html = screenAdmin();
  else if (r.screen === 'settings') html = screenSettings();
  else if (r.screen === 'bin') html = screenBin();
  else if (r.screen === 'log') html = screenLog();
  else html = screenHome();

  paint(html);
}

/* Repaints only when the markup actually differs, so a background sync that
   finds nothing new leaves the page — and the scroll position — untouched. */
function paint(html) {
  if (html === state.lastPaint) return;
  var y = window.scrollY;
  state.lastPaint = html;
  APP.innerHTML = html;
  window.scrollTo(0, y);
}

var ICON_KEYS = Object.keys(ICONS);

function iconSvg(key) {
  return '<svg viewBox="0 0 24 24" aria-hidden="true">' + (ICONS[key] || ICONS.doc) + '</svg>';
}
function workIcon(w) {
  if (w.icon && ICONS[w.icon]) return w.icon;
  var c = cat(w.categoryId).name.toLowerCase();
  if (c.indexOf('teach') === 0) return 'book';
  if (c.indexOf('research') === 0) return 'flask';
  return 'clip';
}
function profile() {
  var p = (state.index && state.index.profile) || {};

    name: p.name || 'Academic workspace',
    department: p.department || '',
    institution: p.institution || '',

}

/* The top bar. Admin sits on its own, to the right of a divider, so it never
   reads as one more work. */
function header(title, back) {
  var p = profile();
  return '<nav class="topnav"><div class="wrap">'
    + (back
        ? '<button class="plain" data-go="' + esc(back) + '" aria-label="Back">&larr;</button>'

            .join('').toUpperCase()) + '</span>')

    + '<span class="grow"></span>'
    + '<span class="syncdot" id="syncNote"><i></i>synced ' + clockNow() + '</span>'

}

function heroHtml() {
  var p = profile();
  var evs = liveEvents();
  var late = evs.filter(function (e) { return daysFrom(e.date) < 0; }).length;
  var week = evs.filter(function (e) {

  }).length;
  var month = evs.filter(function (e) {
    var d = daysFrom(e.date); return d >= 0 && d <= 30;
  }).length;

  return '<div class="hero"><div class="hero-row">'

    + '</div>'
    + '<div class="hero-clock"><div class="time" id="heroTime">' + clockNow() + '</div>'
    + '<div class="date">' + esc(now.toLocaleDateString(undefined,
        { weekday: 'long', day: 'numeric', month: 'long' })) + '</div></div>'
    + '</div><div class="hero-stats">'
    + '<div><b class="' + (late ? 'alert' : '') + '">' + late + '</b>overdue</div>'
    + '<div><b>' + week + '</b>this week</div>'

/* ---------------- home ---------------- */

function screenHome() {
  var idx = state.index;
  if (!idx) {
    return header('FAMS') + '<div class="wrap"><p class="muted" style="margin-top:2rem">'
      + 'Loading your workspace&hellip;</p></div>';
  }

  var evs = liveEvents().slice(0, 6);
  var stripHtml = evs.length
    ? '<div class="section-label">Upcoming<span class="line"></span>'
      + '<span class="n">' + liveEvents().length + '</span></div>'
      + '<div class="strip">' + evs.map(function (ev) {
        var d = daysFrom(ev.date);
        var cls = d < 0 ? 'late' : (d <= 7 ? 'soon' : '');
        return '<div class="ev ' + cls + '" data-go="#/w/' + esc(ev.workId) + '">'
          + '<div class="when">' + esc(whenLabel(ev.date)) + '</div>'
          + '<div class="what trunc">' + esc(ev.title) + '</div>'
          + '<div class="who trunc">' + esc(ev.workName) + ' &middot; ' + esc(ev.label)
          + '</div></div>';
      }).join('') + '</div>'
    : '<div class="section-label">Upcoming<span class="line"></span></div>'
      + '<p class="small muted">Nothing due in the next 45 days.</p>';

  var cats = (idx.categories || []).slice().sort(function (a, b) {
    return (a.order || 0) - (b.order || 0);
  });
  var works = visibleWorks();

  var chips = cats.map(function (c) {
    var n = works.filter(function (w) { return w.categoryId === c.id; }).length;
    if (!n) return '';
    return '<button class="chip" data-jump="sec_' + esc(c.id) + '" '
      + 'style="--c:' + esc(c.color) + '"><i></i>' + esc(c.name)
      + '<span class="n">' + n + '</span></button>';
  }).join('');

  var sections = cats.map(function (c) {
    var mine = works.filter(function (w) { return w.categoryId === c.id; });
    if (!mine.length) return '';
    var collapsed = mine.length > 8 && !state.expanded[c.id];
    var shown = collapsed ? mine.slice(0, 6) : mine;
    var cardsHtml = shown.map(function (w) { return cardHtml(w, c); }).join('');
    if (collapsed) {
      cardsHtml += '<div class="card more" data-act="expand" data-cat="' + esc(c.id) + '">'
        + '+ ' + (mine.length - 6) + ' more</div>';
    }
    return '<div class="section-label" id="sec_' + esc(c.id) + '">' + esc(c.name)
      + '<span class="line"></span><span class="n">' + mine.length + '</span></div>'
      + '<div class="cards">' + cardsHtml + '</div>';
  }).join('');

  return header('FAMS')
    + '<div class="wrap">'
    + heroHtml()
    + '<div class="note" id="toast" style="display:none"></div>'
    + stripHtml
    + '<div class="chips">' + chips + '</div>'
    + sections
    + '</div>';
}

function cardHtml(w, c) {
  var evs = ((state.index.events) || []).filter(function (ev) {
    return ev.workId === w.id && !ev.done;
  });
  var late = evs.filter(function (ev) { return daysFrom(ev.date) < 0; }).length;
  var soon = evs.filter(function (ev) {
    var d = daysFrom(ev.date); return d >= 0 && d <= 7;
  }).length;
  var badge = '';
  if (late) badge = '<span class="badge late">' + late + ' overdue</span>';
  else if (soon) badge = '<span class="badge soon">' + soon + ' this week</span>';
  else if (w.status === 'On hold') badge = '<span class="badge">on hold</span>';

  // The footer carries facts, not decoration: how much is in here, and when
  // the next thing falls due. The count rides in the index, so no records load.
  var n = (w.count === undefined) ? (loadRecords(w.id) || []).length : w.count;
  var facts = [n + (n === 1 ? ' entry' : ' entries')];
  var next = evs.slice().sort(function (a, b) {
    return String(a.date).localeCompare(String(b.date));
  })[0];
  if (next) facts.push('next ' + whenLabel(next.date));

  return '<article class="card" style="--c:' + esc(c.color) + '" '
    + 'data-go="#/w/' + esc(w.id) + '">'
    + (w.image
        ? '<img class="cover" src="' + esc(w.image) + '" alt="" loading="lazy" '
          + 'onerror="this.remove()">'
        : '')
    + '<div class="body">'
    + '<div class="chead"><span class="ico">' + iconSvg(workIcon(w)) + '</span>'
    + '<div class="nm">' + esc(w.name) + '</div></div>'
    + '<div class="sub">' + esc(w.summary || '') + '</div>'
    + '<div class="foot">'
    + facts.map(esc).join('<span class="sep">&middot;</span>')
    + badge + '</div>'
    + '</div></article>';
}

/* ---------------- one work ---------------- */

function screenWork(id) {
  var w = work(id);
  if (!w) return header('Not found', '#/') + '<div class="wrap"><p class="muted">'
    + 'That work is not in your list any more.</p></div>';

  var recs = loadRecords(id);
  if (recs === null) {
    api('getWork', { id: id }).then(function (res) {
      cacheRecords(id, res.records || []);
      state.lastPaint = '';   // force one repaint now that records arrived
      render();
    }).catch(function (err) { toast(err.message, 'bad'); });
    recs = [];
  }

  var groups = {};
  var gkey = w.groupBy;
  recs.forEach(function (r) {
    var k = gkey ? (r[gkey] || 'Ungrouped') : '';
    (groups[k] = groups[k] || []).push(r);
  });

  var body = '';
  Object.keys(groups).sort().forEach(function (k) {
    if (k) body += '<div class="section-label">' + esc(k) + '</div>';
    body += '<div class="panel">' + groups[k].map(function (r) {
      return recRow(w, r);
    }).join('') + '</div>';
  });
  if (!recs.length) {
    body = '<div class="panel"><div class="rec"><div class="t muted">'
      + 'Nothing recorded here yet.</div></div></div>';
  }

  return header(w.name, '#/')
    + '<div class="wrap">'
    + '<div class="note" id="toast" style="display:none"></div>'
    + '<p class="small muted" style="margin-top:12px">' + esc(w.summary || '')
    + (w.academicYear ? ' &middot; ' + esc(w.academicYear) : '') + '</p>'
    + '<div class="row" style="margin-top:10px">'
    + '<button class="primary" data-act="newRec" data-work="' + esc(id) + '">Add</button>'
    + '<button data-act="editWork" data-work="' + esc(id) + '">Edit this work</button>'
    + '</div>'
    + body
    + '<div id="drawer"></div>'
    + '</div>';
}

function recRow(w, r) {
  var title = r[w.titleField] || r.title || '(untitled)';
  var bits = [];
  (w.fields || []).forEach(function (f) {
    if (f.key === w.titleField) return;
    var v = r[f.key];
    if (v === undefined || v === '' || v === null) return;
    if (f.type === 'longtext' || f.type === 'people') return;
    bits.push(f.label + ': ' + (f.type === 'date' ? whenLabel(v) : v));
  });
  return '<div class="rec" data-act="editRec" data-work="' + esc(w.id) + '" data-rec="' + esc(r.id) + '">'
    + '<div class="t trunc">' + esc(title) + '</div>'
    + '<div class="d trunc">' + esc(bits.slice(0, 4).join(' &middot; ')) + '</div>'
    + '</div>';
}

/* ---------------- record form ---------------- */

function recordForm(w, rec) {
  rec = rec || {};
  var inputs = (w.fields || []).map(function (f) {
    var v = rec[f.key] === undefined ? '' : rec[f.key];
    var wide = (f.type === 'longtext' || f.type === 'people') ? ' wide' : '';
    var ctrl;
    if (f.type === 'longtext') {
      ctrl = '<textarea data-f="' + esc(f.key) + '">' + esc(v) + '</textarea>';
    } else if (f.type === 'people') {
      ctrl = '<textarea data-f="' + esc(f.key) + '" placeholder="One per line: name, register no">'
        + esc(v) + '</textarea>';
    } else if (f.type === 'select') {
      ctrl = '<select data-f="' + esc(f.key) + '"><option value=""></option>'
        + (f.options || []).map(function (o) {
            return '<option' + (o === v ? ' selected' : '') + '>' + esc(o) + '</option>';
          }).join('') + '</select>';
    } else {
      var t = f.type === 'date' ? 'date'
            : f.type === 'datetime' ? 'datetime-local'
            : (f.type === 'number' || f.type === 'amount') ? 'number'
            : f.type === 'email' ? 'email'
            : f.type === 'link' ? 'url' : 'text';
      ctrl = '<input type="' + t + '" data-f="' + esc(f.key) + '" value="' + esc(v) + '">';
    }
    return '<div class="' + wide.trim() + '"><label>' + esc(f.label)
      + (f.required ? ' *' : '') + '</label>' + ctrl + '</div>';
  }).join('');

  return '<div class="panel" style="padding:12px 13px">'
    + '<div class="row"><b style="font-weight:500">'
    + (rec.id ? 'Edit record' : 'New record') + '</b>'
    + '<span class="grow"></span>'
    + (rec.id ? '<button class="ic danger" data-act="delRec" data-work="' + esc(w.id)
        + '" data-rec="' + esc(rec.id) + '">delete</button>' : '')
    + '</div>'
    + '<div class="form" id="recForm" data-work="' + esc(w.id) + '" data-rec="' + esc(rec.id || '') + '">'
    + inputs + '</div>'
    + '<div class="note bad" id="recErr" style="display:none"></div>'
    + '<div class="row" style="margin-top:12px">'
    + '<button class="primary" data-act="saveRec">Save</button>'
    + '<button data-act="closeDrawer">Cancel</button></div>'
    + '</div>';
}

function deleteBox(w) {
  var n = (w.count === undefined) ? (loadRecords(w.id) || []).length : w.count;
  var evs = (state.index.events || []).filter(function (e) { return e.workId === w.id; }).length;
  return '<div class="panel" style="padding:12px 13px">'
    + '<div class="note bad" style="margin-top:0">'
    + 'Delete &ldquo;' + esc(w.name) + '&rdquo;? ' + n + ' record(s) and ' + evs
    + ' date(s) go with it. It stays recoverable in the bin for 30 days.</div>'
    + '<div style="margin-top:10px"><label>Type the work&rsquo;s name to confirm</label>'
    + '<input id="delConfirm" placeholder="' + esc(w.name) + '"></div>'
    + '<div class="row" style="margin-top:12px">'
    + '<button data-act="archiveWork" data-work="' + esc(w.id) + '">Archive instead</button>'
    + '<button class="danger" data-act="confirmDelete" data-work="' + esc(w.id) + '">Delete</button>'
    + '<button data-act="closeDrawer">Cancel</button></div>'
    + '</div>';
}

/* ==================================================================
   Events — one delegated listener, so nothing ever loses its handler
   ================================================================== */

document.addEventListener('click', function (e) {
  var go_ = e.target.closest('[data-go]');
  var act = e.target.closest('[data-act]');
  var jump = e.target.closest('[data-jump]');

  if (jump) {
    var el = document.getElementById(jump.getAttribute('data-jump'));
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    return;
  }
  if (act) { handle(act.getAttribute('data-act'), act, e); return; }
  if (go_) { go(go_.getAttribute('data-go')); return; }
});

document.addEventListener('change', function (e) {
  var sel = e.target.closest('.fieldrow [data-ff="type"]');
  if (sel) {
    var row = sel.closest('.fieldrow');
    var opts = row.querySelector('[data-ff="options"]');
    if (opts) opts.style.display = sel.value === 'select' ? '' : 'none';
  }
});

/* An inline error clears the moment the field it complained about is edited. */
document.addEventListener('input', function (e) {
  if (!e.target.closest('#recForm')) return;
  var err = document.getElementById('recErr');
  if (err) err.style.display = 'none';
});

document.addEventListener('keydown', function (e) {
  if (e.key !== 'Enter') return;
  if (e.target.id === 'pinInput') {
    handle(state.needsSetup ? 'doSetupPin' : 'doUnlock');
  } else if (e.target.id === 'epInput') {
    handle('saveEndpoint');
  }
});

function drawer(html) {
  var d = document.getElementById('drawer');
  if (!d) return;
  d.innerHTML = html;
  d.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
function closeDrawer() {
  var d = document.getElementById('drawer');
  if (d) d.innerHTML = '';
}

function handle(action, el, ev) {
  switch (action) {

    case 'toggleEdit':
      state.editMode = !state.editMode;
      state.lastPaint = '';
      render();
      break;

    case 'menu':
      go('#/settings');
      break;

    case 'expand':
      state.expanded[el.getAttribute('data-cat')] = true;
      state.lastPaint = '';
      render();
      break;

    case 'theme': {
      var t = el.getAttribute('data-theme');
      if (t === 'auto') {
        lsDel('fams.theme');
        t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      } else {
        lsSet('fams.theme', t);
      }
      document.documentElement.setAttribute('data-theme', t);
      break;
    }

    case 'saveEndpoint': {
      var url = (document.getElementById('epInput') || {}).value || '';
      url = url.trim();
      if (!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(url)) {
        toast('That does not look like a web app URL. It should end in /exec.', 'bad');
        return;
      }
      state.endpoint = url;
      lsSet('fams.endpoint', url);
      api('status').then(function (res) {
        state.needsSetup = !res.ready;
        state.lastPaint = '';
        render();
      }).catch(function (err) { toast(err.message, 'bad'); });
      break;
    }

    case 'doSetupPin':
    case 'doUnlock': {
      var pin = (document.getElementById('pinInput') || {}).value || '';
      if (!/^\d{4}$/.test(pin)) { toast('Four digits, please.', 'bad'); return; }
      var call = action === 'doSetupPin'
        ? api('firstRun', { pin: pin }).then(function () { return api('unlock', { pin: pin }); })
        : api('unlock', { pin: pin });
      call.then(function (res) {
        state.token = res.token;
        state.needsSetup = false;
        lsSet('fams.token', res.token);
        cacheIndex(res.index);
        state.lastPaint = '';
        go('#/');
        render();
      }).catch(function (err) { toast(err.message, 'bad'); });
      break;
    }

    case 'saveProfile': {
      var pf = document.getElementById('profileForm');
      var p = {};
      pf.querySelectorAll('[data-p]').forEach(function (i) {
        p[i.getAttribute('data-p')] = i.value.trim();
      });
      api('saveProfile', { profile: p }).then(function (res) {
        cacheIndex(res.index);
        state.lastPaint = '';
        render();
        toast('Saved.', 'good');
      }).catch(function (err) { toast(err.message, 'bad'); });
      break;
    }

    case 'signOut': signOut(); break;

    /* The way back when the backend has moved or been rebuilt. Clears the
       saved URL and session on this device only; nothing in the Sheet moves. */
    case 'changeEndpoint':
      state.endpoint = '';
      state.token = '';
      state.index = null;
      state.records = {};
      state.needsSetup = false;
      lsDel('fams.endpoint');
      lsDel('fams.token');
      lsDel('fams.index');
      Object.keys(localStorage).forEach(function (k) {
        if (k.indexOf('fams.recs.') === 0) lsDel(k);
      });
      state.lastPaint = '';
      render();
      break;

    case 'changePin': {
      var oldp = (document.getElementById('pinOld') || {}).value || '';
      var newp = (document.getElementById('pinNew') || {}).value || '';
      api('changePin', { currentPin: oldp, newPin: newp }).then(function () {
        toast('PIN changed. Every device will ask for the new one.', 'good');
      }).catch(function (err) { toast(err.message, 'bad'); });
      break;
    }

    /* ---- records ---- */

    case 'newRec': drawer(recordForm(work(el.getAttribute('data-work')), null)); break;

    case 'editRec': {
      var wId = el.getAttribute('data-work');
      var rId = el.getAttribute('data-rec');
      var rec = (loadRecords(wId) || []).filter(function (r) { return r.id === rId; })[0];
      drawer(recordForm(work(wId), rec));
      break;
    }

    case 'saveRec': {
      var form = document.getElementById('recForm');
      var wid = form.getAttribute('data-work');
      var rid = form.getAttribute('data-rec');
      var w = work(wid);
      var rec = { id: rid || undefined };
      form.querySelectorAll('[data-f]').forEach(function (i) {
        rec[i.getAttribute('data-f')] = i.value;
      });
      var errEl = document.getElementById('recErr');
      var missing = (w.fields || []).filter(function (f) {
        return f.required && !String(rec[f.key] || '').trim();
      });
      if (missing.length) {
        errEl.textContent = 'Fill in ' + missing.map(function (f) { return f.label; }).join(', ') + '.';
        errEl.style.display = 'block';
        return;
      }
      var anyValue = Object.keys(rec).some(function (k) {
        return k !== 'id' && String(rec[k] || '').trim();
      });
      if (!anyValue) {
        errEl.textContent = 'Fill in at least one field first.';
        errEl.style.display = 'block';
        return;
      }
      saveRecordOptimistic(wid, rec);
      closeDrawer();
      break;
    }

    case 'delRec': {
      var dw = el.getAttribute('data-work');
      var dr = el.getAttribute('data-rec');
      var recs = (loadRecords(dw) || []).filter(function (r) { return r.id !== dr; });
      cacheRecords(dw, recs);
      closeDrawer();
      state.lastPaint = '';
      render();
      api('deleteRecord', { workId: dw, recordId: dr })
        .then(function (res) { cacheIndex(res.index); state.lastPaint = ''; render(); })
        .catch(function () { enqueue('deleteRecord', { workId: dw, recordId: dr }); });
      break;
    }

    /* ---- works ---- */

    case 'newWork': drawer(workForm(null, el.getAttribute('data-cat'))); break;
    case 'editWork': drawer(workForm(work(el.getAttribute('data-work')), null)); break;

    case 'addField': {
      var list = document.getElementById('fieldList');
      var i = list.querySelectorAll('.fieldrow').length;
      var div = document.createElement('div');
      div.className = 'fieldrow';
      div.setAttribute('data-fi', i);
      div.innerHTML = '<input data-ff="label" placeholder="Label">'
        + '<select data-ff="type">' + ['text', 'longtext', 'number', 'amount', 'date',
            'datetime', 'select', 'email', 'link', 'people'].map(function (t) {
              return '<option>' + t + '</option>';
            }).join('') + '</select>'
        + '<label class="row small" style="margin:0;gap:5px">'
        + '<input type="checkbox" data-ff="timeline" style="width:auto">timeline</label>'
        + '<button class="ic danger" data-act="rmField">&times;</button>'
        + '<input data-ff="options" placeholder="Dropdown options, comma separated" '
        + 'style="grid-column:1/-1;display:none">';
      list.appendChild(div);
      break;
    }

    case 'rmField': el.closest('.fieldrow').remove(); break;

    case 'pickIcon':
      document.querySelectorAll('#iconPick button').forEach(function (b) {
        b.classList.remove('on');
      });
      el.classList.add('on');
      document.getElementById('iconVal').value = el.getAttribute('data-icon');
      break;

    case 'saveWork': {
      var wf = document.getElementById('workForm');
      var id = wf.getAttribute('data-id');
      var existing = id ? work(id) : null;
      var out = existing ? JSON.parse(JSON.stringify(existing)) : {};
      wf.querySelectorAll('[data-w]').forEach(function (i) {
        out[i.getAttribute('data-w')] = i.value;
      });
      out.id = id || undefined;
      out.fields = [];
      document.querySelectorAll('#fieldList .fieldrow').forEach(function (row) {
        var label = row.querySelector('[data-ff="label"]').value.trim();
        if (!label) return;
        var type = row.querySelector('[data-ff="type"]').value;
        var f = {
          key: label.toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '') || 'f',
          label: label,
          type: type,
          timeline: row.querySelector('[data-ff="timeline"]').checked
        };
        if (type === 'select') {
          f.options = row.querySelector('[data-ff="options"]').value
            .split(',').map(function (s) { return s.trim(); })
            .filter(function (s) { return s; });
        }
        out.fields.push(f);
      });
      if (!out.name || !out.name.trim()) {
        var we = document.getElementById('workErr');
        we.textContent = 'The work needs a name.';
        we.style.display = 'block';
        return;
      }
      if (!out.fields.length) out.fields = [{ key: 'title', label: 'Title', type: 'text', required: true }];
      if (!out.titleField || !out.fields.some(function (f) { return f.key === out.titleField; })) {
        out.titleField = out.fields[0].key;
      }
      closeDrawer();
      api('saveWork', { work: out }).then(function (res) {
        cacheIndex(res.index);
        state.lastPaint = '';
        render();
        toast('Saved.', 'good');
      }).catch(function (err) { toast(err.message, 'bad'); });
      break;
    }

    case 'hide': {
      var hw = JSON.parse(JSON.stringify(work(el.getAttribute('data-work'))));
      hw.hidden = !hw.hidden;
      api('saveWork', { work: hw }).then(function (res) {
        cacheIndex(res.index); state.lastPaint = ''; render();
      }).catch(function (err) { toast(err.message, 'bad'); });
      break;
    }

    case 'up':
    case 'down': {
      var id2 = el.getAttribute('data-work');
      var w2 = work(id2);
      var sibs = state.index.works
        .filter(function (x) { return x.categoryId === w2.categoryId && x.status !== 'Completed'; })
        .sort(function (a, b) { return (a.order || 0) - (b.order || 0); });
      var at = sibs.map(function (x) { return x.id; }).indexOf(id2);
      var to = action === 'up' ? at - 1 : at + 1;
      if (to < 0 || to >= sibs.length) return;
      sibs.splice(to, 0, sibs.splice(at, 1)[0]);
      // Rebuild the global order with this category's new sequence in place.
      var others = state.index.works.filter(function (x) {
        return !(x.categoryId === w2.categoryId && x.status !== 'Completed');
      });
      var ids = others.concat(sibs)
        .sort(function (a, b) { return (a.order || 0) - (b.order || 0); })
        .map(function (x) { return x.id; });
      var seq = [];
      state.index.categories.forEach(function (c) {
        (c.id === w2.categoryId ? sibs : state.index.works.filter(function (x) {
          return x.categoryId === c.id;
        }).sort(function (a, b) { return (a.order || 0) - (b.order || 0); }))
          .forEach(function (x) { if (seq.indexOf(x.id) === -1) seq.push(x.id); });
      });
      ids.forEach(function (i) { if (seq.indexOf(i) === -1) seq.push(i); });
      seq.forEach(function (i, n) { var ww = work(i); if (ww) ww.order = n; });
      cacheIndex(state.index);
      state.lastPaint = '';
      render();
      api('reorderWorks', { ids: seq })
        .then(function (res) { cacheIndex(res.index); })
        .catch(function () { enqueue('reorderWorks', { ids: seq }); });
      break;
    }

    case 'askDelete': drawer(deleteBox(work(el.getAttribute('data-work')))); break;

    case 'archiveWork': {
      var aid = el.getAttribute('data-work');
      closeDrawer();
      api('deleteWork', { id: aid, mode: 'archive' }).then(function (res) {
        cacheIndex(res.index); state.lastPaint = ''; render();
        toast('Archived. Its records are untouched.', 'good');
      }).catch(function (err) { toast(err.message, 'bad'); });
      break;
    }

    case 'unarchive': {
      var uw = JSON.parse(JSON.stringify(work(el.getAttribute('data-work'))));
      uw.status = 'Active';
      api('saveWork', { work: uw }).then(function (res) {
        cacheIndex(res.index); state.lastPaint = ''; render();
      }).catch(function (err) { toast(err.message, 'bad'); });
      break;
    }

    case 'confirmDelete': {
      var did = el.getAttribute('data-work');
      var typed = (document.getElementById('delConfirm') || {}).value || '';
      api('deleteWork', { id: did, mode: 'delete', confirmName: typed }).then(function (res) {
        lsDel('fams.recs.' + did);
        delete state.records[did];
        cacheIndex(res.index);
        closeDrawer();
        state.lastPaint = '';
        render();
        toast('Deleted. It is in the recycle bin for 30 days.', 'warn');
      }).catch(function (err) { toast(err.message, 'bad'); });
      break;
    }

    /* ---- categories ---- */

    case 'newCat':
    case 'editCat': {
      var c = action === 'editCat' ? cat(el.getAttribute('data-cat')) : { name: '', color: '#888780' };
      drawer('<div class="panel" style="padding:12px 13px">'
        + '<div class="form" id="catForm" data-id="' + esc(c.id || '') + '">'
        + '<div><label>Name</label><input data-c="name" value="' + esc(c.name) + '"></div>'
        + '<div><label>Colour</label><input type="color" data-c="color" value="'
        + esc(c.color) + '"></div></div>'
        + '<div class="row" style="margin-top:12px">'
        + '<button class="primary" data-act="saveCat">Save</button>'
        + '<button data-act="closeDrawer">Cancel</button></div></div>');
      break;
    }

    case 'saveCat': {
      var cf = document.getElementById('catForm');
      var c2 = { id: cf.getAttribute('data-id') || undefined };
      cf.querySelectorAll('[data-c]').forEach(function (i) {
        c2[i.getAttribute('data-c')] = i.value;
      });
      closeDrawer();
      api('saveCategory', { category: c2 }).then(function (res) {
        cacheIndex(res.index); state.lastPaint = ''; render();
      }).catch(function (err) { toast(err.message, 'bad'); });
      break;
    }

    case 'delCat':
      api('deleteCategory', { id: el.getAttribute('data-cat') }).then(function (res) {
        cacheIndex(res.index); state.lastPaint = ''; render();
      }).catch(function (err) { toast(err.message, 'bad'); });
      break;

    /* ---- bin ---- */

    case 'restore':
      api('restore', { binId: el.getAttribute('data-bin') }).then(function (res) {
        cacheIndex(res.index);
        go('#/admin');
        state.lastPaint = '';
        render();
      }).catch(function (err) { toast(err.message, 'bad'); });
      break;

    case 'purge':
      api('purgeBin').then(function () { state.lastPaint = ''; render(); })
        .catch(function (err) { toast(err.message, 'bad'); });
      break;

    case 'closeDrawer': closeDrawer(); break;
  }
}

/* Writes show on screen at once and settle with the server afterwards. */
function saveRecordOptimistic(workId, rec) {
  var recs = (loadRecords(workId) || []).slice();
  if (rec.id) {
    for (var i = 0; i < recs.length; i++) if (recs[i].id === rec.id) { recs[i] = rec; break; }
  } else {
    rec.id = 'tmp_' + Date.now();
    recs.push(rec);
  }
  cacheRecords(workId, recs);
  state.lastPaint = '';
  render();

  var toSend = JSON.parse(JSON.stringify(rec));
  if (String(toSend.id).indexOf('tmp_') === 0) delete toSend.id;
  api('saveRecord', { workId: workId, record: toSend }).then(function (res) {
    var list = (loadRecords(workId) || []).map(function (r) {
      return r.id === rec.id ? res.record : r;
    });
    cacheRecords(workId, list);
    cacheIndex(res.index);
    state.lastPaint = '';
    render();
  }).catch(function () {
    enqueue('saveRecord', { workId: workId, record: toSend });
    toast('Saved on this device. It will reach the sheet when you are back online.', 'warn');
  });
}

function signOut(silent) {
  state.token = '';
  state.index = null;
  state.records = {};
  lsDel('fams.token');
  lsDel('fams.index');
  Object.keys(localStorage).forEach(function (k) {
    if (k.indexOf('fams.recs.') === 0) lsDel(k);
  });
  state.lastPaint = '';
  go('#/');
  render();
  if (!silent) toast('Locked.', 'good');
}

/* ==================================================================
   Boot
   ================================================================== */

/* Opening the site with ?reset on the end wipes this device's saved URL,
   session and cached copy, then starts from the connect screen. Nothing in
   your Sheet is touched. Useful when the backend has been rebuilt. */
if (/[?&]reset\b/.test(location.search)) {
  try {
    Object.keys(localStorage).forEach(function (k) {
      if (k.indexOf('fams.') === 0 && k !== 'fams.theme') localStorage.removeItem(k);
    });
  } catch (e) {}
  state.endpoint = '';
  state.token = '';
  state.index = null;
  history.replaceState(null, '', location.pathname);
}

render();                                   // from cache, before any network call

if (state.endpoint && !state.token) {
  api('status').then(function (res) {
    state.needsSetup = !res.ready;
    state.lastPaint = '';
    render();
  }).catch(function () { /* the PIN screen already shows; nothing to say yet */ });
}

sync();                                      // quiet confirmation in the background

/* The clock is the one thing allowed to change on its own. It writes into a
   single text node, so it never triggers a repaint of anything around it. */
setInterval(function () {
  var t = document.getElementById('heroTime');
  if (t) t.textContent = clockNow();
}, 20000);

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(function () {});
}
</script>
</body>
</html>
