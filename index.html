    return { menu:menu, count:counts[menu], color: AREA_COLORS[menu] || '#8a92a6', label: group ? group.label : menu };
  }).sort((a,b)=>b.count-a.count);
}
/** Classes per weekday (Mon–Sat) from the recurring Timetable — the data
 *  behind the Dashboard's "This Week's Teaching Load" mini chart. */
function weekdayClassCounts(){
  const days = ['Mon','Tue','Wed','Thu','Fri','Sat'];
  return { days: days, counts: days.map(d=>getActive('timetable').filter(t=>t.day===d && t.status!=='Cancelled').length) };
}
/** Sources of actual logged hours besides the Work Diary — anywhere else in
 *  the app that has (or can derive) a real duration for something you did.
 *  Every one of them (Class Log rows marked "Held", Meetings, Invigilation
 *  Duty, Extra/Additional Classes, Lab Exams, Research Events) is
 *  auto-logged into the Work Diary as it's saved — see
 *  AUTO_WORK_DIARY_SOURCES/syncAutoWorkDiaryEntry — so the Work Diary
 *  itself is already the single combined source of real hours; nothing
 *  else needs to be re-scanned here (and doing so would double-count it). */
/** Total hours spent, aggregated for the current month (falling back to
 *  all-time totals — flagged via `fallback` — before this month has
 *  anything logged), bucketed by Work Diary Category. */
function timeSpentBreakdown(){
  const monthPrefix = todayStr().slice(0,7);
  const inMonth = (d)=>String(d||'').startsWith(monthPrefix);
  const wd = getActive('work-diary');
  const fallback = !wd.some(w=>inMonth(w.date));
  const byCat = {};
  const add = (cat, hrs)=>{ if(!hrs) return; byCat[cat] = (byCat[cat] || 0) + hrs; };
  wd.forEach(w=>{
    if(!fallback && !inMonth(w.date)) return;
    add(w.category || '(Uncategorized)', parseFloat(w.hoursSpent) || 0);
  });
  return { byCat: byCat, fallback: fallback };
}
/** Same combined source as timeSpentBreakdown(), but summed to a single
 *  number over an explicit [start,end] date range (inclusive, 'YYYY-MM-DD')
 *  with no fallback — used for "Hours Logged This Week" on the Dashboard. */
function totalHoursInRange(start, end){
  const inRange = (d)=>d && d >= start && d <= end;
  let total = 0;
  getActive('work-diary').forEach(w=>{ if(inRange(w.date)) total += parseFloat(w.hoursSpent) || 0; });
  return total;
}
function relativeTime(iso){
  if(!iso) return '';
  const diff = Date.now() - new Date(iso).getTime();
  const min = Math.floor(diff / 60000);
  if(min < 1) return 'just now';
  if(min < 60) return min + 'm ago';
  const hr = Math.floor(min / 60);
  if(hr < 24) return hr + 'h ago';
  const day = Math.floor(hr / 24);
  if(day < 7) return day + 'd ago';
  return fmtDate(iso.slice(0,10));
}
function recentActivity(limit){
  const items = [];
  MODULE_KEYS.forEach(k=>{
    if(k === 'audit-log') return; // the log itself isn't a "user activity" to feature here
    const mod = MODULES[k];
    getActive(k).forEach(r=>{
      const at = r.updatedAt || r.createdAt;
      if(!at) return;
      items.push({ moduleKey:k, icon:mod.icon, label:mod.label, title: r[mod.titleField] || '(untitled)', at:at, isNew: r.createdAt === r.updatedAt, color: AREA_COLORS[mod.menu] || 'var(--info)' });
    });
  });
  items.sort((a,b)=>String(b.at).localeCompare(String(a.at)));
  return items.slice(0, limit || 8);
}
/** Animates a number counting up from 0 to `target` — small touch that makes
 *  the Dashboard feel alive on every visit rather than just static text.
 *  Respects prefers-reduced-motion by jumping straight to the final value. */
function animateCount(el, target, duration, suffix){
  suffix = suffix || '';
  if(!el) return;
  if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches){ el.textContent = target + suffix; return; }
  const start = performance.now();
  function tick(now){
    const p = Math.min(1, (now - start) / duration);
    const eased = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.round(target * eased) + suffix;
    if(p < 1) requestAnimationFrame(tick);
    else el.textContent = target + suffix;
  }
  requestAnimationFrame(tick);
}
function statCardHtml(icon, num, label, color, trend, compact, href){
  const tag = href ? 'a' : 'div';
  return '<' + tag + (href ? ' href="' + href + '"' : '') + ' class="stat-card' + (compact ? ' compact' : '') + '"><div class="stat-icon" style="background:' + color + '22;color:' + color + ';">' + icon + '</div>'
    + '<div><div class="stat-num" data-count="' + num + '">0</div><div class="stat-label">' + escapeHtml(label) + '</div>'
    + (trend ? '<div class="stat-trend ' + trend.cls + '">' + escapeHtml(trend.text) + '</div>' : '') + '</div></' + tag + '>';
}
function progressRingHtml(percent, color, label, sub, href){
  const p = Math.max(0, Math.min(100, Math.round(percent)));
  const deg = p * 3.6;
  const style = 'background:conic-gradient(' + color + ' ' + deg + 'deg, var(--border) ' + deg + 'deg 360deg);';
  const tag = href ? 'a' : 'div';
  return '<' + tag + (href ? ' href="' + href + '"' : '') + ' class="ring-wrap"><div class="ring" style="' + style + '">'
    + '<div style="width:56px;height:56px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;"><span class="ring-num" data-count="' + p + '">0%</span></div></div>'
    + '<div><div class="ring-label">' + escapeHtml(label) + '</div><div class="ring-sub">' + escapeHtml(sub) + '</div></div></' + tag + '>';
}
/** A Dashboard box listing a module's currently-open records — same visual
 *  style as "Today's Schedule" / "Upcoming (next 30 days)" (a title + due
 *  date row, colored by how soon/overdue it is) rather than just the bare
 *  count already shown in the stat cards above. Every row links to the
 *  module itself (consistent with every other Dashboard list), not a
 *  specific record — there's no per-record deep link anywhere on the
 *  Dashboard today. */
function dashboardOpenListCardHtml(moduleKey, icon, title, items, dateKey, titleKey, emptyText){
  const rows = items.slice(0, 10).map(it=>{
    const dateStr = it[dateKey];
    const cls = dateStr ? urgencyClass(dateStr) : '';
    const dateLabel = dateStr ? '<span class="mono" style="color:var(--text-dim);white-space:nowrap;">' + escapeHtml(fmtDate(dateStr)) + '</span>' : '';
    return '<a href="#/module/' + moduleKey + '" class="' + cls + ' dash-link" style="padding:8px 0 8px 10px;border-bottom:1px solid var(--border);font-size:13px;display:flex;justify-content:space-between;gap:8px;"><span>' + escapeHtml(it[titleKey] || '(untitled)') + '</span>' + dateLabel + '</a>';
  }).join('');
  return '<div class="card"><h3>' + icon + ' ' + escapeHtml(title) + ' <span class="badge badge-neutral" style="margin-left:6px;font-weight:600;">' + items.length + '</span></h3>'
    + (items.length ? rows : '<div class="empty">' + escapeHtml(emptyText) + '</div>') + '</div>';
}

/** A small auto-scrolling "New Updates" ticker for the right side of the
 *  Dashboard — up to 10 items from the separate New Updates menu (just an
 *  external news Title + Link, manually added via the Dashboard's "📰 Add
 *  New Update" quick-add button or the "Manage →" link here), NOT the app's
 *  own activity feed — a deliberately different, simpler thing. Sorted
 *  newest first by each entry's own Date. A title with a real http(s) link
 *  opens it in a new tab; anything else (blank, or not a real URL) shows as
 *  plain non-clickable text rather than risk an unsafe href. The list is
 *  rendered twice back-to-back and looped with a plain CSS keyframe
 *  animation (translateY 0 → -50%) so it scrolls continuously bottom-to-top
 *  with no JS timer; hovering pauses it so a title can actually be clicked. */
function dashboardTickerHtml(){
  const items = getActive('new-updates').slice()
    .sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')))
    .slice(0, 10);
  const manageLink = '<a href="#/module/new-updates" class="dash-link" style="font-size:11px;font-weight:600;color:var(--gold,#c99a3c);margin-left:auto;white-space:nowrap;">Manage →</a>';
  if(items.length === 0){
    return '<div class="news-ticker"><h3>📰 New Updates' + manageLink + '</h3><div class="empty">Nothing yet — click "📰 Add New Update" above to add an external news title and link.</div></div>';
  }
  const itemHtml = items.map(r=>{
    const url = /^https?:\/\//i.test(String(r.link||'').trim()) ? String(r.link).trim() : '';
    const label = escapeHtml(r.title || '(untitled)');
    return url
      ? '<a href="' + escapeHtml(url) + '" class="ticker-item" target="_blank" rel="noopener noreferrer" title="' + label + '">📰 ' + label + '</a>'
      : '<span class="ticker-item" style="cursor:default;" title="' + label + '">📰 ' + label + '</span>';
  }).join('');
  // The scrolling marquee duplicates its content so the loop back to the
  // top is seamless — but that duplication only makes sense once there's
  // enough content to actually need scrolling. With just a handful of
  // updates it just shows the same update(s) twice on screen at once
  // (nothing being scrolled past), which reads as a bug ("one entry showing
  // as two"), not a ticker — so few items get a plain, static, un-duplicated
  // list instead.
  const needsScroll = items.length > 5;
  const trackHtml = needsScroll ? (itemHtml + itemHtml) : itemHtml;
  return '<div class="news-ticker"><h3>📰 New Updates' + manageLink + '</h3>'
    + '<div class="news-ticker-viewport' + (needsScroll ? '' : ' news-ticker-viewport-auto') + '">'
    + '<div class="news-ticker-track' + (needsScroll ? '' : ' news-ticker-track-static') + '">' + trackHtml + '</div></div></div>';
}

/* ============================================================
   TIMETABLE — weekly grid view (special-cased instead of the
   generic table, since a Mon–Sat x time grid reads far better
   than a flat list for a recurring weekly schedule).
   ============================================================ */
/** Per-subject teaching-hours tracker: weekly recurring hours (from
 *  Timetable's actual Start/End Time on each slot — NOT a flat "1 hour per
 *  entry" count, since a slot can span more or less than an hour), hours
 *  actually taken so far (Held entries in Class Log up to today, again
 *  using the real duration — the matching Timetable slot's Start/End Time,
 *  or that Class Log row's own optional Duration field when no slot
 *  matches), and hours remaining — weekly hours × remaining teaching weeks
 *  until the current term's End Date (Admin & Settings → Academic Term).
 *  hoursRemaining is null (shown as "—") until an End Date is set, since
 *  there's nothing to compute it from. Rows are matched by Subject + Subject
 *  Code + Section + Batch Number together, so two different sections or lab
 *  batches of the very same subject/code are always kept as their own
 *  separate row rather than being merged into one. */
function subjectHoursSummary(){
  const bySubject = {};
  getActive('timetable').filter(t=>t.status !== 'Cancelled').forEach(t=>{
    const key = (t.subjectCode || '') + '||' + (t.subject || '') + '||' + (t.section || '') + '||' + (t.batchNumber || '');
    if(!bySubject[key]) bySubject[key] = { subject: t.subject || '(blank)', subjectCode: t.subjectCode || '', section: t.section || '', batchNumber: t.batchNumber || '', weeklySlots: 0, weeklyHours: 0, hoursTaken: 0 };
    bySubject[key].weeklySlots++;
    bySubject[key].weeklyHours += (timeRangeHours(t.startTime, t.endTime) || 1);
  });
  const timetableByKey = {};
  getActive('timetable').forEach(t=>{
    const key = (t.subject||'') + '|' + (t.subjectCode||'') + '|' + (t.day||'') + '|' + (t.section||'') + '|' + (t.batchNumber||'');
    if(!timetableByKey[key]) timetableByKey[key] = t;
  });
  const today = todayStr();
  getActive('class-log').filter(c=>c.status === 'Held' && c.date && c.date <= today).forEach(c=>{
    // A Class Log row doesn't have its own Section/Batch fields, so it's
    // matched to whichever of that subject/code's Timetable rows exists —
    // if the subject/code is split across multiple sections/batches, its
    // hours land on the first matching row (still far more accurate than
    // the old flat "+1" per class held).
    const matchKey = Object.keys(bySubject).find(k=>k.indexOf((c.subjectCode || '') + '||' + (c.subject || '') + '||') === 0);
    if(!matchKey) return;
    let hrs = parseFloat(c.durationHours) || 0;
    if(!hrs && c.date){
      const dow = DOW_NAMES3[new Date(c.date + 'T00:00:00').getDay()];
      const s = bySubject[matchKey];
      const t = timetableByKey[(c.subject||'') + '|' + (c.subjectCode||'') + '|' + dow + '|' + s.section + '|' + s.batchNumber];
      hrs = t ? (timeRangeHours(t.startTime, t.endTime) || 1) : 1;
    }
    bySubject[matchKey].hoursTaken += hrs;
  });
  const endDate = (STATE.config || {}).termEndDate || '';
  let remainingWeeks = null;
  if(endDate && endDate >= today){
    const diffDays = Math.round((new Date(endDate + 'T00:00:00Z') - new Date(today + 'T00:00:00Z')) / 86400000);
    remainingWeeks = Math.ceil(diffDays / 7);
  }else if(endDate){
    remainingWeeks = 0; // term end date already passed
  }
  return Object.keys(bySubject).map(key=>{
    const s = bySubject[key];
    const weeklyHours = Math.round(s.weeklyHours * 100) / 100;
    const hoursTaken = Math.round(s.hoursTaken * 100) / 100;
    return { subject: s.subject, subjectCode: s.subjectCode, section: s.section, batchNumber: s.batchNumber,
      weeklySlots: s.weeklySlots, weeklyHours: weeklyHours, hoursTaken: hoursTaken,
      hoursRemaining: remainingWeeks == null ? null : Math.round(weeklyHours * remainingWeeks * 100) / 100 };
  }).sort((a,b)=> a.subject.localeCompare(b.subject) || a.section.localeCompare(b.section) || a.batchNumber.localeCompare(b.batchNumber));
}

function wireTimetableScreen(){
  document.getElementById('add-record-btn').addEventListener('click', ()=>openModuleForm('timetable', null));
  document.getElementById('bulk-import-btn').addEventListener('click', ()=>openBulkImportDrawer('timetable', ()=>renderRoute()));
  document.querySelectorAll('[data-action="edit-cell"]').forEach(td=>{
    td.addEventListener('click', ()=>openModuleForm('timetable', td.dataset.id));
  });
  const cols = moduleDisplayColumns(MODULES.timetable);
  const wrap = document.getElementById('module-table-wrap');
  const searchEl = document.getElementById('module-search');
  const showDelEl = document.getElementById('show-deleted');
  function refreshTable(){ wrap.innerHTML = moduleTableHtml('timetable', cols, searchEl.value, showDelEl.checked); }
  refreshTable();
  searchEl.addEventListener('input', refreshTable);
  showDelEl.addEventListener('change', refreshTable);
  wrap.addEventListener('click', async (e)=>{
    const btn = e.target.closest('[data-action]');
    if(!btn) return;
    const tr = e.target.closest('tr[data-id]');
    const id = tr.dataset.id;
    const action = btn.dataset.action;
    const rec = getRecord('timetable', id);
    if(!rec) return;
    if(action === 'edit') openModuleForm('timetable', id);
    else if(action === 'notes') openNotesDrawer('timetable', id);
    else if(action === 'delete'){ if(!confirm('Delete this record?')) return; await softDeleteRecord('timetable', id); toast('Deleted','ok'); refreshTable(); }
    else if(action === 'restore'){ await restoreRecord('timetable', id); toast('Restored','ok'); refreshTable(); }
    else if(action === 'purge'){ if(!confirm('Permanently delete this record? This cannot be undone.')) return; await purgeRecord('timetable', id); toast('Purged','ok'); refreshTable(); }
  });
}

/* ============================================================
   REPORTS — export any module (or everything) in CSV, Excel, Word,
   PDF, or plain text, each optionally scoped to a period: this week,
   this month, one specific semester, a whole academic year (every
   semester tagged with that year), or the default "whole data".
   ============================================================ */
/** Every academic term FAMS+ knows about — the current one (from Admin &
 *  Settings → Academic Term) plus every archived one in
 *  STATE.config.academicTermHistory — newest first, each tagged
 *  {academicYear, semester, startDate, endDate, current}. Used to build the
 *  Reports period picker's semester/academic-year options. */
function allAcademicTerms(){
  const cfg = STATE.config || {};
  const current = (cfg.academicYear || cfg.semester || cfg.termStartDate || cfg.termEndDate)
    ? [{ academicYear: cfg.academicYear||'', semester: cfg.semester||'', startDate: cfg.termStartDate||'', endDate: cfg.termEndDate||'', current:true }] : [];
  return current.concat((cfg.academicTermHistory || []).slice().reverse());
}
/** Resolves a Reports period-picker value into a {from,to} date-string
 *  range (or null for "whole data" / a term with no dates recorded yet —
 *  in the no-dates case, exporting falls back to unfiltered rather than
 *  silently returning zero rows). */
/** custom: {month:'YYYY-MM', from:'YYYY-MM-DD', to:'YYYY-MM-DD'} — only
 *  read for the 'cmonth' (a specific month, not just the current one) and
 *  'custom' (an arbitrary from/to range) period values, both driven by the
 *  extra date inputs the Reports screen shows once one of those is picked. */
function periodDateRange(periodValue, custom){
  if(!periodValue || periodValue === 'all') return null;
  if(periodValue === 'week') return { from: startOfWeekStr(), to: endOfWeekStr() };
  if(periodValue === 'month'){
    const p = istParts(new Date());
    const from = p.y + '-' + String(p.mo+1).padStart(2,'0') + '-01';
    const lastDay = new Date(Date.UTC(p.y, p.mo+1, 0)).getUTCDate();
    const to = p.y + '-' + String(p.mo+1).padStart(2,'0') + '-' + String(lastDay).padStart(2,'0');
    return { from, to };
  }
  if(periodValue === 'cmonth'){
    const ym = custom && custom.month;
    if(!ym || !/^\d{4}-\d{2}$/.test(ym)) return null;
    const parts = ym.split('-');
    const y = Number(parts[0]), m = Number(parts[1]);
    const lastDay = new Date(Date.UTC(y, m, 0)).getUTCDate();
    return { from: ym + '-01', to: ym + '-' + String(lastDay).padStart(2,'0') };
  }
  if(periodValue === 'custom'){
    if(!custom || !custom.from || !custom.to) return null;
    return { from: custom.from, to: custom.to };
  }
  if(periodValue.indexOf('term:') === 0){
    const t = allAcademicTerms()[Number(periodValue.slice(5))];
    return (t && t.startDate && t.endDate) ? { from:t.startDate, to:t.endDate } : null;
  }
  if(periodValue.indexOf('year:') === 0){
    const year = periodValue.slice(5);
    const terms = allAcademicTerms().filter(t=>t.academicYear === year && t.startDate && t.endDate);
    if(!terms.length) return null;
    return { from: terms.map(t=>t.startDate).sort()[0], to: terms.map(t=>t.endDate).sort().slice(-1)[0] };
  }
  return null;
}
/** Human-readable description of the active period, appended to report
 *  headers so an exported file is self-documenting about its own scope. */
function periodRangeLabel(periodValue, range){
  if(!periodValue || periodValue === 'all') return '';
  if(periodValue === 'week') return 'This week (' + fmtDate(range.from) + ' – ' + fmtDate(range.to) + ')';
  if(periodValue === 'month') return 'This month (' + fmtDate(range.from) + ' – ' + fmtDate(range.to) + ')';
  if(periodValue === 'cmonth') return range ? ('Month: ' + fmtDate(range.from) + ' – ' + fmtDate(range.to)) : 'Pick a month above';
  if(periodValue === 'custom') return range ? ('Custom range (' + fmtDate(range.from) + ' – ' + fmtDate(range.to) + ')') : 'Pick a from/to date above';
  if(periodValue.indexOf('term:') === 0){
    const t = allAcademicTerms()[Number(periodValue.slice(5))];
    if(!t) return '';
    return 'Semester: ' + (t.academicYear||'—') + ' · ' + (t.semester||'—') + (range ? ' (' + fmtDate(range.from) + ' – ' + fmtDate(range.to) + ')' : ' — no dates recorded, showing whole data');
  }
  if(periodValue.indexOf('year:') === 0){
    const year = periodValue.slice(5);
    return 'Academic Year: ' + year + (range ? ' (' + fmtDate(range.from) + ' – ' + fmtDate(range.to) + ')' : ' — no dates recorded, showing whole data');
  }
  return '';
}
/** Builds the Reports screen's period-picker <option>s: Whole data, This
 *  week, This month, Pick a month, one "Semester: …" entry per known
 *  academic term, one "Academic Year: …" entry per distinct year among
 *  those terms, then Custom date range. */
function reportPeriodOptionsHtml(){
  const terms = allAcademicTerms();
  let html = '<option value="all">Whole data</option>'
    + '<option value="week">This week</option>'
    + '<option value="month">This month</option>'
    + '<option value="cmonth">Pick a month…</option>';
  terms.forEach((t, i)=>{
    html += '<option value="term:' + i + '">Semester: ' + escapeHtml((t.academicYear||'—') + ' · ' + (t.semester||'—')) + (t.current ? ' (current)' : '') + '</option>';
  });
  const years = [];
  terms.forEach(t=>{ if(t.academicYear && years.indexOf(t.academicYear) === -1) years.push(t.academicYear); });
  years.forEach(y=>{ html += '<option value="year:' + y + '">Academic Year: ' + escapeHtml(y) + '</option>'; });
  html += '<option value="custom">Custom date range…</option>';
  return html;
}
/** All of a module's records, narrowed to a period range by its dateField
 *  — records with no date value are excluded from any period-filtered view
 *  (they still show up under "Whole data") since there's no date to judge
 *  them by. A module with no dateField at all (e.g. Mentees) is never
 *  period-filterable and always returns its full collection. */
function filterByPeriod(moduleKey, range){
  const mod = MODULES[moduleKey];
  const all = getCollection(moduleKey);
  if(!range || !mod.dateField) return all;
  return all.filter(r=>{
    const d = r[mod.dateField];
    if(!d) return false;
    const dOnly = String(d).slice(0, 10);
    return dOnly >= range.from && dOnly <= range.to;
  });
}
function toCsvValue(v){
  const s = v == null ? '' : String(v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
}
/** Builds CSV text for an explicit list of records (rather than a whole
 *  module filtered by date range) — the shared engine behind both the
 *  Reports screen's per-module export and a grouped list view's per-group
 *  "Export this group" button. */
function recordsToCsv(mod, records){
  const cols = mod.fields.map(f=>f.key);
  const header = ['id'].concat(cols).concat(['createdAt','updatedAt','deleted']);
  const lines = [header.join(',')];
  records.forEach(r=>{
    const row = [r.id].concat(cols.map(c=>toCsvValue(r[c]))).concat([r.createdAt||'', r.updatedAt||'', r.deleted?'1':'0']);
    lines.push(row.join(','));
  });
  return lines.join('\n');
}
function collectionToCsv(moduleKey, range){
  return recordsToCsv(MODULES[moduleKey], filterByPeriod(moduleKey, range));
}
/** Delivers a Blob to the user as a download. In a plain browser this is a
 *  standard object-URL <a download> click. Inside the FAMS+ Android app,
 *  blob: URLs can't be downloaded natively by WebView, so when it detects
 *  window.AndroidBridge (injected by the Android wrapper — see
 *  android-app/…/MainActivity.kt) it instead base64-encodes the blob and
 *  hands it to AndroidBridge.saveFile(), which writes straight to the
 *  device's Downloads folder. Every export in this file (CSV/TXT/DOC/XLSX)
 *  funnels through this one function so both platforms stay in sync. */
function deliverFile(filename, blob){
  if(typeof AndroidBridge !== 'undefined' && AndroidBridge && AndroidBridge.saveFile){
    const reader = new FileReader();
    reader.onload = function(){
      const base64 = String(reader.result).split(',')[1] || '';
      try{ AndroidBridge.saveFile(base64, blob.type || 'application/octet-stream', filename); }
      catch(e){ console.error('[FAMS+] AndroidBridge.saveFile failed:', e); toast('Could not save file on device', 'danger'); }
    };
    reader.readAsDataURL(blob);
    return;
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
function downloadText(filename, text, mime){
  deliverFile(filename, new Blob([text], { type: mime || 'text/plain' }));
}

/* ---------- Word (.doc) + printable-PDF export ----------
   No document-generation library is bundled (this stays a single static
   file with no build step) — instead this uses the well-established
   "HTML tagged as a Word file" trick: Word opens an .doc file that is
   actually MS-Office-flavoured HTML perfectly happily, tables and all.
   PDF export reuses the same HTML through the browser's own print/
   "Save as PDF" dialog rather than a separate PDF-generation library. */
function fieldPlainValue(mod, field, rec){
  const v = rec[field.key];
  if(field.type === 'reference') return refLabel(field.ref, v);
  if(field.type === 'moduleRef') return v ? ((MODULES[v] && MODULES[v].label) || v) : '';
  if(field.type === 'categoryRef'){ const c = NAV_CATEGORIES.find(c=>c.key===v); return c ? c.label : ''; }
  if(field.type === 'recordRef'){ const depModKey = rec[field.dependsOn]; return (depModKey && v) ? refLabel(depModKey, v) : ''; }
  if(field.type === 'date') return v ? fmtDate(v) : '';
  if(field.type === 'time') return v ? fmtTime12(v) : '';
  if(field.type === 'multiselect') return Array.isArray(v) ? v.join('; ') : '';
  if(field.type === 'subtable'){
    const rows = Array.isArray(v) ? v : [];
    if(field.fixedRows){
      const resolved = resolveFixedRows(field, rows).map((r, i)=>Object.assign({}, r, { _rowLabel: field.fixedRows[i] }));
      const nonBlank = resolved.filter(r=>field.subfields.some(sf=>r[sf.key]));
      return nonBlank.map(r => r._rowLabel + ': ' + field.subfields.map(sf => r[sf.key]).filter(Boolean).join(' - ')).join('; ');
    }
    return rows.map(r => (r._rowLabel ? r._rowLabel + ': ' : '') + field.subfields.map(sf => r[sf.key]).filter(Boolean).join(' - ')).join('; ');
  }
  return v == null ? '' : String(v);
}
function moduleReportHtml(moduleKey, sectionBreak, periodValue, range){
  const mod = MODULES[moduleKey];

    + (academicTermLabel() ? ' &middot; ' + escapeHtml(academicTermLabel()) : '')
    + (periodLabel ? ' &middot; ' + escapeHtml(periodLabel) : '') + '</div>';
  if(rows.length === 0){
    html += '<p style="color:#888;">No records' + (periodLabel ? ' in this period' : '') + '.</p></div>';
    return html;
  }
  html += '<table><thead><tr>' + mod.fields.map(c=>'<th>' + escapeHtml(c.label) + '</th>').join('') + '<th>Status</th></tr></thead><tbody>';
  rows.forEach(r=>{
    html += '<tr>' + mod.fields.map(c=>'<td>' + escapeHtml(fieldPlainValue(mod, c, r)) + '</td>').join('') + '<td>' + (r.deleted ? 'Deleted' : 'Active') + '</td></tr>';

function reportDocStyles(){

function downloadWordDoc(filename, bodyHtml, title){

function printHtmlDocument(title, bodyHtml){
  const fullHtml = '<!doctype html><html><head><meta charset="utf-8"><title>' + escapeHtml(title) + '</title>'
    + '<style>' + reportDocStyles() + '</style></head><body>' + bodyHtml + '</body></html>';
  // Inside the Android app, window.open()/window.print() don't drive a real
  // print/PDF dialog (WebView doesn't implement window.print()) — hand the
  // HTML to the native bridge instead, which prints it via Android's own
  // PrintManager (→ "Save as PDF" is one of the built-in destinations there).
  if(typeof AndroidBridge !== 'undefined' && AndroidBridge && AndroidBridge.printHtml){
    try{ AndroidBridge.printHtml(fullHtml, title); return; }
    catch(e){ console.error('[FAMS+] AndroidBridge.printHtml failed:', e); }
  }
  const win = window.open('', '_blank');
  if(!win){ toast('Please allow pop-ups for this site to export a PDF', 'danger'); return; }
  win.document.write(fullHtml);
  win.document.close();
  win.focus();
  setTimeout(()=>{ win.print(); }, 350);
}

/** "📄 Export Profile (PDF)" — a full one-page-per-record profile document

 *  same `section` headings as the edit form, plus every logTabs entry) for

/* ---------- Excel (.xlsx) + plain-text (.txt) export ----------
   Reuses the same SheetJS library already loaded for bulk import. */
function moduleRowsAsObjects(moduleKey, range){
  const mod = MODULES[moduleKey];
  return filterByPeriod(moduleKey, range).map(r=>{
    const row = {};
    mod.fields.forEach(f=>{ row[f.label] = fieldPlainValue(mod, f, r); });
    row['Status'] = r.deleted ? 'Deleted' : 'Active';
    row['Created'] = r.createdAt ? fmtDateTime(r.createdAt) : '';
    row['Updated'] = r.updatedAt ? fmtDateTime(r.updatedAt) : '';
    return row;
  });
}
/** Excel worksheet names can't contain : \ / ? * [ ] and must be <=31 chars
 *  and unique within a workbook — sanitize + de-duplicate against a
 *  running set of names already used in this workbook. */
function safeSheetName(rawLabel, usedNames){
  let name = String(rawLabel || 'Sheet1').replace(/[:\\\/\?\*\[\]]/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 28) || 'Sheet1';
  let candidate = name, n = 1;
  while(usedNames.has(candidate)){ n++; candidate = (name.slice(0, 25) + ' ' + n).slice(0, 31); }
  usedNames.add(candidate);
  return candidate;
}
/** Writes a SheetJS workbook to disk — via the Android save bridge (base64,
 *  no filesystem-level "download" involved) when running in the FAMS+
 *  Android app, or XLSX.writeFile's normal browser download otherwise. */
function deliverWorkbook(wb, filename){
  if(typeof AndroidBridge !== 'undefined' && AndroidBridge && AndroidBridge.saveFile){
    const base64 = XLSX.write(wb, { type:'base64', bookType:'xlsx' });
    try{ AndroidBridge.saveFile(base64, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', filename); }
    catch(e){ console.error('[FAMS+] AndroidBridge.saveFile failed:', e); toast('Could not save file on device', 'danger'); }
    return;
  }
  XLSX.writeFile(wb, filename);
}
function downloadModuleXlsx(moduleKey, range){
  const mod = MODULES[moduleKey];
  const rows = moduleRowsAsObjects(moduleKey, range);
  const headers = mod.fields.map(f=>f.label).concat(['Status','Created','Updated']);
  const ws = rows.length
    ? XLSX.utils.json_to_sheet(rows, { header: headers })
    : XLSX.utils.aoa_to_sheet([headers]);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, safeSheetName(mod.label, new Set()));
  deliverWorkbook(wb, 'fams-plus-' + moduleKey + '-' + todayStr() + '.xlsx');
}
function downloadFullXlsx(range){
  const wb = XLSX.utils.book_new();
  const usedNames = new Set();
  MODULE_KEYS.forEach(k=>{
    const mod = MODULES[k];
    const rows = moduleRowsAsObjects(k, range);
    const headers = mod.fields.map(f=>f.label).concat(['Status','Created','Updated']);
    const ws = rows.length
      ? XLSX.utils.json_to_sheet(rows, { header: headers })
      : XLSX.utils.aoa_to_sheet([headers]);
    XLSX.utils.book_append_sheet(wb, ws, safeSheetName(mod.label || k, usedNames));
  });
  deliverWorkbook(wb, 'fams-plus-full-report-' + todayStr() + '.xlsx');
}
function moduleReportText(moduleKey, periodValue, range){
  const mod = MODULES[moduleKey];
  const rows = filterByPeriod(moduleKey, range);
  const periodLabel = periodRangeLabel(periodValue, range);
  let out = mod.icon + ' ' + mod.label + '\n' + '='.repeat((mod.label || '').length + 2) + '\n'
    + 'Generated ' + fmtDateTime(nowIso()) + ' · ' + ((STATE.meta && STATE.meta.facultyName) || '') + ' · ' + DEPARTMENT_NAME
    + (academicTermLabel() ? ' · ' + academicTermLabel() : '') + (periodLabel ? ' · ' + periodLabel : '') + '\n\n';
  if(rows.length === 0){ out += '(No records' + (periodLabel ? ' in this period' : '') + ')\n'; return out; }
  rows.forEach((r, i)=>{
    out += '#' + (i+1) + '\n';
    mod.fields.forEach(f=>{ out += '  ' + f.label + ': ' + fieldPlainValue(mod, f, r) + '\n'; });
    out += '  Status: ' + (r.deleted ? 'Deleted' : 'Active') + '\n\n';
  });
  return out;
}
function fullReportText(periodValue, range){

    + ((STATE.meta && STATE.meta.facultyName) || '') + ' · ' + DEPARTMENT_NAME + ' · ' + INSTITUTION_NAME
    + (academicTermLabel() ? ' · ' + academicTermLabel() : '') + (periodLabel ? ' · ' + periodLabel : '') + '\n'
    + 'Generated ' + fmtDateTime(nowIso()) + '\n\n';
  MODULE_KEYS.forEach(k=>{ out += moduleReportText(k, periodValue, range) + '\n'; });
  return out;
}

/* ============================================================
   CALENDAR — a simple month view aggregating every module's date
   field into one place.
   ============================================================ */
let CAL_CURSOR = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
/** Day/Week/Month/Year — which granularity the Calendar screen is showing.
 *  Prev/Today/Next below all act relative to whichever of these is active. */
let CAL_VIEW = 'month';
/** Every dated item across every module (except the internal Activity Log),
 *  keyed by plain YYYY-MM-DD date string — the one shared data source
 *  behind all four calendar views. */
function calendarEventsInRange(fromStr, toStr){
  const events = {};
  MODULE_KEYS.forEach(k=>{
    if(k === 'audit-log') return; // internal audit trail, not a calendar-worthy event
    const mod = MODULES[k];
    if(!mod.dateField) return;
    getActive(k).forEach(r=>{
      const d = r[mod.dateField];
      if(!d) return;
      const dateKey = String(d).slice(0, 10);
      if(dateKey < fromStr || dateKey > toStr) return;
      (events[dateKey] = events[dateKey] || []).push({ moduleKey:k, label: mod.label, icon: mod.icon, title: r[mod.titleField] || '(untitled)' });
    });
  });
  return events;
}
function calendarEventsForMonth(year, month){
  const from = year + '-' + String(month+1).padStart(2,'0') + '-01';
  const lastDay = new Date(year, month+1, 0).getDate();
  const to = year + '-' + String(month+1).padStart(2,'0') + '-' + String(lastDay).padStart(2,'0');
  const byDate = calendarEventsInRange(from, to);
  const events = {};
  Object.keys(byDate).forEach(dateKey=>{ events[Number(dateKey.slice(8,10))] = byDate[dateKey]; });
  return events;
}
function calendarViewHeadHtml(title, sub){
  return '<div class="page-head"><div><h2>🗓️ Calendar — ' + escapeHtml(title) + '</h2><p>' + escapeHtml(sub) + '</p></div>'

    + '<div class="cal-view-toggle">' + ['day','week','month','year'].map(v=>'<button class="btn btn-ghost btn-sm' + (CAL_VIEW===v?' active':'') + '" data-cal-view="' + v + '">' + v.charAt(0).toUpperCase()+v.slice(1) + '</button>').join('') + '</div>'
    + '<button class="btn btn-ghost btn-sm" id="cal-prev">‹ Prev</button><button class="btn btn-ghost btn-sm" id="cal-today">Today</button><button class="btn btn-ghost btn-sm" id="cal-next">Next ›</button></div></div>';
}
function dayEventsListHtml(dayEvents){
  if(!dayEvents || !dayEvents.length) return '<div class="empty">Nothing scheduled.</div>';
  return dayEvents.map(ev=>'<a href="#/module/' + ev.moduleKey + '" class="dash-link" style="display:flex;gap:8px;padding:7px 8px;border-bottom:1px solid var(--border);font-size:12.5px;">'
    + '<span>' + ev.icon + '</span><span><b>' + escapeHtml(ev.label) + ':</b> ' + escapeHtml(ev.title) + '</span></a>').join('');
}
function renderCalendarMonth(){
  const year = CAL_CURSOR.getFullYear(), month = CAL_CURSOR.getMonth();
  const monthName = CAL_CURSOR.toLocaleDateString('en-US', { month:'long', year:'numeric' });
  const firstDow = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const events = calendarEventsForMonth(year, month);
  const todayKey = todayStr();

  let html = calendarViewHeadHtml(monthName, "Every module's dated items in one view");
  html += '<div class="table-wrap"><table style="width:100%;border-collapse:collapse;table-layout:fixed;">';
  html += '<thead><tr>' + ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>'<th style="padding:8px;border-bottom:1px solid var(--border);font-size:11px;color:var(--text-dim);">'+d+'</th>').join('') + '</tr></thead><tbody><tr>';
  for(let i=0;i<firstDow;i++) html += '<td style="border:1px solid var(--border);height:90px;background:#fafbfd;"></td>';
  let col = firstDow;
  for(let day=1; day<=daysInMonth; day++){
    const dateKey = year + '-' + String(month+1).padStart(2,'0') + '-' + String(day).padStart(2,'0');
    const dayEvents = events[day] || [];
    html += '<td class="cal-day-cell" data-date="' + dateKey + '" style="border:1px solid var(--border);height:90px;vertical-align:top;padding:4px;font-size:11px;cursor:pointer;' + (dateKey===todayKey?'background:#eef3fc;':'') + '">'
      + '<div style="font-weight:700;margin-bottom:3px;">' + day + '</div>'
      + dayEvents.slice(0,3).map(ev=>'<div style="background:#eef0f3;border-radius:4px;padding:1px 4px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" title="' + escapeHtml(ev.label+': '+ev.title) + '">' + ev.icon + ' ' + escapeHtml(ev.title) + '</div>').join('')
      + (dayEvents.length>3 ? '<div style="color:var(--text-faint);">+' + (dayEvents.length-3) + ' more</div>' : '')
      + '</td>';
    col++;
    if(col === 7){ html += '</tr><tr>'; col = 0; }
  }
  if(col !== 0){ for(let i=col;i<7;i++) html += '<td style="border:1px solid var(--border);background:#fafbfd;"></td>'; html += '</tr>'; }
  html += '</tbody></table></div>';
  return html;
}
function renderCalendarWeek(){
  const dow = CAL_CURSOR.getDay();
  const weekStart = new Date(CAL_CURSOR.getFullYear(), CAL_CURSOR.getMonth(), CAL_CURSOR.getDate() - dow);
  const days = Array.from({length:7}, (_,i)=> new Date(weekStart.getFullYear(), weekStart.getMonth(), weekStart.getDate()+i));
  const from = fmtIsoDate(days[0]), to = fmtIsoDate(days[6]);
  const events = calendarEventsInRange(from, to);
  const todayKey = todayStr();
  let html = calendarViewHeadHtml(fmtDate(from) + ' – ' + fmtDate(to), 'Week view');
  html += '<div class="grid grid-2" style="grid-template-columns:repeat(7,1fr);gap:10px;">';
  days.forEach(d=>{
    const dateKey = fmtIsoDate(d);
    const dayEvents = events[dateKey] || [];
    html += '<div class="card cal-day-cell" data-date="' + dateKey + '" style="padding:10px;cursor:pointer;' + (dateKey===todayKey?'border-color:var(--gold,#c99a3c);' : '') + '">'
      + '<div style="font-size:11px;color:var(--text-dim);">' + WEEKDAY_LONG[d.getDay()].slice(0,3) + '</div>'
      + '<div style="font-weight:700;margin-bottom:6px;">' + d.getDate() + '</div>'
      + dayEvents.slice(0,4).map(ev=>'<div style="background:#eef0f3;border-radius:4px;padding:1px 4px;margin-bottom:2px;font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" title="' + escapeHtml(ev.label+': '+ev.title) + '">' + ev.icon + ' ' + escapeHtml(ev.title) + '</div>').join('')
      + (dayEvents.length>4 ? '<div style="color:var(--text-faint);font-size:10.5px;">+' + (dayEvents.length-4) + ' more</div>' : '')
      + '</div>';
  });
  html += '</div>';
  return html;
}
function renderCalendarDay(){
  const dateKey = fmtIsoDate(CAL_CURSOR);
  const events = calendarEventsInRange(dateKey, dateKey)[dateKey] || [];
  let html = calendarViewHeadHtml(fmtDate(dateKey) + (dateKey===todayStr() ? ' (Today)' : ''), WEEKDAY_LONG[CAL_CURSOR.getDay()]);
  html += '<div class="card">' + dayEventsListHtml(events) + '</div>';
  return html;
}
function renderCalendarYear(){
  const year = CAL_CURSOR.getFullYear();
  const events = calendarEventsInRange(year + '-01-01', year + '-12-31');
  let html = calendarViewHeadHtml(String(year), 'Click a month to open it');
  html += '<div class="grid grid-4" style="gap:12px;">';
  for(let m=0; m<12; m++){
    const count = Object.keys(events).filter(k=>k.slice(5,7) === String(m+1).padStart(2,'0')).reduce((s,k)=>s+events[k].length, 0);
    html += '<div class="card cal-month-cell" data-year-month="' + year + '-' + String(m+1).padStart(2,'0') + '" style="padding:14px;cursor:pointer;text-align:center;">'
      + '<div style="font-weight:700;font-size:14px;">' + MONTH_LONG[m] + '</div>'
      + '<div style="font-size:12px;color:var(--text-dim);margin-top:4px;">' + count + ' item' + (count===1?'':'s') + '</div></div>';
  }
  html += '</div>';
  return html;
}
function renderCalendar(){
  let html;
  if(CAL_VIEW === 'week') html = renderCalendarWeek();
  else if(CAL_VIEW === 'day') html = renderCalendarDay();
  else if(CAL_VIEW === 'year') html = renderCalendarYear();
  else html = renderCalendarMonth();
  setTimeout(wireCalendar, 0);
  return html;
}
function wireCalendar(){
  const prev = document.getElementById('cal-prev'), next = document.getElementById('cal-next'), today = document.getElementById('cal-today');
  if(!prev) return;
  function shift(dir){
    if(CAL_VIEW === 'day') CAL_CURSOR = new Date(CAL_CURSOR.getFullYear(), CAL_CURSOR.getMonth(), CAL_CURSOR.getDate()+dir);
    else if(CAL_VIEW === 'week') CAL_CURSOR = new Date(CAL_CURSOR.getFullYear(), CAL_CURSOR.getMonth(), CAL_CURSOR.getDate()+(dir*7));
    else if(CAL_VIEW === 'year') CAL_CURSOR = new Date(CAL_CURSOR.getFullYear()+dir, CAL_CURSOR.getMonth(), 1);
    else CAL_CURSOR = new Date(CAL_CURSOR.getFullYear(), CAL_CURSOR.getMonth()+dir, 1);
    renderRoute();
  }
  prev.addEventListener('click', ()=>shift(-1));
  next.addEventListener('click', ()=>shift(1));
  today.addEventListener('click', ()=>{ CAL_CURSOR = new Date(new Date().getFullYear(), new Date().getMonth(), new Date().getDate()); renderRoute(); });
  document.querySelectorAll('[data-cal-view]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ CAL_VIEW = btn.dataset.calView; renderRoute(); });
  });
  document.querySelectorAll('.cal-day-cell[data-date]').forEach(cell=>{
    cell.addEventListener('click', (e)=>{
      if(e.target.closest('a')) return; // let an event link navigate normally
      const d = cell.dataset.date.split('-').map(Number);
      CAL_CURSOR = new Date(d[0], d[1]-1, d[2]);
      CAL_VIEW = 'day';
      renderRoute();
    });
  });
  document.querySelectorAll('.cal-month-cell[data-year-month]').forEach(cell=>{
    cell.addEventListener('click', ()=>{
      const ym = cell.dataset.yearMonth.split('-').map(Number);
      CAL_CURSOR = new Date(ym[0], ym[1]-1, 1);
      CAL_VIEW = 'month';
      renderRoute();
    });
  });
}

function wireAdmin(){
  const openCustomBtn = document.getElementById('adm-open-custom-modules');
  if(openCustomBtn) openCustomBtn.addEventListener('click', ()=>navigate('#/module/custom-modules'));
  const jumpBtn = document.getElementById('adm-jump-btn');
  if(jumpBtn) jumpBtn.addEventListener('click', ()=>{
    const key = document.getElementById('adm-jump-module').value;
    if(key) navigate('#/module/' + key);
  });
  const saveMenuNamesBtn = document.getElementById('adm-save-menu-names');
  if(saveMenuNamesBtn) saveMenuNamesBtn.addEventListener('click', async (e)=>{
    const btn = e.currentTarget;
    if(btn.disabled) return;
    btn.disabled = true;
    try{
      const overrides = {};
      document.querySelectorAll('[data-rename-key]').forEach(inp=>{
        const key = inp.dataset.renameKey;
        const val = inp.value.trim();
        if(val && val !== DEFAULT_MODULE_LABELS[key]) overrides[key] = val;
      });
      STATE.config.moduleLabelOverrides = overrides;
      await saveConfig();
      applyModuleLabelOverrides();
      // Any built-in module NOT in the overrides object anymore needs its
      // label reset back to the default (clearing a box, or leaving it
      // blank, is how you undo a rename) — applyModuleLabelOverrides() only
      // ever sets labels, it never clears ones no longer present.
      Object.keys(DEFAULT_MODULE_LABELS).forEach(key=>{ if(!overrides[key] && MODULES[key]) applyModuleLabelOverride(key, DEFAULT_MODULE_LABELS[key]); });
      toast('Menu names saved', 'ok');
      // A full render() (not just renderRoute()) — the top nav shell (and
      // any standalone top-level button like Work Diary/Calendar) is only
      // built once at boot, so a rename needs the whole shell rebuilt to
      // actually show up there, not just the Admin page's own content.
      render();
    }finally{ btn.disabled = false; }
  });
  const clearAuditBtn = document.getElementById('adm-clear-audit-log');
  if(clearAuditBtn) clearAuditBtn.addEventListener('click', async (e)=>{
    const btn = e.currentTarget;
    if(btn.disabled) return;
    if(!confirm('Permanently clear the entire Activity Log? This cannot be undone.')) return;
    btn.disabled = true;
    try{
      await saveCollection('audit-log', []);
      toast('Activity Log cleared', 'ok');
      renderRoute();
    }finally{ btn.disabled = false; }
  });
  document.getElementById('adm-save-profile').addEventListener('click', async (e)=>{
    const btn = e.currentTarget;
    if(btn.disabled) return;
    btn.disabled = true;
    try{
      STATE.meta.facultyName = document.getElementById('adm-name').value.trim();
      STATE.meta.email = document.getElementById('adm-email').value.trim();
      STATE.meta.phone = document.getElementById('adm-phone').value.trim();
      await saveMeta();
      toast('Profile saved', 'ok');
      renderRoute();
    }finally{ btn.disabled = false; }
  });
  document.getElementById('adm-save-pin').addEventListener('click', async (e)=>{
    const btn = e.currentTarget;
    if(btn.disabled) return;
    const errEl = document.getElementById('adm-pin-error');
    errEl.textContent = '';
    const oldPin = document.getElementById('adm-pin-old').value.trim();
    const newPin = document.getElementById('adm-pin-new').value.trim();
    const newPin2 = document.getElementById('adm-pin-new2').value.trim();
    if(!/^[0-9]{4}$/.test(newPin)){ errEl.textContent = 'New PIN must be exactly 4 digits.'; return; }
    if(newPin !== newPin2){ errEl.textContent = 'New PINs do not match.'; return; }
    btn.disabled = true;
    try{ await doChangePin(oldPin, newPin); toast('PIN updated', 'ok'); document.getElementById('adm-pin-old').value=''; document.getElementById('adm-pin-new').value=''; document.getElementById('adm-pin-new2').value=''; }
    catch(err){ errEl.textContent = err.message || String(err); }
    finally{ btn.disabled = false; }
  });
  document.getElementById('adm-save-term').addEventListener('click', async (e)=>{
    // In-place edit — corrects the current term's details (e.g. a typo in
    // the year, or filling in the end date later) WITHOUT archiving it to
    // history, since nothing about which term is "current" is changing.
    const btn = e.currentTarget;
    if(btn.disabled) return;
    btn.disabled = true;
    try{
      STATE.config.academicYear = document.getElementById('adm-year').value.trim();
      STATE.config.semester = document.getElementById('adm-sem').value.trim();
      STATE.config.termStartDate = document.getElementById('adm-term-start').value;
      STATE.config.termEndDate = document.getElementById('adm-term-end').value;
      await saveConfig();
      refreshTopnavTag();
      toast('Academic term saved', 'ok');
    }finally{ btn.disabled = false; }
  });
  document.getElementById('adm-new-term').addEventListener('click', async (e)=>{
    // Starting a new term: the OLD current term (year/semester/dates) is
    // pushed into academicTermHistory first — preserved, but no longer
    // "current" anywhere in the app — then the form's values become the
    // new current term. This is how "previous semester must be preserved"
    // is satisfied: nothing is overwritten in place, it's archived.
    const btn = e.currentTarget;
    if(btn.disabled) return;
    btn.disabled = true;
    try{
      const resEl = document.getElementById('adm-term-result');
      const newYear = document.getElementById('adm-year').value.trim();
      const newSem = document.getElementById('adm-sem').value.trim();
      const newStart = document.getElementById('adm-term-start').value;
      const newEnd = document.getElementById('adm-term-end').value;
      const cfg = STATE.config;
      const hadPreviousTerm = cfg.academicYear || cfg.semester;
      // A click with the Academic Year/Semester/dates fields unchanged from
      // the current term is a no-op, not a new term — archiving it anyway
      // would push a duplicate "previous term" row every time this button
      // is pressed (this is what previously produced repeated identical
      // entries under "Previous terms").
      const noRealChange = hadPreviousTerm && cfg.academicYear === newYear && cfg.semester === newSem
        && (cfg.termStartDate||'') === newStart && (cfg.termEndDate||'') === newEnd;
      if(noRealChange){
        resEl.style.display = 'block';
        resEl.textContent = 'Nothing to archive — the Academic Year/Semester/dates above still match the current term. Change them first, then click Start New Term.';
        return;
      }
      if(hadPreviousTerm){
        const history = (cfg.academicTermHistory || []).slice();
        history.push({ academicYear: cfg.academicYear || '', semester: cfg.semester || '', startDate: cfg.termStartDate || '', endDate: cfg.termEndDate || '' });
        cfg.academicTermHistory = history;
      }
      cfg.academicYear = newYear;
      cfg.semester = newSem;
      cfg.termStartDate = newStart;
      cfg.termEndDate = newEnd;
      await saveConfig();
      refreshTopnavTag();
      resEl.style.display = 'block';
      resEl.textContent = hadPreviousTerm ? 'New term started — the previous term is preserved below.' : 'Term saved.';
      toast('New term started', 'ok');
      renderRoute();
    }finally{ btn.disabled = false; }
  });
  document.querySelectorAll('.term-hist-edit').forEach(btn=>{
    btn.addEventListener('click', async (e)=>{
      const trigger = e.currentTarget;
      if(trigger.disabled) return;
      const idx = Number(trigger.dataset.idx);
      const entry = (STATE.config.academicTermHistory || [])[idx];
      if(!entry) return;
      trigger.disabled = true;
      try{
        const ok = await confirmWithPin('Edit previous term', 'This term is preserved history — enter your PIN to edit its details.');
        if(!ok) return;
        openModal('<h3>✏️ Edit previous term</h3>'
          + '<div class="field"><label>Academic Year</label><input class="input" id="th-year" value="' + escapeHtml(entry.academicYear||'') + '"></div>'
          + '<div class="field"><label>Semester / Term</label><input class="input" id="th-sem" value="' + escapeHtml(entry.semester||'') + '"></div>'
          + '<div class="grid grid-2">'
          + '<div class="field"><label>Start Date</label><input class="input" id="th-start" type="date" value="' + escapeHtml(entry.startDate||'') + '"></div>'
          + '<div class="field"><label>End Date</label><input class="input" id="th-end" type="date" value="' + escapeHtml(entry.endDate||'') + '"></div>'
          + '</div>'
          + '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:6px;">'
          + '<button class="btn btn-ghost btn-sm" id="th-cancel" type="button">Cancel</button>'
          + '<button class="btn btn-primary btn-sm" id="th-save" type="button">Save</button>'
          + '</div>');
        document.getElementById('th-cancel').addEventListener('click', closeModal);
        document.getElementById('th-save').addEventListener('click', async (ev)=>{
          const saveBtn = ev.currentTarget;
          if(saveBtn.disabled) return;
          saveBtn.disabled = true;
          try{
            const history = (STATE.config.academicTermHistory || []).slice();
            history[idx] = {
              academicYear: document.getElementById('th-year').value.trim(),
              semester: document.getElementById('th-sem').value.trim(),
              startDate: document.getElementById('th-start').value,
              endDate: document.getElementById('th-end').value
            };
            STATE.config.academicTermHistory = history;
            await saveConfig();
            closeModal();
            toast('Previous term updated', 'ok');
            renderRoute();
          }finally{ saveBtn.disabled = false; }
        });
      }finally{ trigger.disabled = false; }
    });
  });
  document.querySelectorAll('.term-hist-delete').forEach(btn=>{
    btn.addEventListener('click', async (e)=>{
      const trigger = e.currentTarget;
      if(trigger.disabled) return;
      const idx = Number(trigger.dataset.idx);
      if(!(STATE.config.academicTermHistory || [])[idx]) return;
      trigger.disabled = true;
      try{
        const ok = await confirmWithPin('Delete previous term', 'This permanently removes this term from history — enter your PIN to confirm.');
        if(!ok) return;
        const history = (STATE.config.academicTermHistory || []).slice();
        history.splice(idx, 1);
        STATE.config.academicTermHistory = history;
        await saveConfig();
        toast('Previous term deleted', 'ok');
        renderRoute();
      }finally{ trigger.disabled = false; }
    });
  });
  document.getElementById('adm-send-test').addEventListener('click', async (e)=>{
    const btn = e.currentTarget;
    if(btn.disabled) return;
    const resEl = document.getElementById('adm-test-result');
    const to = document.getElementById('adm-test-email').value.trim();
    if(!to){ resEl.textContent = 'Enter an email address first.'; return; }
    btn.disabled = true;
    resEl.textContent = 'Sending…';
    try{
      const res = await apiTestEmail(to);
      resEl.textContent = res.ok ? ('Sent as ' + (res.sentAs || '(unknown)') + '. Remaining daily quota: ' + res.remainingQuota) : ('Failed: ' + (res.error || 'unknown error'));
    }finally{ btn.disabled = false; }
  });
}

/* ============================================================
   MAIL MERGE — a standalone screen (Settings tab), reachable directly
   from the nav rather than tucked away inside Admin & Settings. Sends
   the same templated email to an arbitrary pasted-in list of people —
   for one-off recipients not necessarily stored in any FAMS+ module
   (for per-module bulk email to your own records, use "Email Selected"
   on that module's list instead — see openEmailComposeDrawer()).
   ============================================================ */
function renderMailMergeScreen(){
  return '<div class="page-head"><div><h2>✉️ Mail Merge</h2><p>Send the same templated email to a list of people</p></div></div>'
    + '<div class="card"><p style="font-size:12.5px;color:var(--text-dim);">Use <code>{{name}}</code>, <code>{{email}}</code> etc. as placeholders — they\'ll be substituted per recipient from the fields below. For emailing people already stored in a menu (Mentees, Committee Members, …), use that menu\'s own "Email Selected" bulk action instead — this tool is for one-off/external recipient lists.</p>'
    + '<div class="field"><label>Recipients — one per line, format: <span class="mono">name, email</span></label><textarea class="input" id="mm-recipients" placeholder="Jane Doe, jane@example.com" style="min-height:110px;"></textarea></div>'
    + '<div class="field"><label>Subject</label><input class="input" id="mm-subject" placeholder="Subject with {{name}} placeholders"></div>'
    + '<div class="field"><label>Body</label><textarea class="input" id="mm-body" placeholder="Dear {{name}}, ..." style="min-height:150px;"></textarea></div>'
    + '<button class="btn btn-primary btn-sm" id="mm-send">Send Mail Merge</button>'
    + '<div id="mm-result" style="margin-top:10px;"></div></div>';
}
function wireMailMergeScreen(){
  document.getElementById('mm-send').addEventListener('click', async (e)=>{
    const btn = e.currentTarget;
    if(btn.disabled) return;
    const resEl = document.getElementById('mm-result');
    const lines = document.getElementById('mm-recipients').value.split('\n').map(l=>l.trim()).filter(Boolean);
    const recipients = lines.map(l=>{ const parts = l.split(','); return { name:(parts[0]||'').trim(), email:(parts[1]||'').trim() }; });
    const subject = document.getElementById('mm-subject').value;
    const body = document.getElementById('mm-body').value;
    if(recipients.length === 0){ resEl.textContent = 'Add at least one recipient.'; return; }
    btn.disabled = true;
    resEl.textContent = 'Sending to ' + recipients.length + ' recipient(s)…';
    let res;
    try{ res = await apiMailMerge(recipients, subject, body); }
    finally{ btn.disabled = false; }
    if(!res.ok){ resEl.textContent = 'Failed: ' + (res.error || 'unknown error'); return; }
    const okCount = res.results.filter(r=>r.ok).length;
    resEl.innerHTML = okCount + ' / ' + res.results.length + ' sent successfully.' + res.results.filter(r=>!r.ok).map(r=>'<div style="color:var(--danger);font-size:12px;">' + escapeHtml(r.email||r.name) + ': ' + escapeHtml(r.error||'failed') + '</div>').join('');
  });
}

/* ============================================================
   PWA — installability + offline service worker
   ============================================================ */
let deferredInstallPrompt = null;
let installAvailable = false;
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredInstallPrompt = e;
  installAvailable = true;
  const btn = document.getElementById('install-btn');
  if(btn) btn.classList.remove('hidden');
});
window.addEventListener('appinstalled', ()=>{ deferredInstallPrompt = null; installAvailable = false; toast('FAMS+ installed', 'ok'); });
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(function(){ /* ok to fail on plain http/local preview */ }); });
}

/* ============================================================
   GO
   ============================================================ */
boot();
</script>
