%23e0b558%22%20stroke-width%3D%222%22/%3E%3Ccircle%20cx%3D%2219.5%22%20cy%3D%229.6%22%20r%3D%222.3%22%20fill%3D%22%23e0b558%22/%3E%3C/g%3E%3C/svg%3E">

<style>
:root{
  --navy:#0f1f3d; --navy-2:#16264a; --navy-3:#1c2b4a;
  --gold:#c99a3c; --gold-2:#e0b558;
  --bg:#f0f3fa; --card:#ffffff; --border:#e3e7f0; --border-strong:#cbd1db;
  --text:#0f1424; --text-dim:#404a68; --text-faint:#68718c;
  --ok:#1f8a52; --ok-wash:#e4f4ec;
  --warn:#b9741c; --warn-wash:#fbf0dd;
  --danger:#b3273b; --danger-wash:#fbeae9;
  --info:#2a63c9; --info-wash:#e7eef8;
  --radius:10px; --shadow:0 1px 3px rgba(20,30,60,.08), 0 1px 2px rgba(20,30,60,.06);
  --shadow-md:0 4px 14px rgba(20,30,60,.10);
  --shadow-lg:0 10px 30px rgba(15,25,60,.18);

  /* area accent colours — one per functional zone, used across the
     sidebar, stat cards, badges and analytics so each part of FAMS+
     reads as its own "colour family" at a glance instead of one flat
     navy-and-gold palette everywhere. */
  --a-teaching:#2a63c9;   --a-teaching-wash:#e7eef8;
  --a-exams:#7c3aed;      --a-exams-wash:#f1eafd;
  --a-mentoring:#0891b2;  --a-mentoring-wash:#e3f4f7;
  --a-lab:#0e9f6e;        --a-lab-wash:#e2f7ee;
  --a-extra:#d97706;      --a-extra-wash:#fdf1de;
  --a-research:#059669;   --a-research-wash:#e1f5ee;
  --a-projects:#c99a3c;   --a-projects-wash:#faf3e3;
  --a-incharge:#dc2626;   --a-incharge-wash:#fce9e9;
  --a-committees:#ea580c; --a-committees-wash:#fdece0;
  --a-meetings:#4f46e5;   --a-meetings-wash:#eceafc;
  --a-reminders:#db2777;  --a-reminders-wash:#fce7f0;
  --a-resp:#0f766e;       --a-resp-wash:#e1f2f0;
  --a-diary:#7c5cbf;      --a-diary-wash:#f0ecfa;

  font-size:15px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
.hidden{display:none !important;}
body{font-family:'Plus Jakarta Sans',sans-serif;color:var(--text);background:var(--bg);min-height:100vh;-webkit-font-smoothing:antialiased;}
.mono{font-family:'IBM Plex Mono',monospace;}
a{color:var(--info);text-decoration:none;}
button{font-family:inherit;}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.content{animation:fadeUp .28s ease both;}
.grid>.stat-card,.grid>.card{animation:fadeUp .34s ease both;}
.grid>.stat-card:nth-child(1),.grid>.card:nth-child(1){animation-delay:.01s;}
.grid>.stat-card:nth-child(2),.grid>.card:nth-child(2){animation-delay:.07s;}
.grid>.stat-card:nth-child(3),.grid>.card:nth-child(3){animation-delay:.13s;}
.grid>.stat-card:nth-child(4),.grid>.card:nth-child(4){animation-delay:.19s;}

/* ---------- layout shell (horizontal top navigation) ---------- */
#app{display:flex;flex-direction:column;min-height:100vh;}
.topnav{position:sticky;top:0;z-index:40;background:var(--card);border-bottom:1px solid var(--border);box-shadow:0 2px 10px rgba(15,25,60,.05);}
.topnav-row1{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;border-bottom:1px solid var(--border);}
.topnav-brand{display:flex;align-items:center;gap:10px;}
.topnav-brand svg{flex:0 0 auto;}
.topnav-brand .name{font-weight:800;font-size:16.5px;letter-spacing:.3px;line-height:1.15;color:var(--navy);}
.topnav-brand .name span{color:var(--gold-2);}
.topnav-brand .name .tag{font-weight:500;font-size:10.5px;letter-spacing:.02em;color:var(--text-dim);margin-top:2px;}
.topnav-utils{display:flex;align-items:center;gap:10px;}
.topnav-row2{display:flex;align-items:center;gap:6px 12px;padding:0 14px;min-height:46px;flex-wrap:wrap;}
/* Redundant with the active tab styling on the nav itself — kept in the DOM
   (renderRoute() still writes to #topbar-title on every navigation) but no
   longer shown, per feedback that it duplicated what the nav already shows. */
.topnav-row2 .row2-title{display:none;}
/* NOTE: deliberately NOT overflow-x:auto here — that would clip .topnav-dropdown's
   vertical overflow too (an overflow-x:auto ancestor forces overflow-y:auto and
   clips ANY descendant, including position:absolute ones, that extends past its
   box). Categories wrap onto a second line instead on narrow screens. */
/* Tabs grow to fill the whole row edge-to-edge (row2-title above no longer
   eats a column) instead of packing to the left with empty space at the
   right — every tab gets an equal share of the available width. */
.topnav-cats{display:flex;align-items:stretch;gap:2px;flex-wrap:wrap;flex:1;}
.topnav-cat{position:relative;flex:1 1 0;min-width:118px;}
/* Administrator sits apart from the main menu order, anchored to the right
   end of the row instead of sharing the equal-width flex distribution the
   other tabs use. */
.topnav-cat-admin{flex:0 0 auto;min-width:0;margin-left:auto;}
.topnav-cat-admin .topnav-cat-btn{padding:12px 16px;}
.topnav-cat-admin .topnav-dropdown{left:auto;right:0;}
.topnav-cat-btn{display:flex;align-items:center;justify-content:center;gap:6px;padding:12px 14px;width:100%;background:none;border:none;cursor:pointer;
  font-family:inherit;font-size:13px;font-weight:700;letter-spacing:.01em;color:var(--text-dim);
  white-space:nowrap;border-bottom:2.5px solid transparent;transition:color .12s,border-color .12s,background .12s;}
.topnav-cat-btn:hover{background:#f4f6fb;}
.topnav-cat-btn:hover{color:var(--navy);}
.topnav-cat.active .topnav-cat-btn{color:var(--navy);border-bottom-color:var(--gold);}
.topnav-cat.open .topnav-cat-btn{color:var(--navy);}
.topnav-cat-chevron{font-size:9px;transition:transform .15s;color:var(--text-faint);}
.topnav-cat.open .topnav-cat-chevron{transform:rotate(180deg);}
.topnav-dropdown{position:absolute;top:100%;left:0;min-width:240px;max-width:320px;max-height:70vh;overflow-y:auto;
  background:var(--card);border:1px solid var(--border);border-radius:0 0 10px 10px;box-shadow:var(--shadow-lg);
  padding:8px;z-index:60;opacity:0;transform:translateY(-6px);pointer-events:none;transition:opacity .16s ease,transform .16s ease;
  scrollbar-width:none;-ms-overflow-style:none;}
.topnav-dropdown::-webkit-scrollbar{display:none;width:0;height:0;}
.topnav-cat.open .topnav-dropdown{opacity:1;transform:translateY(0);pointer-events:auto;}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;color:var(--text);
  cursor:pointer;font-size:13.5px;font-weight:500;margin-bottom:2px;transition:background .12s,color .12s;}
.nav-item:hover{background:#f1f3f9;}
.nav-item.active{background:rgba(201,154,60,.14);color:var(--navy);box-shadow:inset 2px 0 0 var(--gold-2);font-weight:700;}
.nav-item .chip{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;
  font-size:13px;flex:0 0 auto;background:#f1f3f9;}
.nav-section{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-faint);padding:9px 10px 3px;}
.main{flex:1;display:flex;flex-direction:column;min-height:0;}
.content{flex:1;padding:22px 28px 40px;width:100%;}
.fullscreen-toggle{cursor:pointer;}
@media (max-width:640px){
  .topnav-brand .tag{display:none;}
  .topnav-row2 .row2-title span:last-child{display:none;}
}

/* ---------- cards / generic ---------- */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;transition:box-shadow .15s,transform .15s;}
.card h3{margin:0 0 12px;font-size:15.5px;display:flex;align-items:center;gap:8px;}
.page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
.page-head h2{margin:0;font-size:20px;}
.page-head p{margin:2px 0 0;color:var(--text-dim);font-size:13px;}
.grid{display:grid;gap:14px;}
.grid-2{grid-template-columns:repeat(2,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-6{grid-template-columns:repeat(6,1fr);}
@media (max-width:1180px){.grid-6{grid-template-columns:repeat(3,1fr);}}
@media (max-width:900px){.grid-2,.grid-3,.grid-4,.grid-6{grid-template-columns:1fr;}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 16px;border-radius:8px;
  font-size:13.5px;font-weight:600;border:1.5px solid transparent;cursor:pointer;transition:.12s;}
.btn-primary{background:var(--navy);color:#fff;}
.btn-primary:hover{background:#0a1730;}
.btn-gold{background:var(--gold);color:#20200a;}
.btn-gold:hover{background:var(--gold-2);}
.btn-ghost{background:transparent;color:var(--navy);border-color:var(--border-strong);}
.cal-view-toggle{display:inline-flex;border:1px solid var(--border-strong);border-radius:8px;overflow:hidden;}
.cal-view-toggle .btn{border-radius:0;border:none;border-right:1px solid var(--border-strong);}
.cal-view-toggle .btn:last-child{border-right:none;}
.cal-view-toggle .btn.active{background:var(--navy,#0f1f3d);color:#fff;}
.btn-ghost:hover{background:#f1f3f9;}
.btn-danger{background:var(--danger);color:#fff;}
.btn-sm{padding:6px 11px;font-size:12px;border-radius:6px;}
.btn:disabled{opacity:.55;cursor:not-allowed;}

.field{margin-bottom:13px;}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--text-dim);margin-bottom:5px;}
.form-section-heading{font-size:13px;font-weight:700;color:var(--navy);margin:18px 0 10px;padding-bottom:6px;border-bottom:1.5px solid var(--border);}
.form-section-heading:first-child{margin-top:0;}
.input,select.input,textarea.input{width:100%;padding:10px 11px;border:1.5px solid var(--border);border-radius:8px;
  font-size:14px;background:#fbfcfe;font-family:inherit;transition:.12s;}
.input:focus{outline:none;border-color:var(--info);box-shadow:0 0 0 3px rgba(42,99,201,.12);}
textarea.input{resize:vertical;min-height:70px;}

.table-wrap{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:auto;box-shadow:var(--shadow);}
table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{text-align:left;padding:10px 12px;background:#f8f9fc;border-bottom:1.5px solid var(--border);font-weight:700;
  font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-dim);white-space:nowrap;}
td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:top;}
tr:hover td{background:#fafbfd;}
.row-actions{display:flex;gap:6px;white-space:nowrap;}

.badge{display:inline-flex;align-items:center;padding:2.5px 9px;border-radius:99px;font-size:11px;font-weight:700;}
.badge-ok{background:var(--ok-wash);color:var(--ok);}
.badge-warn{background:var(--warn-wash);color:var(--warn);}
.badge-danger{background:var(--danger-wash);color:var(--danger);}
.badge-info{background:var(--info-wash);color:var(--info);}
.badge-neutral{background:#eef0f3;color:var(--text-dim);}

.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:16px;display:flex;align-items:center;gap:13px;position:relative;overflow:hidden;transition:transform .15s,box-shadow .15s;}
.stat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);}
a.stat-card{color:inherit;text-decoration:none;cursor:pointer;}
.stat-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex:0 0 auto;}
.stat-num{font-size:23px;font-weight:800;line-height:1.1;}
.stat-label{font-size:12px;color:var(--text-dim);}
.stat-trend{font-size:11px;font-weight:600;margin-top:2px;}
.stat-trend.up{color:var(--ok);}
.stat-trend.down{color:var(--danger);}
.stat-trend.flat{color:var(--text-faint);}

.stat-card.compact{padding:12px 14px;gap:10px;}
.stat-card.compact .stat-icon{width:36px;height:36px;font-size:16px;border-radius:10px;}
.stat-card.compact .stat-num{font-size:19px;}

.dash-layout{display:flex;align-items:flex-start;gap:16px;}
.dash-main{flex:1;min-width:0;}
.dash-side{width:280px;flex:0 0 280px;display:flex;flex-direction:column;gap:16px;position:sticky;top:16px;}
.news-ticker{width:100%;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:16px;}
.news-ticker h3{margin:0 0 10px;font-size:14.5px;display:flex;align-items:center;gap:8px;}
.news-ticker-viewport{height:360px;overflow:hidden;position:relative;
  -webkit-mask-image:linear-gradient(to bottom, transparent 0, #000 20px, #000 calc(100% - 20px), transparent 100%);
  mask-image:linear-gradient(to bottom, transparent 0, #000 20px, #000 calc(100% - 20px), transparent 100%);}
/* Few enough updates that scrolling isn't needed — natural height, no fade
   mask (nothing being scrolled offscreen), no duplicated/animated track. */
.news-ticker-viewport-auto{height:auto;-webkit-mask-image:none;mask-image:none;}
.news-ticker-track{display:flex;flex-direction:column;animation:ticker-scroll 30s linear infinite;}
.news-ticker-track:hover{animation-play-state:paused;}
.news-ticker-track-static{animation:none;}
.ticker-item{display:block;padding:9px 4px;font-size:12.5px;line-height:1.35;color:var(--text);text-decoration:none;
  border-bottom:1px solid var(--border);white-space:normal;overflow:hidden;text-overflow:ellipsis;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.ticker-item:hover{color:var(--gold,#c99a3c);}
@keyframes ticker-scroll{ from{transform:translateY(0);} to{transform:translateY(-50%);} }
.dash-mini-chart-card{padding:14px;}
.dash-mini-chart-card h3{margin:0 0 8px;font-size:13px;display:flex;align-items:center;gap:6px;}
.dash-mini-chart-wrap{position:relative;height:130px;}
@media (max-width:1180px){ .dash-layout{flex-direction:column;} .dash-side{width:100%;flex:1 1 auto;position:static;} }

.area-chip-row{display:flex;flex-wrap:wrap;gap:8px;}
a.area-chip{color:inherit;text-decoration:none;cursor:pointer;transition:transform .12s;}
a.area-chip:hover{transform:translateY(-1px);}
.area-chip{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:20px;background:var(--card);
  border:1px solid var(--border);font-size:12px;font-weight:600;color:var(--text);}
.area-chip .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;}
.area-chip .n{font-weight:800;}

.section-label{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--text-faint);margin:22px 0 10px;}

.empty{padding:40px 20px;text-align:center;color:var(--text-faint);}
.empty svg{opacity:.4;margin-bottom:10px;}

/* ---------- dashboard: hero / quick actions / progress rings / activity feed ---------- */
.hero{background:linear-gradient(100deg,var(--navy) 0%,#1c2c58 100%);color:#fff;border-radius:12px;
  padding:14px 20px;margin-bottom:14px;position:relative;overflow:hidden;box-shadow:var(--shadow-md);}
.hero::before{content:'';position:absolute;top:-60%;right:-6%;width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle,rgba(201,154,60,.20),transparent 65%);}
.hero-row{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;position:relative;z-index:1;}
.hero-greeting{font-size:17px;font-weight:800;letter-spacing:.2px;}
.hero-sub{font-size:11.5px;color:#b8c1e0;margin-top:2px;}
.hero-quote{font-size:11.5px;color:var(--gold-2,#e0c384);margin-top:5px;font-style:italic;opacity:.95;max-width:560px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.hero-quote .attr{font-style:normal;opacity:.8;color:#c3cbe8;}
.hero-clock{text-align:right;}
.hero-clock .time{font-family:'IBM Plex Mono',monospace;font-size:17px;font-weight:700;}
.hero-clock .date{font-size:11px;color:#b8c1e0;margin-top:1px;}

.quick-actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0;position:relative;z-index:1;}
.qa-btn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;font-size:11.5px;font-weight:600;
  background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.22);cursor:pointer;transition:.15s;}
.qa-btn:hover{background:rgba(255,255,255,.22);transform:translateY(-1px);}

.ring-wrap{display:flex;align-items:center;gap:14px;}
a.ring-wrap{color:inherit;text-decoration:none;cursor:pointer;}
a.ring-wrap:hover .ring-label{text-decoration:underline;}
.ring{width:74px;height:74px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:0 0 auto;position:relative;}
.ring .ring-num{font-size:15px;font-weight:800;color:var(--text);}
.ring-label{font-size:12.5px;font-weight:600;color:var(--text);}

<script>
/* ============================================================
   CONFIG — paste your deployed Apps Script Web App URL below,
   and match APP_KEY / ADMIN_SETUP_KEY to backend/Code.gs exactly.
   ============================================================ */
const DATA_API_URL = 'https://script.google.com/macros/s/AKfycbxCl_KOvuMoln05bxg0PffJzEJP3HdeCjHYs9c2sYr8DMsE-yCZWbckvvpk-a6zhXAJ/exec';
const APP_KEY = 'change-this-to-your-own-random-string-2026';
const APP_NAME = 'FAMS+';
const INSTITUTION_NAME = 'CHRIST (Deemed to be University), Bengaluru';
const DEPARTMENT_NAME = 'Department of Physics and Electronics';

function backendConfigured(){ return typeof DATA_API_URL === 'string' && DATA_API_URL.startsWith('http'); }

/* ============================================================
   API LAYER — plain fetch() calls, no google.script.run. This is
   the single biggest reliability difference from the old build:
   fetch() either gets you real JSON or a real network error, with
   no silent-null failure mode in between.
   ============================================================ */
async function apiGetAll(keys){
  const res = await fetch(DATA_API_URL + '?action=getAll&keys=' + encodeURIComponent(keys.join(',')) + '&key_check=' + encodeURIComponent(APP_KEY));
  if(!res.ok) throw new Error('Backend returned ' + res.status);
  const json = await res.json();
  if(json && json.error) throw new Error(json.error);
  return json.values || {};
}
async function apiSetRaw(key, value){
  const res = await fetch(DATA_API_URL, { method:'POST', body: JSON.stringify({ key, value, appKey: APP_KEY }) });
  if(!res.ok) throw new Error('Backend returned ' + res.status);
  const json = await res.json().catch(()=>({}));
  if(json && json.error) throw new Error(json.error);
  return true;
}
async function apiNotify(type, payload){
  try{
    const res = await fetch(DATA_API_URL, { method:'POST', body: JSON.stringify({ action:'notify', type, payload, appKey: APP_KEY }) });
    const json = await res.json().catch(()=>({}));
    if(!json.ok) console.error('[FAMS+] notification failed:', type, json.error);
    return json;
  }catch(e){ console.error('[FAMS+] notification failed to send (network error):', type, e); return { ok:false, error: String(e) }; }
}
async function apiTestEmail(to){
  const res = await fetch(DATA_API_URL, { method:'POST', body: JSON.stringify({ action:'testEmail', to, appKey: APP_KEY }) });
  return res.json().catch(()=>({ ok:false, error:'Could not parse response' }));
}
async function apiMailMerge(recipients, subject, bodyTemplate){
  const res = await fetch(DATA_API_URL, { method:'POST', body: JSON.stringify({ action:'mailMerge', recipients, subject, bodyTemplate, appKey: APP_KEY }) });
  return res.json().catch(()=>({ ok:false, error:'Could not parse response' }));
}

/* ============================================================
   SMALL UTILITIES
   ============================================================ */
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,9); }
function nowIso(){ return new Date().toISOString(); }
/* IST_OFFSET_MS: FAMS+ is a single-institution app for a faculty member in
   India, so every date/time shown anywhere in the app is fixed to IST
   (GMT+5:30) — regardless of the timezone the browser/device itself is set
   to (a laptop with its clock set to another zone, or this app's own test/
   build environment, should never shift "today" or a timestamp's displayed
   hour). Computed by shifting the UTC instant and reading it back with the
   UTC getters, so it never depends on Intl/timeZone-database support. */
const IST_OFFSET_MS = 5.5 * 3600 * 1000;
function istParts(d){
  const s = new Date((d instanceof Date ? d.getTime() : Date.now()) + IST_OFFSET_MS);
  return { y:s.getUTCFullYear(), mo:s.getUTCMonth(), da:s.getUTCDate(), h:s.getUTCHours(), mi:s.getUTCMinutes(), dow:s.getUTCDay() };
}
function todayStr(){
  const p = istParts(new Date());
  return p.y + '-' + String(p.mo+1).padStart(2,'0') + '-' + String(p.da).padStart(2,'0');
}
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
const MONTH_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONTH_LONG = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const WEEKDAY_LONG = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
/** Formats a plain 'YYYY-MM-DD' date-only string (from a <input type=date>
 *  field) — pure string/number parsing, deliberately never routed through
 *  a Date/timeZone conversion, so it can never be off by a day no matter
 *  what timezone the browser is in. */
function fmtDate(iso){
  if(!iso) return '';
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso);
  if(!m) return iso;
  return Number(m[3]) + ' ' + MONTH_SHORT[Number(m[2])-1] + ' ' + m[1];
}
/** Formats a plain 'HH:MM' (24-hour, from a <input type=time> field) as a
 *  12-hour clock with AM/PM — e.g. '14:30' → '2:30 PM'. Every place the app
 *  DISPLAYS a saved time value (list views, the Timetable grid, Dashboard's
 *  Today's Schedule, exports…) goes through this, so times always read in
 *  12-hour format everywhere, even though the underlying <input type=time>
 *  picker itself still follows the browser/OS's own locale for its native
 *  UI (that part isn't something a web page can override). */
function fmtTime12(hhmm){
  const m = /^(\d{1,2}):(\d{2})/.exec(String(hhmm||''));
  if(!m) return '';
  let h = Number(m[1]);
  const mins = m[2];
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12; if(h === 0) h = 12;
  return h + ':' + mins + ' ' + ampm;
}
/** A plain JS Date's own local year/month/day as a 'YYYY-MM-DD' string —
 *  used by the Calendar screen (which already navigates in local-Date
 *  terms via CAL_CURSOR), as opposed to todayStr()'s fixed-IST "today". */
function fmtIsoDate(d){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
/** Formats a real timestamp (an ISO instant, e.g. createdAt/updatedAt/audit
 *  "at") in IST, 12-hour clock with AM/PM — used everywhere a date+time
 *  (not just a date) is shown. */
function fmtDateTime(iso){
  if(!iso) return '';
  try{
    const d = new Date(iso);
    const p = istParts(d);
    const h12 = p.h % 12 === 0 ? 12 : p.h % 12;
    const ampm = p.h < 12 ? 'AM' : 'PM';
    return String(p.da).padStart(2,'0') + '/' + String(p.mo+1).padStart(2,'0') + '/' + p.y + ', '
      + h12 + ':' + String(p.mi).padStart(2,'0') + ' ' + ampm;
  }catch(e){ return iso; }
}
/** 12-hour "h:mm AM/PM" IST clock string — for the live top-bar clock and
 *  the Dashboard hero clock. */
function fmtClock(d){
  const p = istParts(d || new Date());
  const h12 = p.h % 12 === 0 ? 12 : p.h % 12;
  const ampm = p.h < 12 ? 'AM' : 'PM';
  return h12 + ':' + String(p.mi).padStart(2,'0') + ' ' + ampm;
}
function waLink(phone){
  if(!phone) return '#';
  const digits = String(phone).replace(/\D/g,'');
  return 'https://wa.me/' + (digits.length===10 ? '91'+digits : digits);
}
async function sha256(text){
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function toast(msg, kind){
  const wrap = document.getElementById('toast-wrap');
  const el = document.createElement('div');
  el.className = 'toast' + (kind ? ' '+kind : '');
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(()=>el.remove(), 4200);
}
function closeModal(){ document.getElementById('modal-overlay').classList.add('hidden'); document.getElementById('modal-body').innerHTML=''; }
function openModal(html){ document.getElementById('modal-body').innerHTML = html; document.getElementById('modal-overlay').classList.remove('hidden'); }
// Tracks the deferred "clear the drawer's HTML" timeout from closeDrawer()
// below, so a fast close-then-reopen (e.g. Cancel an edit, then immediately
// click "+ Add" again) can cancel it — otherwise that stale timeout fires
// ~220ms later and wipes out the NEW drawer's content (mid-fill, mid-click)
// instead of the old one, since both share the same #drawer-body element.
let drawerCloseTimeout = null;
function closeDrawer(){
  document.getElementById('drawer-overlay').classList.remove('visible');
  drawerCloseTimeout = setTimeout(()=>{ document.getElementById('drawer-body').innerHTML = ''; drawerCloseTimeout = null; }, 220);
}
function openDrawer(html){
  if(drawerCloseTimeout){ clearTimeout(drawerCloseTimeout); drawerCloseTimeout = null; }
  document.getElementById('drawer-body').innerHTML = html;
  document.getElementById('drawer-overlay').classList.add('visible');
}
/* Re-authentication gate for sensitive one-off actions (editing/deleting
   preserved academic-term history, etc.) — pops a PIN prompt in the modal
   and resolves true only once the entered PIN hashes to STATE.meta.pinHash.
   Cancel / outside-click / Escape all resolve false. */
function confirmWithPin(title, message){
  return new Promise((resolve)=>{
    let settled = false;
    const overlay = document.getElementById('modal-overlay');
    function cleanup(){
      overlay.removeEventListener('click', onOverlay);
      document.removeEventListener('keydown', onKey, true);
    }
    function finish(result){
      if(settled) return;
      settled = true;
      cleanup();
      closeModal();
      resolve(result);
    }
    function onOverlay(e){ if(e.target.id === 'modal-overlay') finish(false); }
    function onKey(e){ if(e.key === 'Escape') finish(false); }
    openModal('<h3>' + escapeHtml(title) + '</h3>'
      + '<p style="font-size:12.5px;color:var(--text-dim);">' + escapeHtml(message) + '</p>'
      + '<div class="field"><label>Enter your PIN to confirm</label>'
      + '<input class="input pin-input" id="confirm-pin-input" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" style="font-size:22px;letter-spacing:10px;"></div>'
      + '<div class="error-box" id="confirm-pin-error" style="display:none;"></div>'
      + '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:6px;">'
      + '<button class="btn btn-ghost btn-sm" id="confirm-pin-cancel" type="button">Cancel</button>'
      + '<button class="btn btn-primary btn-sm" id="confirm-pin-ok" type="button">Confirm</button>'
      + '</div>');
    const input = document.getElementById('confirm-pin-input');
    const errEl = document.getElementById('confirm-pin-error');
    const okBtn = document.getElementById('confirm-pin-ok');
    document.getElementById('confirm-pin-cancel').addEventListener('click', ()=>finish(false));
    overlay.addEventListener('click', onOverlay);
    document.addEventListener('keydown', onKey, true);
    async function attempt(){
      if(okBtn.disabled) return;
      const pin = input.value.trim();
      if(!/^[0-9]{4}$/.test(pin)){ errEl.style.display = 'block'; errEl.textContent = 'Enter your 4-digit PIN.'; return; }
      okBtn.disabled = true;
      try{
        const hash = await sha256(pin);
        if(!STATE.meta || hash !== STATE.meta.pinHash){
          errEl.style.display = 'block'; errEl.textContent = 'Incorrect PIN.';
          input.value = ''; input.focus();
          okBtn.disabled = false;
          return;
        }
        finish(true);
      }catch(e){ errEl.style.display = 'block'; errEl.textContent = 'Something went wrong — try again.'; okBtn.disabled = false; }
    }
    okBtn.addEventListener('click', attempt);
    input.addEventListener('keydown', (e)=>{ if(e.key === 'Enter'){ e.preventDefault(); attempt(); } });
    setTimeout(()=>input.focus(), 30);
  });
}
document.getElementById('modal-overlay').addEventListener('click', e=>{ if(e.target.id==='modal-overlay') closeModal(); });
document.getElementById('drawer-overlay').addEventListener('click', e=>{ if(e.target.id==='drawer-overlay') closeDrawer(); });
document.getElementById('drawer-close-btn').addEventListener('click', closeDrawer);
document.addEventListener('keydown', e=>{
  if(e.key === 'Escape'){
    if(document.getElementById('drawer-overlay').classList.contains('visible')) closeDrawer();
    else if(!document.getElementById('modal-overlay').classList.contains('hidden')) closeModal();
  }
});

/* ============================================================
   LOGO — an inline SVG mark (graduation cap + orbital ring, for
   "faculty" + "physics/electronics") instead of an emoji or a
   static image file, so it's crisp at any size and themeable via
   the gradients below without shipping a separate image asset.
   Gradient ids are suffixed per-call since the mark is embedded
   more than once in the same document (sidebar, login, etc.).
   ============================================================ */
function logoMarkSvg(size, tag){
  const u = 'lg' + (tag || Math.random().toString(36).slice(2,7));
  return '<svg viewBox="0 0 64 64" width="' + size + '" height="' + size + '" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">'
    + '<defs>'
    + '<linearGradient id="' + u + 'bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1c2f5a"/><stop offset="1" stop-color="#08142c"/></linearGradient>'
    + '<linearGradient id="' + u + 'gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f0c674"/><stop offset="1" stop-color="#c99a3c"/></linearGradient>'
    + '<radialGradient id="' + u + 'glow" cx="0.35" cy="0.28" r="0.8"><stop offset="0" stop-color="#3157a0" stop-opacity="0.95"/><stop offset="1" stop-color="#1c2f5a" stop-opacity="0"/></radialGradient>'
    + '</defs>'
    + '<circle cx="32" cy="32" r="32" fill="url(#' + u + 'bg)"/>'
    + '<circle cx="32" cy="32" r="32" fill="url(#' + u + 'glow)"/>'
    + '<ellipse cx="32" cy="34" rx="25" ry="10.5" fill="none" stroke="#7db0ff" stroke-width="2.4" opacity="0.55" transform="rotate(-20 32 34)"/>'
    + '<circle cx="55.7" cy="26.2" r="2.6" fill="#9cc6ff" transform="rotate(-20 32 34)"/>'
    + '<g transform="translate(32,29)">'
    + '<path d="M0 -12 L19.5 -4 L0 4 L-19.5 -4 Z" fill="url(#' + u + 'gold)"/>'
    + '<path d="M-9 -0.6 L-9 8 Q0 13.2 9 8 L9 -0.6 L0 3.2 Z" fill="#f8efd9"/>'
    + '<line x1="19.5" y1="-4" x2="19.5" y2="8" stroke="#e0b558" stroke-width="2"/>'
    + '<circle cx="19.5" cy="9.6" r="2.3" fill="#e0b558"/>'
    + '</g></svg>';
}

let MODULE_KEYS = Object.keys(MODULES);
// Snapshot of every BUILT-IN module's original label, captured before any
// custom modules are registered and before any saved rename is applied —
// this is what Admin & Settings → Menu Names shows as each menu's "default"
// and what a "Reset" restores, and it's also how that list knows which
// modules are built-in (custom menus are already renamed via their own
// Custom Menus editor, so they're deliberately left out of this list).
const DEFAULT_MODULE_LABELS = {};
MODULE_KEYS.forEach(k=>{ DEFAULT_MODULE_LABELS[k] = MODULES[k].label; });
/** Applies one saved rename (Admin & Settings → Menu Names) everywhere that
 *  module's name can show up: the module itself (its page header, form
 *  titles, list-view labels — anything that reads MODULES[key].label);
 *  when it's the ONLY module in its nav group (e.g. Meetings — single-
 *  module groups whose dropdown nav entry displays the MAIN_MENUS group
 *  label instead of the module's own), that MAIN_MENUS entry too; and, for
 *  Work Diary/Calendar/Reports-style modules with their OWN always-visible
 *  top-level nav button, the matching STANDALONE_NAV_SCREENS entry. Callers
 *  still need a full render() (not just renderRoute()) afterwards for the
 *  change to reach the top nav — see wireAdmin's Save Menu Names handler —
 *  since the nav shell itself is only built once at boot. */
function applyModuleLabelOverride(key, newLabel){
  const mod = MODULES[key];
  if(!mod || !newLabel) return;
  mod.label = newLabel;
  const menuEntry = MAIN_MENUS.find(m=>m.key === mod.menu);
  if(menuEntry){
    const modsInGroup = MODULE_KEYS.filter(k=>MODULES[k].menu === mod.menu);
    if(modsInGroup.length === 1 && modsInGroup[0] === key) menuEntry.label = newLabel;
  }
  const standaloneEntry = STANDALONE_NAV_SCREENS.find(s=>s.key === key);
  if(standaloneEntry) standaloneEntry.label = newLabel;
}
/** Re-applies every saved rename from STATE.config.moduleLabelOverrides —
 *  called once after config loads, and again immediately after Admin &
 *  Settings → Menu Names is saved so the change is visible without a
 *  reload. Silently skips any key that no longer exists (e.g. leftover
 *  from a module that isn't registered in this build). */
function applyModuleLabelOverrides(){
  const overrides = (STATE.config && STATE.config.moduleLabelOverrides) || {};
  Object.keys(overrides).forEach(key=>{ if(MODULES[key]) applyModuleLabelOverride(key, overrides[key]); });
}

/* ============================================================
   ADMIN-DEFINABLE CUSTOM MENUS — lets the Admin control add a
   brand-new main menu (with its own fields) from inside the UI,
   with no code changes, per the "additional main menu and
   submenu can be addable in the admin control" requirement.
   Definitions are stored as ordinary records in the 'custom-modules'
   module (itself a normal MODULES entry, so it gets the generic
   add/edit/delete UI for free) and, on load and after every save,
   are compiled into real MODULES/MAIN_MENUS/NAV_CATEGORIES/AREA_COLORS
   entries so the rest of the app treats them exactly like a
   built-in module — isolated from every other module's data/coding,
   per the "other menus should not affect" requirement, since each
   gets its own dedicated storage key.
   ============================================================ */
function slugifyKey(s){
  return String(s || '').trim().toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
}
function customModuleKeyFor(rec){
  const base = slugifyKey(rec.id || '') || Math.random().toString(36).slice(2, 10);
  return 'cm_' + base.slice(0, 20);
}
/** Parses the sub-columns of a custom "subtable" field — a repeating mini-
 *  table embedded in one record (e.g. one row per semester's marks), the
 *  same mechanism In-charges' "Members" and Class Log's "Students" already
 *  use, just made available to admin-defined custom menus too. Comma-
 *  separated sub-column tokens, each "Label" (plain text cell) or
 *  "Label:select:Option A;Option B;Option C" (dropdown cell). */
function parseCustomSubfieldsSpec(text){
  return String(text || '').split(',').map(s=>s.trim()).filter(Boolean).map(tok=>{
    const parts = tok.split(':');
    const label = parts[0].trim();
    const type = (parts[1] || '').trim().toLowerCase();
    const sf = { key: slugifyKey(label) || 'field', label: label };
    if(type === 'select'){
      sf.type = 'select';
      sf.options = (parts[2] || '').split(';').map(o=>o.trim()).filter(Boolean);
      if(!sf.options.length) sf.options = ['Option 1'];
    }
    return sf;
  });
}
/** A fixed-row list like "Sem-1;Sem-2;Sem-3;Sem-4;Sem-5;Sem-6" is easy to
 *  shorthand as "Sem-1;…;Sem-6" when writing instructions — but if that
 *  shorthand ever gets typed into the actual field spec verbatim (instead of
 *  spelled out in full), the "…"/"..." placeholder becomes ITS OWN row label
 *  and every semester in between silently disappears from the form (no row
 *  ever gets rendered for Sem-2..Sem-5, even though marks may already be
 *  saved for them). This expands any "…"/"..." token sitting between two
 *  same-prefix numbered tokens (e.g. "Sem-1" … "Sem-6") into the full
 *  numbered run, so that shorthand — however it ends up in the spec —
 *  behaves the way it reads. */
function expandFixedRowTokens(tokens){
  const ELLIPSIS = /^(…|\.\.\.)$/;
  const out = [];
  for(let i = 0; i < tokens.length; i++){
    const tok = tokens[i];
    if(ELLIPSIS.test(tok) && out.length && i + 1 < tokens.length){
      const prev = out[out.length - 1];
      const next = tokens[i + 1];
      const pm = /^(.*?)(\d+)$/.exec(prev);
      const nm = /^(.*?)(\d+)$/.exec(next);
      if(pm && nm && pm[1] === nm[1]){
        const start = parseInt(pm[2], 10), end = parseInt(nm[2], 10);
        const pad = pm[2].length;
        if(end > start && (end - start) <= 200){
          for(let n = start + 1; n < end; n++) out.push(pm[1] + String(n).padStart(pad, '0'));
          continue; // the placeholder itself is dropped — the run replaces it
        }
      }
    }
    out.push(tok);
  }
  return out;
}
function parseCustomFieldsSpec(text){
  const allowedTypes = ['text','textarea','number','date','datetime','select','email','tel','subtable'];
  const lines = String(text || '').split('\n').map(l=>l.trim()).filter(Boolean);
  const fields = [];
  const seen = {};
  lines.forEach(line=>{
    const parts = line.split('|').map(p=>p.trim());
    const label = parts[0];
    if(!label) return;
    let type = (parts[1] || 'text').toLowerCase();
    if(allowedTypes.indexOf(type) === -1) type = 'text';
    const optionsRaw = parts[2] || '';
    const required = (parts[3] || '').toLowerCase() === 'required';
    let key = slugifyKey(label) || ('field_' + (fields.length + 1));
    if(seen[key]){ seen[key]++; key = key + '_' + seen[key]; } else { seen[key] = 1; }
    const field = { key: key, label: label, type: type };
    if(type === 'select'){ field.options = optionsRaw.split(',').map(o=>o.trim()).filter(Boolean); if(!field.options.length) field.options=['Option 1']; }
    else if(type === 'subtable'){
      field.subfields = parseCustomSubfieldsSpec(optionsRaw);
      if(!field.subfields.length) field.subfields = [{ key:'value', label:'Value' }];
      field.rowLabel = label;
      field.rowLabelPlural = label;
      // A subtable's 4th part is normally "required" (unused for subtables
      // anyway), but here it doubles as an optional FIXED ROW LIST —
      // semicolon-separated row names that always exist, in that order, with
      // no +Add/✕Remove (e.g. "Sem-1;Sem-2;Sem-3;Sem-4;Sem-5;Sem-6" so every
      // record always has exactly one editable slot per semester, instead of
      // someone having to type the semester name freely on a blank row).
      const fixedRowsRaw = parts[3] || '';
      if(fixedRowsRaw && fixedRowsRaw.toLowerCase() !== 'required'){
        field.fixedRows = expandFixedRowTokens(fixedRowsRaw.split(';').map(s=>s.trim()).filter(Boolean));
      }
    }
    if(required) field.required = true;
    fields.push(field);
  });
  return fields;
}
function registerCustomModule(def){
  // Deliberately NOT an "already registered, skip" early-return — editing an
  // existing custom menu's name/icon/category/fields must actually take
  // effect immediately (registerAllCustomModules() is re-run right after
  // every save), not just on the next full page load.
  const dateFieldMatch = def.fields.find(f=>f.type === 'date' || f.type === 'datetime');
  // "Group the list by" — admin types a field Label (e.g. "Batch") and any
  // record sharing that value is clustered under one heading in the list
  // view instead of repeating the value on every row (see moduleTableHtml).
  const groupField = def.groupByKey ? def.fields.find(f=>f.key === def.groupByKey) : null;
  MODULES[def.key] = {
    label: def.label, menu: def.key, icon: def.icon || '🗂️',
    titleField: (def.fields[0] && def.fields[0].key) || 'id',
    dateField: dateFieldMatch ? dateFieldMatch.key : '',
    fields: def.fields,
    groupByField: (groupField && groupField.type !== 'subtable') ? groupField.key : null,
    custom: true
  };
  MODULE_KEYS = Object.keys(MODULES);
  const menuEntry = MAIN_MENUS.find(m=>m.key === def.key);
  if(menuEntry) menuEntry.label = def.label; else MAIN_MENUS.push({ key: def.key, label: def.label });
  if(def.color) AREA_COLORS[def.key] = def.color;
  else if(!AREA_COLORS[def.key]) AREA_COLORS[def.key] = '#6d4aa8';
  // Drop this module's nav entry from every category first, then add it to
  // its (possibly newly-chosen) one — so editing which tab a custom menu
  // lives under actually moves it instead of leaving a stale copy behind.
  NAV_CATEGORIES.forEach(c=>{
    const idx = c.groups.indexOf(def.key);
    if(idx !== -1) c.groups.splice(idx, 1);
  });
  const cat = NAV_CATEGORIES.find(c=>c.key === def.category) || NAV_CATEGORIES.find(c=>c.key === 'tools');
  if(cat) cat.groups.push(def.key);
}
function registerAllCustomModules(){
  getActive('custom-modules').forEach(rec=>{
    try{
      const key = customModuleKeyFor(rec);
      const fields = parseCustomFieldsSpec(rec.fieldsSpec);
      if(!fields.length) fields.push({ key:'details', label:'Details', type:'textarea' });
      const groupByKey = rec.groupByLabel ? slugifyKey(rec.groupByLabel) : null;
      registerCustomModule({ key: key, label: rec.label || 'Custom Menu', icon: rec.icon || '🗂️', category: rec.category || 'tools', fields: fields, groupByKey: groupByKey });
    }catch(e){ console.error('[FAMS+] failed to register custom module', rec, e); }
  });
}

/* ============================================================
   APP STATE & DATA LAYER
   ------------------------------------------------------------
   STATE.data[moduleKey] holds the module's full record array,
   loaded once at boot via a single apiGetAll() call (one sheet
   read on the backend, not one round trip per module). Every
   write goes straight back to the backend (JSON.stringify the
   whole array under that module's key) AND updates STATE.data
   in place, so the UI never has to re-fetch to see its own
   change reflected.
   ============================================================ */
const STATE = { meta:null, config:null, data:{}, loaded:false };

function getCollection(key){ return STATE.data[key] || []; }
function getActive(key){ return getCollection(key).filter(r=>!r.deleted); }
function getRecord(key, id){ return getCollection(key).find(r=>r.id===id) || null; }

function defaultConfig(){
  return { academicYear:'', semester:'', termStartDate:'', termEndDate:'', digestHour:7, backupHour:23, migratedLegacyMembers:false, migratedMentoringIntoIncharges:false, academicTermHistory:[], moduleLabelOverrides:{} };
}

/** Once Academic Year / Semester is set (Admin & Settings → Academic Term),
 *  this shows up everywhere that names the current term — the top navigation
 *  bar, the Dashboard, and every generated report — instead of only living
 *  on the one settings screen. Returns '' until it's actually set. */
function academicTermLabel(){
  const cfg = STATE.config || {};
  const year = (cfg.academicYear || '').trim();
  const sem = (cfg.semester || '').trim();
  if(!year && !sem) return '';
  if(year && sem) return 'AY ' + year + ' · ' + sem;
  return year ? ('AY ' + year) : sem;
}

// The topnav shell is only built once at app boot (renderShellSkeleton()), so
// when the Academic Year/Semester is changed in Admin & Settings the topnav
// tagline needs an explicit in-place refresh rather than a full shell re-render.

/** One-time data migration: In-charges/Members, Committees/Committee members
 *  and Responsibilities/Contacts used to be two separate top-level modules
 *  linked by a reference field — now each "members" list lives as an
 *  embedded subtable field directly on its parent record instead (see the
 *  'subtable' field type). This folds any old separately-stored child
 *  records into their parent's new subtable field, then clears the old
 *  storage key. Guarded by STATE.config.migratedLegacyMembers so it only
 *  ever does real work once per install — every load after that is a
 *  single cheap boolean check, not three extra network round trips. */
const LEGACY_SUBTABLE_MIGRATIONS = [
  { oldKey:'incharge-members', parentKey:'incharge-roles', parentRefField:'roleId', subtableField:'members',
    map:(m)=>({ studentName:m.studentName||'', regNo:m.regNo||'', batch:'', classSection:'', email:m.email||'', phone:m.phone||'', progressStatus:m.progressStatus||'' }) },
  { oldKey:'committee-members', parentKey:'committees', parentRefField:'committeeId', subtableField:'members',
    map:(m)=>({ name:m.name||'', role:m.role||'', email:m.email||'', phone:m.phone||'' }) },
  { oldKey:'responsibility-contacts', parentKey:'responsibilities', parentRefField:'responsibilityId', subtableField:'contacts',
    map:(m)=>({ name:m.name||'', regNo:m.regNo||'', batch:'', email:m.email||'', phone:m.phone||'' }) }
];
async function migrateLegacySubtableModules(){
  let oldValues;
  try{ oldValues = await apiGetAll(LEGACY_SUBTABLE_MIGRATIONS.map(l=>l.oldKey)); }
  catch(e){ return; } // offline/backend hiccup — skip for now, retried on the next load since the flag isn't set yet
  for(const legacy of LEGACY_SUBTABLE_MIGRATIONS){
    let oldRecords = [];
    try{ oldRecords = oldValues[legacy.oldKey] ? JSON.parse(oldValues[legacy.oldKey]) : []; }
    catch(e){ oldRecords = []; }
    const activeOld = oldRecords.filter(r=>!r.deleted);
    if(activeOld.length === 0) continue;
    const parentArr = (STATE.data[legacy.parentKey] || []).slice();
    let changed = false;
    activeOld.forEach(child=>{
      const parentIdx = parentArr.findIndex(p=>p.id === child[legacy.parentRefField]);
      if(parentIdx === -1) return; // orphaned child (parent since deleted) — nothing sane to attach it to
      const parent = parentArr[parentIdx];
      const existingRows = Array.isArray(parent[legacy.subtableField]) ? parent[legacy.subtableField] : [];
      parentArr[parentIdx] = Object.assign({}, parent, { [legacy.subtableField]: existingRows.concat([legacy.map(child)]) });
      changed = true;
    });
    if(changed) await saveCollection(legacy.parentKey, parentArr);
    await apiSetRaw(legacy.oldKey, JSON.stringify([])); // clear so it can never double-migrate
  }
}

/** One-time data migration: Mentees, Mentoring Meetings, and Responsibilities
 *  no longer have their own nav entries — In-Charges (roleName + a "members"
 *  subtable) already covers exactly the same shape ("a role, with a roster
 *  of people attached to it"), so a separate Mentees/Responsibilities module
 *  was redundant. Every active Responsibilities record becomes its own
 *  In-Charges record (its contacts become that record's members); every
 *  active Mentee becomes a member row on one combined "Student Mentoring"
 *  In-Charges record. Guarded by STATE.config.migratedMentoringIntoIncharges
 *  so it only ever does real work once per install. Mentoring Meetings has
 *  no equivalent shape to fold into (it's a dated log, not a roster) — its
 *  data is simply left in place, unreachable from the nav but still present
 *  in a full JSON backup, rather than being force-migrated somewhere it
 *  doesn't belong. */
async function migrateMentoringAndResponsibilitiesIntoIncharges(){
  let oldValues;
  try{ oldValues = await apiGetAll(['responsibilities','mentees']); }
  catch(e){ return; } // offline/backend hiccup — retried on the next load since the flag isn't set yet
  let responsibilities = [], mentees = [];
  try{ responsibilities = oldValues['responsibilities'] ? JSON.parse(oldValues['responsibilities']) : []; }catch(e){ responsibilities = []; }
  try{ mentees = oldValues['mentees'] ? JSON.parse(oldValues['mentees']) : []; }catch(e){ mentees = []; }
  const activeResp = responsibilities.filter(r=>!r.deleted);
  const activeMentees = mentees.filter(m=>!m.deleted);
  if(activeResp.length === 0 && activeMentees.length === 0) return;

  const inchargeArr = (STATE.data['incharge-roles'] || []).slice();
  const stamp = nowIso();
  const makeRecord = (roleName, members)=>({
    id: uid(), roleName: roleName, durationType:'Ongoing', startDate:'', endDate:'', status:'Active',
    members: members, notes: [], deleted:false, createdAt: stamp, updatedAt: stamp
  });

  activeResp.forEach(rec=>{
    const roleName = [rec.title || 'Responsibility', rec.classSection].filter(Boolean).join(' — ');
    const members = (Array.isArray(rec.contacts) ? rec.contacts : []).map(c=>({
      studentName: c.name || '', regNo: c.regNo || '', batch: c.batch || '', classSection: rec.classSection || '',
      email: c.email || '', phone: c.phone || '', progressStatus: ''
    }));
    inchargeArr.push(makeRecord(roleName, members));
  });

  if(activeMentees.length > 0){
    const members = activeMentees.map(m=>({
      studentName: m.name || '', regNo: m.regNo || '', batch: m.semester || '', classSection: m.program || '',
      email: m.email || '', phone: m.phone || '', progressStatus: ''
    }));
    inchargeArr.push(makeRecord('Student Mentoring', members));
  }

  await saveCollection('incharge-roles', inchargeArr);
  if(activeResp.length) await apiSetRaw('responsibilities', JSON.stringify([]));
  if(activeMentees.length) await apiSetRaw('mentees', JSON.stringify([]));
}

async function loadAllData(){
  const keys = MODULE_KEYS.concat(['app-meta','app-config']);
  let values = await apiGetAll(keys);
  // 'custom-modules' (a built-in module) is fetched above. Parse it first and
  // compile its records into real MODULES entries so their own storage keys
  // (e.g. 'cm_xxxx') exist before the rest of the load — then fetch those
  // newly-discovered keys in one extra round trip (only when any exist).
  try{ STATE.data['custom-modules'] = values['custom-modules'] ? JSON.parse(values['custom-modules']) : []; }
  catch(e){ STATE.data['custom-modules'] = []; }
  registerAllCustomModules();
  const customKeys = MODULE_KEYS.filter(k => MODULES[k].custom && values[k] === undefined);
  if(customKeys.length){
    const moreValues = await apiGetAll(customKeys);
    values = Object.assign(values, moreValues);
  }
  MODULE_KEYS.forEach(k=>{
    try{ STATE.data[k] = values[k] ? JSON.parse(values[k]) : []; }
    catch(e){ STATE.data[k] = []; }
  });
  try{ STATE.meta = values['app-meta'] ? JSON.parse(values['app-meta']) : null; }
  catch(e){ STATE.meta = null; }
  try{ STATE.config = values['app-config'] ? Object.assign(defaultConfig(), JSON.parse(values['app-config'])) : defaultConfig(); }
  catch(e){ STATE.config = defaultConfig(); }
  if(STATE.meta && !STATE.config.migratedLegacyMembers){
    await migrateLegacySubtableModules();
    STATE.config.migratedLegacyMembers = true;
    await saveConfig();
  }
  if(STATE.meta && !STATE.config.migratedMentoringIntoIncharges){
    await migrateMentoringAndResponsibilitiesIntoIncharges();
    STATE.config.migratedMentoringIntoIncharges = true;
    await saveConfig();
  }
  // "Start New Term" used to re-archive the same term every time it was
  // clicked without changing the Academic Year/Semester fields first,
  // producing repeated identical rows under "Previous terms". Collapse any
  // exact-duplicate entries already saved from that, once, on load — the
  // guard against creating new ones going forward lives in wireAdmin's
  // adm-new-term handler.
  if(STATE.meta && STATE.config.academicTermHistory && STATE.config.academicTermHistory.length){
    const seen = new Set();
    const deduped = STATE.config.academicTermHistory.filter(t=>{
      const sig = [t.academicYear||'', t.semester||'', t.startDate||'', t.endDate||''].join('|');
      if(seen.has(sig)) return false;
      seen.add(sig);
      return true;
    });
    if(deduped.length !== STATE.config.academicTermHistory.length){
      STATE.config.academicTermHistory = deduped;
      await saveConfig();
    }
  }
  applyModuleLabelOverrides();
  STATE.loaded = true;
}

async function saveCollection(key, arr){
  STATE.data[key] = arr;
  await apiSetRaw(key, JSON.stringify(arr));
}
async function saveMeta(){ await apiSetRaw('app-meta', JSON.stringify(STATE.meta)); }
async function saveConfig(){ await apiSetRaw('app-config', JSON.stringify(STATE.config)); }

async function createRecord(moduleKey, data){
  const arr = getCollection(moduleKey).slice();
  const rec = Object.assign({ id: uid(), createdAt: nowIso(), updatedAt: nowIso(), notes: [], deleted:false }, data);
  arr.push(rec);
  await saveCollection(moduleKey, arr);
  if(AUTO_WORK_DIARY_SOURCES[moduleKey]) await syncAutoWorkDiaryEntry(moduleKey, rec);
  return rec;
}
async function updateRecord(moduleKey, id, patch){
  const arr = getCollection(moduleKey).slice();
  const idx = arr.findIndex(r=>r.id===id);
  if(idx===-1) throw new Error('Record not found');
  arr[idx] = Object.assign({}, arr[idx], patch, { updatedAt: nowIso() });
  await saveCollection(moduleKey, arr);
  if(AUTO_WORK_DIARY_SOURCES[moduleKey]) await syncAutoWorkDiaryEntry(moduleKey, arr[idx]);
  return arr[idx];
}
async function softDeleteRecord(moduleKey, id){ return updateRecord(moduleKey, id, { deleted:true }); }
async function restoreRecord(moduleKey, id){ return updateRecord(moduleKey, id, { deleted:false }); }
async function purgeRecord(moduleKey, id){
  const arr = getCollection(moduleKey).filter(r=>r.id!==id);
  await saveCollection(moduleKey, arr);
  // Purging (permanently deleting) a source record shouldn't leave its
  // auto-logged Work Diary entry orphaned behind it.
  if(AUTO_WORK_DIARY_SOURCES[moduleKey]){
    const tag = moduleKey + ':' + id;
    const existing = getCollection('work-diary').find(w=>w.autoSource === tag);
    if(existing) await purgeRecord('work-diary', existing.id);
  }
}

/* ============================================================
   AUTO WORK DIARY — Timetable-derived Class Log entries, Meetings,
   Invigilation Duty, Extra/Additional Classes, Lab Exams and Research
   Events all already carry (or can derive) a real duration for a real
   date; rather than making the faculty member re-type the same day's
   work a second time into the Work Diary, a linked entry is kept in
   sync there automatically. See AUTO_WORK_DIARY_SOURCES / syncAutoWorkDiaryEntry.
   ============================================================ */
const AUTO_WORK_DIARY_SOURCES = {
  'class-log': {
    category: 'Teaching',
    hours: (rec)=>{
      if(rec.status !== 'Held') return 0;
      let hrs = parseFloat(rec.durationHours) || 0;
      if(!hrs && rec.date){
        const dow = DOW_NAMES3[new Date(rec.date + 'T00:00:00').getDay()];
        const t = getActive('timetable').find(t=>t.subject===rec.subject && t.subjectCode===rec.subjectCode && t.day===dow);
        if(t) hrs = timeRangeHours(t.startTime, t.endTime);
      }
      return hrs;
    },
    summary: (rec)=>'Class held: ' + (rec.subject||'') + (rec.subjectCode?(' ('+rec.subjectCode+')'):'') + (rec.topic?(' — '+rec.topic):'')
  },
  'meetings': {
    category: 'Committee/Meeting',
    hours: (rec)=>computedDurationHours(rec),
    summary: (rec)=>'Meeting: ' + (rec.title||'')
  },
  'invigilation-duties': {
    category: 'Admin/In-Charge',
    hours: (rec)=>computedDurationHours(rec),
    summary: (rec)=>'Invigilation duty: ' + (rec.examName||'')
  },
  'extra-classes': {
    category: 'Teaching',
    hours: (rec)=>computedDurationHours(rec),
    summary: (rec)=>(rec.type||'Extra Class') + ': ' + (rec.subject||'') + (rec.subjectCode?(' ('+rec.subjectCode+')'):'')
  },
  'lab-exams': {
    category: 'Teaching',
    hours: (rec)=>computedDurationHours(rec),
    summary: (rec)=>'Lab exam: ' + (rec.labCourse||'')
  },
  'research-events': {
    category: 'Research',
    hours: (rec)=>computedDurationHours(rec),
    summary: (rec)=>'Research event: ' + (rec.eventName||'')
  }
};
/** Creates, updates, or removes the auto-logged Work Diary entry linked to
 *  one source record. Matches an existing auto entry by its hidden
 *  `autoSource` tag ('<moduleKey>:<id>') rather than by date/summary, so
 *  editing the record (even changing its date) updates that SAME Work
 *  Diary row instead of leaving a stale one behind. A deleted source
 *  record, one with no computable hours yet (e.g. a Class Log row not yet
 *  marked Held, or an empty Duration field), or one with no date, is
 *  treated as "nothing to log" and any existing auto entry is removed. */
async function syncAutoWorkDiaryEntry(moduleKey, rec){
  const src = AUTO_WORK_DIARY_SOURCES[moduleKey];
  if(!src || !rec) return;
  const mod = MODULES[moduleKey];
  const date = mod.dateField ? rec[mod.dateField] : '';
  const hrs = rec.deleted ? 0 : (parseFloat(src.hours(rec)) || 0);
  const tag = moduleKey + ':' + rec.id;
  const existing = getCollection('work-diary').find(w=>w.autoSource === tag);
  if(!date || !hrs){
    if(existing) await purgeRecord('work-diary', existing.id);
    return;
  }
  const patch = { date: date, category: src.category, summary: src.summary(rec), hoursSpent: Math.round(hrs*100)/100, autoSource: tag };
  if(existing) await updateRecord('work-diary', existing.id, patch);
  else await createRecord('work-diary', patch);
}

/* ============================================================
   ACTIVITY LOG — a lightweight, append-only audit trail. Every
   create/update/delete/restore/purge/email-sent action across every
   module writes one entry here (bypassing createRecord so the log
   never logs its own writes). Viewable read-only under Tools →
   Activity Log, and included automatically in Reports since it's
   just another entry in MODULE_KEYS.
   ============================================================ */
const AUDIT_LOG_MAX_ENTRIES = 2000;
async function logAudit(moduleKey, action, recordId, recordTitle, details){
  if(moduleKey === 'audit-log') return; // never log writes to the log itself
  try{
    const arr = getCollection('audit-log').slice();
    arr.push({
      id: uid(), createdAt: nowIso(), updatedAt: nowIso(), notes: [], deleted: false,
      action: action,
      at: nowIso(),
      moduleLabel: (MODULES[moduleKey] && MODULES[moduleKey].label) || moduleKey,
      recordTitle: recordTitle || '(untitled)',
      actor: (STATE.meta && STATE.meta.facultyName) || '',
      details: details || ''
    });
    const trimmed = arr.length > AUDIT_LOG_MAX_ENTRIES ? arr.slice(arr.length - AUDIT_LOG_MAX_ENTRIES) : arr;
    await saveCollection('audit-log', trimmed);
  }catch(e){ console.error('[FAMS+] activity log write failed:', e); }
}

async function addNote(moduleKey, id, text){
  const arr = getCollection(moduleKey).slice();
  const idx = arr.findIndex(r=>r.id===id);
  if(idx===-1) return;
  const notes = (arr[idx].notes || []).slice();
  notes.push({ id: uid(), text, at: nowIso() });
  arr[idx] = Object.assign({}, arr[idx], { notes, updatedAt: nowIso() });
  await saveCollection(moduleKey, arr);
}

/** Resolves a 'reference' field's value (a record id in another module) to
 *  a human-readable label using that module's titleField. */
function refLabel(moduleKey, id){
  if(!id) return '';
  const rec = getRecord(moduleKey, id);
  if(!rec) return '(deleted)';
  const mod = MODULES[moduleKey];
  return rec[mod.titleField] || '(untitled)';
}

/** Modules that shouldn't appear as link targets in the "Related To" menu
 *  picker (internal registries, not day-to-day records). */
const POLYREF_EXCLUDED_MODULES = { 'custom-modules':1, 'audit-log':1 };
/** "Related To — Menu" only ever makes sense pointed at something that's
 *  actually a specific record to attach a Meeting/Reminder to — a student, a
 *  committee, a role, a project — not at every menu in the app (nobody
 *  relates a meeting to "a Reminder" or "a Holiday"). So the picker is
 *  limited to: whatever lives under the Roles & Responsibilities menu
 *  (In-charges, Committees — read from NAV_CATEGORIES itself so a future
 *  addition there is picked up automatically, not hardcoded here), plus any
 *  admin-created custom menu (UG Research, PG Research, Grants, … — each its
 *  own "other menu name", registered wherever the admin chose to put it). */
function polyrefTargetModules(){
  const rolesGroups = (NAV_CATEGORIES.find(c => c.key === 'admin-duties') || { groups: [] }).groups;
  return MODULE_KEYS.filter(k => !POLYREF_EXCLUDED_MODULES[k]
    && (rolesGroups.indexOf(MODULES[k].menu) !== -1 || MODULES[k].custom));
}
/** `<option>`s listing a module's active records, for a 'recordRef' field's
 *  cascading dropdown (populated once a 'moduleRef' sibling field is chosen). */
function recordOptionsHtml(moduleKey, selectedId){
  const m = MODULES[moduleKey];
  if(!m) return '';
  return getActive(moduleKey).map(r=>'<option value="' + r.id + '"' + (r.id === selectedId ? ' selected' : '') + '>'
    + escapeHtml(r[m.titleField] || '(untitled)') + '</option>').join('');
}

/* ============================================================
   AUTH — a single-faculty app, so "auth" is just: has a PIN been
   set (first-run), and does the PIN typed in match it. The signed-in
   state is held in a plain in-memory flag (NOT persisted to
   localStorage) so that opening the app — a fresh page load, a PWA
   relaunch, a browser restart — always lands on the PIN screen first,
   every time, rather than silently skipping straight to the last
   screen because an old session was still "valid". Once unlocked for
   this page load, in-app navigation (hash changes) keeps working
   without re-prompting, since that's still the same running page.
   ============================================================ */
let SESSION_ACTIVE = false;
const PIN_FAIL_KEY = 'fams_pin_fails';
const PIN_LOCK_KEY = 'fams_pin_lock_until';
const PIN_MAX_FAILS = 5;
const PIN_LOCK_MINUTES = 5;

function isAuthed(){ return SESSION_ACTIVE; }
function startSession(){ SESSION_ACTIVE = true; }
function endSession(){ SESSION_ACTIVE = false; }

function pinLocked(){ return Number(localStorage.getItem(PIN_LOCK_KEY) || 0) > Date.now(); }
function pinLockRemainingSec(){ return Math.max(0, Math.ceil((Number(localStorage.getItem(PIN_LOCK_KEY) || 0) - Date.now())/1000)); }
function registerPinFail(){
  const fails = Number(localStorage.getItem(PIN_FAIL_KEY) || 0) + 1;
  if(fails >= PIN_MAX_FAILS){
    localStorage.setItem(PIN_LOCK_KEY, String(Date.now() + PIN_LOCK_MINUTES*60000));
    localStorage.setItem(PIN_FAIL_KEY, '0');
  }else{
    localStorage.setItem(PIN_FAIL_KEY, String(fails));
  }
}
function clearPinFails(){ localStorage.removeItem(PIN_FAIL_KEY); localStorage.removeItem(PIN_LOCK_KEY); }

async function doFirstRunSetup(name, email, phone, pin){
  const pinHash = await sha256(pin);
  STATE.meta = { facultyName: name, email: email, phone: phone || '', pinHash: pinHash, setupAt: nowIso() };
  await saveMeta();
  startSession();
}
async function doLogin(pin){
  if(pinLocked()) throw new Error('Too many attempts. Try again in ' + Math.ceil(pinLockRemainingSec()/60) + ' min.');
  if(!STATE.meta) throw new Error('Not set up yet.');
  const hash = await sha256(pin);
  if(hash !== STATE.meta.pinHash){
    registerPinFail();
    throw new Error('Incorrect PIN.');
  }
  clearPinFails();
  startSession();
}
async function doChangePin(oldPin, newPin){
  const oldHash = await sha256(oldPin);
  if(oldHash !== STATE.meta.pinHash) throw new Error('Current PIN is incorrect.');
  STATE.meta.pinHash = await sha256(newPin);
  await saveMeta();
}
function doLogout(){ endSession(); location.hash = ''; render(); }

   ROUTER
   ============================================================ */
const SPECIAL_SCREENS = { dashboard:'📊', 'work-diary':'📔', analytics:'📈', reports:'📤', calendar:'🗓️', admin:'⚙️', 'mail-merge':'✉️' };

/* Area accent colours — one per functional zone (mirrors the --a-* CSS
   custom properties in :root) so the sidebar, dashboard stat cards and
   analytics all read as distinct "colour families" instead of one flat
   navy-and-gold palette everywhere. Kept as plain hex here (rather than
   referencing the CSS vars) so call sites can cheaply append an alpha
   suffix like color+'22' for tinted backgrounds. */
const AREA_COLORS = {
  dashboard:'#c99a3c', 'work-diary':'#7c5cbf', teaching:'#2a63c9', 'leave-holidays':'#0d9488', exams:'#7c3aed',
  mentoring:'#0891b2', 'extra-classes':'#d97706', research:'#059669',
  projects:'#c99a3c', incharge:'#dc2626', committees:'#ea580c', meetings:'#4f46e5', 'action-items':'#6d5bd0',
  reminders:'#db2777', 'office-followups':'#a8386d', responsibilities:'#0f766e', analytics:'#6fa3f5', reports:'#8a92a6',
  calendar:'#4f46e5', admin:'#9aa4c2', 'audit-log':'#64748b', 'custom-modules':'#6d4aa8', 'mail-merge':'#c2410c'
};

/* Sidebar menus clubbed into broad categories (collapsible accordions) so
   the ~18 menu groups read as ~6 sections instead of one long flat list.
   Dashboard, Work Diary, and Calendar are deliberately NOT in any of these
   dropdown categories — they're promoted to their own standalone top-level
   buttons (see topNavCatsHtml()) since they're used every day and don't
   belong behind a dropdown click. Leave & Holidays, Meetings, Action Items,
   Reminders, and Office Follow-ups are likewise absent from the top nav
   entirely — reached only via the Dashboard's quick-add buttons and deep
   links (see STANDALONE_NAV_SCREENS' comment / DASH_QUICKADD_MODULE_KEYS). */
const NAV_CATEGORIES = [
  // Laboratory is deliberately not its own group — Lab timetable joins
  // Teaching (alongside the regular Timetable) and Lab exams joins Exams
  // (alongside Invigilation duty), rather than having its own separate
  // "Laboratory" section in the dropdown.
  { key:'academics', label:'Academics', icon:'📘', groups:['teaching','exams','extra-classes'] },
  { key:'research', label:'Research', icon:'🔬', groups:['research','projects'] },
  // Students + Administrative Duties combined into one "Responsibilities" category.
  // Mentoring (Mentees, Mentoring Meetings) and Responsibilities (Class
  // Teacher) are deliberately absent — In-Charges already covers "a role
  // with a roster of people attached" (see migrateMentoringAndResponsibilitiesIntoIncharges()),
  // so adding a role there is now the single place for what these used to be.
  { key:'admin-duties', label:'Roles & Responsibilities', icon:'📋', groups:['incharge','committees'] },
  { key:'tools', label:'Administrator', icon:'⚙️', groups:['analytics','audit-log','custom-modules','mail-merge','admin'] }
];

/* Screens promoted to their own always-visible top-level nav button rather
   than living behind a dropdown click — Dashboard, Work Diary, Calendar
   (all used every day) and Reports (a frequently-needed export/print
   destination). `kind:'module'` links straight to that module's own screen
   (#/module/<key>); `kind:'screen'` links to a special, non-module screen
   (#/<key>).
   Meetings, Action Items, Reminders, Office Follow-ups, and Leave/OD +
   Holidays are deliberately NOT in the top nav at all (Leave & Holidays
   used to be its own dropdown category; Meetings etc. used to be their own
   standalone buttons, which pushed the nav row onto two lines) — all of
   them are reached instead via the "quick add" buttons on the Dashboard's
   hero banner (same place as Log Work Diary / Add Class), plus deep links
   from the Dashboard's stat cards / Overdue / Today / Upcoming rows once a
   record exists. */
const STANDALONE_NAV_SCREENS = [
  { key:'dashboard', label:'Dashboard', icon:'🏠', kind:'screen' },
  { key:'work-diary', label:'Work diary', icon:'📔', kind:'module' },
  { key:'calendar', label:'Calendar', icon:'🗓️', kind:'screen' },
  { key:'reports', label:'Reports', icon:'📤', kind:'screen' }
];

/* Left-to-right order of the main nav row: Dashboard, Work Diary, Calendar
   (daily-use standalone buttons), then the dropdown categories, then
   Reports. Administrator ("tools") is deliberately excluded here — it's
   rendered separately, anchored to the far right of the row (see
   topNavCatsHtml()), since it's an admin-control button rather than an
   everyday-use menu item. Kept short and single-line on purpose — see the
   STANDALONE_NAV_SCREENS comment above for why Leave & Holidays / Meetings/
   Action Items/Reminders/Office Follow-ups aren't here. */
const NAV_MAIN_ORDER = [
  { type:'standalone', key:'dashboard' },
  { type:'standalone', key:'work-diary' },
  { type:'standalone', key:'calendar' },
  { type:'category', key:'academics' },
  { type:'category', key:'research' },
  { type:'category', key:'admin-duties' },
  { type:'standalone', key:'reports' }
];
const NAV_ADMIN_CATEGORY_KEY = 'tools';

function parseRoute(){
  const h = (location.hash || '#/dashboard').replace(/^#\/?/, '');
  const parts = h.split('/').filter(Boolean);
  if(parts[0] === 'module' && parts[1]) return { screen:'module', moduleKey:parts[1] };
  if(parts[0] && (SPECIAL_SCREENS[parts[0]] || ['analytics','reports','calendar','admin','dashboard'].indexOf(parts[0])!==-1)) return { screen:parts[0] };
  return { screen:'dashboard' };
}
function isModuleRoute(key){ const r = parseRoute(); return r.screen==='module' && r.moduleKey===key; }
function isScreenRoute(key){ const r = parseRoute(); return r.screen===key; }
function navigate(href){ location.hash = href; }

/* ============================================================
   BOOT / TOP-LEVEL RENDER
   ============================================================ */
const ROOT = document.getElementById('root');
let clockTimer = null;

async function boot(){
  if(!backendConfigured()){ ROOT.innerHTML = renderSetupNeededScreen(); return; }
  try{
    await loadAllData();
  }catch(e){
    ROOT.innerHTML = renderLoadErrorScreen(e);
    const btn = document.getElementById('retry-load-btn');
    if(btn) btn.addEventListener('click', boot);
    return;
  }
  window.addEventListener('hashchange', render);
  render();
}

function render(){
  if(!STATE.meta){ ROOT.innerHTML = renderFirstRunScreen(); wireFirstRunScreen(); return; }
  if(!isAuthed()){ ROOT.innerHTML = renderLoginScreen(); wireLoginScreen(); return; }
  ROOT.innerHTML = renderShellSkeleton();
  wireShell();
  renderRoute();
  startClock();
}

function startClock(){
  if(clockTimer) clearInterval(clockTimer);
  const tick = ()=>{
    const el = document.getElementById('live-clock');
    if(!el){ clearInterval(clockTimer); return; }
    const now = new Date();
    const p = istParts(now);
    el.textContent = WEEKDAY_LONG[p.dow].slice(0,3) + ', ' + String(p.da).padStart(2,'0') + ' ' + MONTH_SHORT[p.mo] + ', ' + fmtClock(now);
    const heroClock = document.getElementById('hero-clock');
    if(heroClock) heroClock.textContent = fmtClock(now);
  };
  tick();
  clockTimer = setInterval(tick, 30000);
}

function renderRoute(){
  const r = parseRoute();
  const content = document.getElementById('content');
  const titleEl = document.getElementById('topbar-title');
  if(r.screen === 'module'){
    const mod = MODULES[r.moduleKey];
    if(!mod){ content.innerHTML = '<div class="empty">Unknown module.</div>'; return; }
    titleEl.textContent = mod.label;
    if(r.moduleKey === 'timetable'){
      content.innerHTML = renderTimetableScreen();
      wireTimetableScreen();
    }else{
      content.innerHTML = renderModuleList(r.moduleKey);
      wireModuleList(r.moduleKey);
    }
  }else if(r.screen === 'dashboard'){
    titleEl.textContent = 'Dashboard';
    content.innerHTML = renderDashboard();
    wireDashboard();
  }else if(r.screen === 'analytics'){
    titleEl.textContent = 'Analytics';
    content.innerHTML = renderAnalytics();
    wireAnalytics();
  }else if(r.screen === 'reports'){
    titleEl.textContent = 'Reports';
    content.innerHTML = renderReports();
    wireReports();
  }else if(r.screen === 'calendar'){
    titleEl.textContent = 'Calendar';
    content.innerHTML = renderCalendar();
  }else if(r.screen === 'admin'){
    titleEl.textContent = 'Admin & settings';
    content.innerHTML = renderAdmin();
    wireAdmin();
  }else if(r.screen === 'mail-merge'){
    titleEl.textContent = 'Mail merge';
    content.innerHTML = renderMailMergeScreen();
    wireMailMergeScreen();
  }else{
    titleEl.textContent = 'Dashboard';
    content.innerHTML = renderDashboard();
    wireDashboard();
  }
}

/* ============================================================
   APP SHELL — horizontal top navigation (built from MAIN_MENUS +
   MODULES): a brand/utility row, then a row of category tabs that
   each open a dropdown of that category's modules. Replaces the
   earlier left sidebar — much better on narrow/touch screens, and
   there's no permanent vertical menu competing with page content.
   ============================================================ */
function navItemHtml(icon, label, href, active, color){
  const style = color ? ' style="background:' + color + '38;"' : '';
  return '<div class="nav-item' + (active ? ' active' : '') + '" data-href="' + href + '"><span class="chip"' + style + '>' + icon + '</span><span>' + escapeHtml(label) + '</span></div>';
}
function navGroupHtml(group){
  const color = AREA_COLORS[group.key];
  if(SPECIAL_SCREENS[group.key] && group.key !== 'work-diary'){
    return navItemHtml(SPECIAL_SCREENS[group.key], group.label, '#/' + group.key, isScreenRoute(group.key), color);
  }
  const mods = MODULE_KEYS.filter(k => MODULES[k].menu === group.key);
  if(mods.length === 1 && mods[0] === group.key){
    const m = MODULES[mods[0]];
    return navItemHtml(m.icon, group.label, '#/module/' + mods[0], isModuleRoute(mods[0]), color);
  }
  if(mods.length === 0) return '';
  let html = '<div class="nav-section">' + escapeHtml(group.label) + '</div>';
  mods.forEach(k=>{
    const m = MODULES[k];
    html += navItemHtml(m.icon, m.label, '#/module/' + k, isModuleRoute(k), color);
  });
  return html;
}
function activeCategoryKey(){
  const r = parseRoute();
  const screenKey = r.screen === 'module' ? r.moduleKey : r.screen;
  if(STANDALONE_NAV_SCREENS.some(s=>s.key === screenKey)) return null; // these have their own top-level button, not a dropdown category.
  const groupKey = r.screen === 'module' ? MODULES[r.moduleKey].menu : r.screen;
  const cat = NAV_CATEGORIES.find(c => c.groups.indexOf(groupKey) !== -1);
  // Modules reachable only via a Dashboard quick-add / deep link (Meetings,
  // Action Items, Reminders, Office Follow-ups) have no nav presence at all
  // — nothing should light up as "active" for them, rather than guessing
  // the first category tab.
  return cat ? cat.key : null;
}
function currentScreenLabel(){
  const r = parseRoute();
  if(r.screen === 'module') return (MODULES[r.moduleKey] && MODULES[r.moduleKey].label) || r.moduleKey;
  const group = MAIN_MENUS.find(g=>g.key===r.screen);
  return group ? group.label : 'Dashboard';
}
function topNavCatsHtml(){
  const activeCat = activeCategoryKey();
  const r = parseRoute();
  const currentScreenKey = r.screen === 'module' ? r.moduleKey : r.screen;

  function standaloneBtnHtml(s, extraCls){
    const isActive = s.kind === 'module' ? isModuleRoute(s.key) : (currentScreenKey === s.key);
    return '<div class="topnav-cat' + (extraCls ? ' ' + extraCls : '') + (isActive ? ' active' : '') + '">'
      + '<button type="button" class="topnav-cat-btn" data-standalone-link="' + s.key + '"><span>' + s.icon + '</span><span>' + escapeHtml(s.label) + '</span></button></div>';
  }
  function categoryBtnHtml(cat, extraCls){
    let html = '<div class="topnav-cat' + (extraCls ? ' ' + extraCls : '') + (cat.key === activeCat ? ' active' : '') + '" data-cat="' + cat.key + '">';
    html += '<button type="button" class="topnav-cat-btn" data-cat-toggle="' + cat.key + '"><span>' + cat.icon + '</span><span>' + escapeHtml(cat.label) + '</span><span class="topnav-cat-chevron">▾</span></button>';
    html += '<div class="topnav-dropdown">';
    cat.groups.forEach(groupKey=>{

  }

  let html = '';

    if(entry.type === 'standalone'){
      const s = STANDALONE_NAV_SCREENS.find(x=>x.key === entry.key);
      if(s) html += standaloneBtnHtml(s);
    }else{
      const cat = NAV_CATEGORIES.find(x=>x.key === entry.key);
      if(cat) html += categoryBtnHtml(cat);

  });
  const adminCat = NAV_CATEGORIES.find(c=>c.key === NAV_ADMIN_CATEGORY_KEY);
  if(adminCat) html += categoryBtnHtml(adminCat, 'topnav-cat-admin');
  return html;

function closeAllNavDropdowns(){
  document.querySelectorAll('.topnav-cat.open').forEach(el=>el.classList.remove('open'));

function wireShell(){
  const catsEl = document.getElementById('topnav-cats');
  catsEl.addEventListener('click', (e)=>{
