    + '<p style="font-size:12.5px;color:var(--text-dim);">To point this app at a different backend or change the shared key, edit <code>DATA_API_URL</code> / <code>APP_KEY</code> near the top of index.html\'s &lt;script&gt; section.</p></div>';

  return html;
}
function wireAdmin(){
  document.getElementById('adm-save-profile').addEventListener('click', async ()=>{
    STATE.meta.facultyName = document.getElementById('adm-name').value.trim();
    STATE.meta.email = document.getElementById('adm-email').value.trim();
    STATE.meta.phone = document.getElementById('adm-phone').value.trim();
    await saveMeta();
    toast('Profile saved', 'ok');
    renderRoute();
  });
  document.getElementById('adm-save-pin').addEventListener('click', async ()=>{
    const errEl = document.getElementById('adm-pin-error');
    errEl.textContent = '';
    const oldPin = document.getElementById('adm-pin-old').value.trim();
    const newPin = document.getElementById('adm-pin-new').value.trim();
    const newPin2 = document.getElementById('adm-pin-new2').value.trim();
    if(!/^[0-9]{4}$/.test(newPin)){ errEl.textContent = 'New PIN must be exactly 4 digits.'; return; }
    if(newPin !== newPin2){ errEl.textContent = 'New PINs do not match.'; return; }
    try{ await doChangePin(oldPin, newPin); toast('PIN updated', 'ok'); document.getElementById('adm-pin-old').value=''; document.getElementById('adm-pin-new').value=''; document.getElementById('adm-pin-new2').value=''; }
    catch(err){ errEl.textContent = err.message || String(err); }
  });
  document.getElementById('adm-save-term').addEventListener('click', async ()=>{
    STATE.config.academicYear = document.getElementById('adm-year').value.trim();
    STATE.config.semester = document.getElementById('adm-sem').value.trim();
    await saveConfig();
    toast('Academic term saved', 'ok');
  });
  document.getElementById('adm-send-test').addEventListener('click', async ()=>{
    const resEl = document.getElementById('adm-test-result');
    const to = document.getElementById('adm-test-email').value.trim();
    if(!to){ resEl.textContent = 'Enter an email address first.'; return; }
    resEl.textContent = 'Sending…';
    const res = await apiTestEmail(to);
    resEl.textContent = res.ok ? ('Sent as ' + (res.sentAs || '(unknown)') + '. Remaining daily quota: ' + res.remainingQuota) : ('Failed: ' + (res.error || 'unknown error'));
  });
  document.getElementById('mm-send').addEventListener('click', async ()=>{
    const resEl = document.getElementById('mm-result');
    const lines = document.getElementById('mm-recipients').value.split('\n').map(l=>l.trim()).filter(Boolean);
    const recipients = lines.map(l=>{ const parts = l.split(','); return { name:(parts[0]||'').trim(), email:(parts[1]||'').trim() }; });
    const subject = document.getElementById('mm-subject').value;
    const body = document.getElementById('mm-body').value;
    if(recipients.length === 0){ resEl.textContent = 'Add at least one recipient.'; return; }
    resEl.textContent = 'Sending to ' + recipients.length + ' recipient(s)…';
    const res = await apiMailMerge(recipients, subject, body);
    if(!res.ok){ resEl.textContent = 'Failed: ' + (res.error || 'unknown error'); return; }
    const okCount = res.results.filter(r=>r.ok).length;
    resEl.innerHTML = okCount + ' / ' + res.results.length + ' sent successfully.' + res.results.filter(r=>!r.ok).map(r=>'<div style="color:var(--danger);font-size:12px;">' + escapeHtml(r.email||r.name) + ': ' + escapeHtml(r.error||'failed') + '</div>').join('');
  });
}

/* ============================================================
   PWA — installability + offline service worker
   ============================================================ */
let deferredInstallPrompt = null;
let installAvailable = false;
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredInstallPrompt = e;
  installAvailable = true;
  const btn = document.getElementById('install-btn');
  if(btn) btn.classList.remove('hidden');
});
window.addEventListener('appinstalled', ()=>{ deferredInstallPrompt = null; installAvailable = false; toast('FAMS+ installed', 'ok'); });
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(function(){ /* ok to fail on plain http/local preview */ }); });
}

/* ============================================================
   GO
   ============================================================ */
boot();
</script>
