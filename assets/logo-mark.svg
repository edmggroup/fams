<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2f5a"/>
      <stop offset="1" stop-color="#08142c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0c674"/>
      <stop offset="1" stop-color="#c99a3c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.35" cy="0.28" r="0.8">
      <stop offset="0" stop-color="#3157a0" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#1c2f5a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="32" cy="32" r="32" fill="url(#bg)"/>
  <circle cx="32" cy="32" r="32" fill="url(#glow)"/>

  <!-- orbital ring (physics) -->
  <ellipse cx="32" cy="34" rx="25" ry="10.5" fill="none" stroke="#7db0ff" stroke-width="2.4" opacity="0.55" transform="rotate(-20 32 34)"/>
  <circle cx="55.7" cy="26.2" r="2.6" fill="#9cc6ff" transform="rotate(-20 32 34)"/>

  <!-- graduation cap (teaching), enlarged + bolder for small-size legibility -->
  <g transform="translate(32,29)">
    <path d="M0 -12 L19.5 -4 L0 4 L-19.5 -4 Z" fill="url(#gold)"/>
    <path d="M-9 -0.6 L-9 8 Q0 13.2 9 8 L9 -0.6 L0 3.2 Z" fill="#f8efd9"/>
    <line x1="19.5" y1="-4" x2="19.5" y2="8" stroke="#e0b558" stroke-width="2"/>
    <circle cx="19.5" cy="9.6" r="2.3" fill="#e0b558"/>
  </g>
</svg>
