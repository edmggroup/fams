<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2f5a"/>
      <stop offset="1" stop-color="#0a1730"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0c674"/>
      <stop offset="1" stop-color="#c99a3c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#2c4a8f" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#1c2f5a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="32" cy="32" r="31" fill="url(#bg)"/>
  <circle cx="32" cy="32" r="31" fill="url(#glow)"/>
  <circle cx="32" cy="32" r="30.25" fill="none" stroke="url(#gold)" stroke-width="1.3" opacity="0.85"/>

  <!-- orbital ring (physics) -->
  <ellipse cx="32" cy="33.5" rx="23" ry="9.5" fill="none" stroke="#6fa3f5" stroke-width="1.6" opacity="0.5" transform="rotate(-20 32 33.5)"/>
  <ellipse cx="32" cy="33.5" rx="23" ry="9.5" fill="none" stroke="#6fa3f5" stroke-width="1.1" opacity="0.3" transform="rotate(48 32 33.5)"/>
  <circle cx="53.4" cy="26.2" r="2.1" fill="#8fbcff" transform="rotate(-20 32 33.5)"/>
  <circle cx="10.6" cy="40.8" r="1.5" fill="#6fa3f5" opacity="0.8" transform="rotate(-20 32 33.5)"/>

  <!-- graduation cap (teaching) -->
  <g transform="translate(31,29)">
    <path d="M0 -10 L16.5 -3.4 L0 3.2 L-16.5 -3.4 Z" fill="url(#gold)"/>
    <path d="M-7.6 -0.6 L-7.6 6.6 Q0 11 7.6 6.6 L7.6 -0.6 L0 2.7 Z" fill="#f6ecd4"/>
    <line x1="16.5" y1="-3.4" x2="16.5" y2="6.6" stroke="#e0b558" stroke-width="1.4"/>
    <circle cx="16.5" cy="7.9" r="1.7" fill="#e0b558"/>
  </g>

  <!-- plus badge (the "+" in FAMS+) -->
  <circle cx="48.5" cy="48.5" r="10" fill="#0f1f3d" stroke="url(#gold)" stroke-width="1.6"/>
  <path d="M48.5 44v9M44 48.5h9" stroke="#f0c674" stroke-width="2.2" stroke-linecap="round"/>
</svg>
